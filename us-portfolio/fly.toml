# Fly.io. Run `fly launch --copy-config --no-deploy` then `fly deploy` from
# this directory (us-portfolio/), which is the Docker build context.
app = "us-book"
primary_region = "bom"                # Mumbai; change to your nearest region

[build]
  dockerfile = "webapp/Dockerfile"

[env]
  PORT = "8000"
  QUOTE_TTL = "60"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"         # sleeps when idle, so the free tier lasts
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "60s"
    timeout = "10s"
    grace_period = "30s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
