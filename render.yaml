# Render Blueprint.
#
# This file must sit at the REPOSITORY ROOT — Render only looks here — and every
# path below is relative to that root, not to us-portfolio/.
#
# Deploy: https://dashboard.render.com/blueprints -> New Blueprint Instance ->
# pick this repo. No CLI, no local Docker, no token to paste.
services:
  - type: web
    name: us-book
    runtime: docker
    plan: free
    region: singapore                       # nearest Render region to India
    # The app lives on this branch, not main. Render defaults to main, which
    # has none of it, so this has to be explicit.
    branch: claude/us-portfolio-dashboard-analysis-3ymsyv
    dockerfilePath: ./us-portfolio/webapp/Dockerfile
    dockerContext: ./us-portfolio           # the Dockerfile COPYs data/ and webapp/
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Render generates this and shows it under Environment. Without it the
      # dashboard is open to anyone who finds the URL.
      - key: APP_TOKEN
        generateValue: true
      # sync: false means Render prompts for this when the blueprint is applied
      # and leaves it blank rather than committing a value. Get a free key at
      # finnhub.io/register — it is what makes quotes live from a datacentre,
      # where Yahoo and Stooq both refuse. Left empty the app still runs and
      # shows the statement close, labelled.
      - key: FINNHUB_API_KEY
        sync: false
      - key: QUOTE_TTL
        value: "60"
      - key: LOG_LEVEL
        value: INFO
