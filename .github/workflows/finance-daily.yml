name: "Finance channel: daily video"

# Every morning: take the next topic, render the Short + long video with the
# Tamil AI voice, put the files on a pre-release for preview, and open an
# approval issue. Nothing reaches YouTube until you reply /approve.

on:
  schedule:
    - cron: "30 1 * * *"   # 07:00 IST
  workflow_dispatch:
    inputs:
      topic:
        description: "Topic id to render, e.g. 002 (empty = next in the queue)"
        required: false
      rerender_issue:
        description: "Approval issue to update (set automatically by /rerender)"
        required: false

permissions:
  contents: write
  issues: write

concurrency:
  group: finance-channel-state
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: finance-channel
    env:
      GH_TOKEN: ${{ github.token }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TOPIC: ${{ inputs.topic }}
      REISSUE: ${{ inputs.rerender_issue }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: finance-channel/requirements.txt

      - name: Install ffmpeg, Python packages and Chromium
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Pick topic and render
        id: daily
        run: python -m pipeline daily ${TOPIC:+--topic "$TOPIC"}

      - name: Upload preview files to a pre-release
        if: steps.daily.outputs.skip == 'false'
        env:
          TAG: ${{ steps.daily.outputs.tag }}
          DIR: ${{ steps.daily.outputs.dir }}
          TITLE: ${{ steps.daily.outputs.title }}
        run: |
          files=$(ls "$DIR"/*.mp4 "$DIR"/*.png "$DIR"/*.json "$DIR"/*.srt 2>/dev/null)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $files --clobber
          else
            gh release create "$TAG" $files --prerelease --target "$GITHUB_SHA" \
              --title "Preview: $TITLE" --notes "Preview files waiting for approval. Not on YouTube yet."
          fi

      - name: Open the approval issue
        id: issue
        if: steps.daily.outputs.skip == 'false'
        env:
          DIR: ${{ steps.daily.outputs.dir }}
          TITLE: ${{ steps.daily.outputs.title }}
        run: |
          gh label create video-approval --color FFCA28 --description "Daily video waiting for approval" --force >/dev/null
          if [ -n "$REISSUE" ]; then
            gh issue edit "$REISSUE" --body-file "$DIR/issue.md"
            gh issue comment "$REISSUE" --body "🔁 Re-rendered from the latest script. The preview links above now point to the new files."
            echo "number=$REISSUE" >> "$GITHUB_OUTPUT"
          else
            url=$(gh issue create --title "$TITLE" --body-file "$DIR/issue.md" --label video-approval --assignee "$GITHUB_REPOSITORY_OWNER")
            echo "number=${url##*/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Save state
        if: steps.daily.outputs.skip == 'false'
        env:
          ID: ${{ steps.daily.outputs.topic }}
          TAG: ${{ steps.daily.outputs.tag }}
          NUM: ${{ steps.issue.outputs.number }}
        run: |
          python -m pipeline mark "$ID" --status awaiting_approval --issue "$NUM" --release "$TAG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state content
          git commit -q -m "Video #$ID rendered, waiting for approval (issue #$NUM)" || exit 0
          git pull -q --rebase && git push -q

      - name: Nothing to do today
        if: steps.daily.outputs.skip == 'true'
        env:
          REASON: ${{ steps.daily.outputs.reason }}
        run: |
          echo "::notice::Skipped: $REASON"
