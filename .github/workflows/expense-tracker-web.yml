name: "Expense tracker: web"

# Analyse, test and build the Flutter web app on every change. On the default
# branch, deploy to Firebase Hosting when a service-account secret is present.

on:
  push:
    paths: ["expense-tracker/**", ".github/workflows/expense-tracker-web.yml"]
  pull_request:
    paths: ["expense-tracker/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: expense-tracker
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      # Set the repository variable APPLE_SIGN_IN to true once Apple sign-in
      # is configured in Firebase (see expense-tracker/GO_LIVE.md).
      - run: flutter build web --release --dart-define=APPLE_SIGN_IN=${{ vars.APPLE_SIGN_IN || 'false' }}
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: expense-tracker/build/web

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    # Secrets can't be used in `if:` directly, so expose them as env first.
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: expense-tracker/build/web
      - name: Deploy to Firebase Hosting
        if: env.FIREBASE_SERVICE_ACCOUNT != '' && env.FIREBASE_PROJECT_ID != ''
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ env.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ env.FIREBASE_PROJECT_ID }}
          channelId: live
          entryPoint: expense-tracker
      - name: Explain skipped deploy
        if: env.FIREBASE_SERVICE_ACCOUNT == '' || env.FIREBASE_PROJECT_ID == ''
        run: echo "::notice::Deploy skipped. Add the FIREBASE_SERVICE_ACCOUNT secret and FIREBASE_PROJECT_ID variable (see expense-tracker/GO_LIVE.md)."
