name: "Investment agent: tests"

# On every change under investment-agent/: backend tests on SQLite and on Postgres
# (production uses Neon Postgres), the frontend type-check and build, and the Docker build.

on:
  push:
    paths: ["investment-agent/**", ".github/workflows/invest-*.yml"]
  pull_request:
    paths: ["investment-agent/**", ".github/workflows/invest-*.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: investment-agent/backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: invest
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: investment-agent/backend/requirements*.txt
      - run: pip install -q -r requirements-dev.txt
      - name: Tests (SQLite)
        run: python -m pytest tests -q
      - name: Tests (Postgres)
        env:
          TEST_DATABASE_URL: postgresql://postgres:ci@localhost:5432/invest
        run: python -m pytest tests -q -p no:cacheprovider

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: investment-agent/frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: investment-agent/frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Build the image Render will run
        run: docker build -t investment-analyst investment-agent
