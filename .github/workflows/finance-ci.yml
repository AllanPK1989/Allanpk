name: "Finance channel: check scripts"

# On every change under finance-channel/: run the tests and the compliance
# lint for every channel. When scripts change, render them with the real voice
# so you can watch a preview before the daily job picks them up.

on:
  push:
    paths: ["finance-channel/**", ".github/workflows/finance-*.yml"]
  pull_request:
    paths: ["finance-channel/**"]
  workflow_dispatch:
    inputs:
      topics:
        description: "Topic ids to preview, space separated (e.g. 001 002)"
        required: true

permissions:
  contents: write

jobs:
  check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: finance-channel
    outputs:
      topics: ${{ steps.changed.outputs.topics }}
      topics_en: ${{ steps.changed.outputs.topics_en }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: finance-channel/requirements.txt
      - run: pip install -q pyyaml pytest "anthropic>=1.11"
      - name: Unit tests
        run: python -m pytest tests -q
      - name: Compliance lint (all scripts, every channel)
        run: |
          python -m pipeline lint
          python -m pipeline --channel en lint
      - name: Which scripts changed?
        id: changed
        env:
          BEFORE: ${{ github.event.before || github.event.pull_request.base.sha }}
          DEFAULT: ${{ github.event.repository.default_branch }}
          INPUT: ${{ inputs.topics }}
        run: |
          # new branch: compare with the default branch instead of the previous push
          if ! git cat-file -e "${BEFORE:-0000}" 2>/dev/null; then BEFORE=$(git merge-base HEAD "origin/$DEFAULT" 2>/dev/null || true); fi
          if [ -n "$INPUT" ]; then topics="$INPUT"
          elif [ -n "$BEFORE" ]; then
            topics=$(git diff --name-only "$BEFORE" HEAD -- content | grep -oE '^finance-channel/content/[0-9]{3}' | cut -d/ -f3 | sort -u | head -3 | tr '\n' ' ')
            topics_en=$(git diff --name-only "$BEFORE" HEAD -- content/en | grep -oE 'content/en/[0-9]{3}' | cut -d/ -f3 | sort -u | head -3 | tr '\n' ' ')
            # renderer or workflow changed but no script did: smoke-test with topic 001
            if [ -z "$topics" ] && git diff --name-only "$BEFORE" HEAD -- pipeline config.yaml ../.github/workflows | grep -q .; then topics="001"; fi
            if [ -z "$topics_en" ] && git diff --name-only "$BEFORE" HEAD -- pipeline channels ../.github/workflows | grep -q .; then topics_en="001"; fi
          else topics=""; fi
          echo "topics=$topics" >> "$GITHUB_OUTPUT"
          echo "topics_en=$topics_en" >> "$GITHUB_OUTPUT"
          echo "Preview: ${topics:-none} · English: ${topics_en:-none}"

  preview:
    needs: check
    if: needs.check.outputs.topics != '' || needs.check.outputs.topics_en != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: finance-channel
    env:
      GH_TOKEN: ${{ github.token }}
      TOPICS: ${{ needs.check.outputs.topics }}
      TOPICS_EN: ${{ needs.check.outputs.topics_en }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: finance-channel/requirements.txt
      - name: Install ffmpeg, Python packages and a browser
        timeout-minutes: 12
        run: |
          pip install -q -r requirements.txt
          apt_get() {  # retry: package mirrors occasionally hang
            for i in 1 2 3; do
              timeout 240 sudo apt-get -o Acquire::Retries=3 -o DPkg::Lock::Timeout=120 "$@" && return 0
              echo "apt-get $* failed (attempt $i), retrying"; sleep 15
            done
            return 1
          }
          if ! command -v ffmpeg >/dev/null; then apt_get update -qq && apt_get install -y -qq ffmpeg; fi
          if command -v google-chrome >/dev/null; then
            echo "CHROMIUM_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            python -m playwright install --with-deps chromium
          fi
      - name: Render previews with the AI voice
        run: |
          for t in $TOPICS; do python -m pipeline render "$t" --out preview; done
          for t in $TOPICS_EN; do python -m pipeline --channel en render "$t" --out preview; done
      - uses: actions/upload-artifact@v4
        with:
          name: preview-${{ github.run_number }}
          path: finance-channel/preview
          retention-days: 14
      - name: Also attach to the rolling "ci-preview" pre-release (easy phone download)
        run: |
          files=$(ls preview/*/*.mp4 preview/*/*.png preview/en/*/*.mp4 preview/en/*/*.png 2>/dev/null)
          gh release view ci-preview >/dev/null 2>&1 || \
            gh release create ci-preview --prerelease --target "$GITHUB_SHA" --title "Script previews (CI)" \
              --notes "Latest previews rendered by CI when scripts change. Not published anywhere."
          gh release upload ci-preview $files --clobber
