name: "Finance channel: check scripts"

# On every change under finance-channel/: run the tests and the compliance
# lint. When scripts change, render them with the real Tamil voice so you can
# watch a preview before the daily job picks them up.

on:
  push:
    paths: ["finance-channel/**", ".github/workflows/finance-*.yml"]
  pull_request:
    paths: ["finance-channel/**"]
  workflow_dispatch:
    inputs:
      topics:
        description: "Topic ids to preview, space separated (e.g. 001 002)"
        required: true

permissions:
  contents: write

jobs:
  check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: finance-channel
    outputs:
      topics: ${{ steps.changed.outputs.topics }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: finance-channel/requirements.txt
      - run: pip install -q pyyaml pytest
      - name: Unit tests
        run: python -m pytest tests -q
      - name: Compliance lint (all scripts)
        run: python -m pipeline lint
      - name: Which scripts changed?
        id: changed
        env:
          BEFORE: ${{ github.event.before || github.event.pull_request.base.sha }}
          DEFAULT: ${{ github.event.repository.default_branch }}
          INPUT: ${{ inputs.topics }}
        run: |
          # new branch: compare with the default branch instead of the previous push
          if ! git cat-file -e "${BEFORE:-0000}" 2>/dev/null; then BEFORE=$(git merge-base HEAD "origin/$DEFAULT" 2>/dev/null || true); fi
          if [ -n "$INPUT" ]; then topics="$INPUT"
          elif [ -n "$BEFORE" ]; then
            topics=$(git diff --name-only "$BEFORE" HEAD -- content | grep -oE 'content/[0-9]{3}' | cut -d/ -f2 | sort -u | head -3 | tr '\n' ' ')
          else topics=""; fi
          echo "topics=$topics" >> "$GITHUB_OUTPUT"
          echo "Preview: ${topics:-none}"

  preview:
    needs: check
    if: needs.check.outputs.topics != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: finance-channel
    env:
      GH_TOKEN: ${{ github.token }}
      TOPICS: ${{ needs.check.outputs.topics }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: finance-channel/requirements.txt
      - name: Install ffmpeg, Python packages and Chromium
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Render previews with the Tamil voice
        run: for t in $TOPICS; do python -m pipeline render "$t" --out preview; done
      - uses: actions/upload-artifact@v4
        with:
          name: preview-${{ github.run_number }}
          path: finance-channel/preview
          retention-days: 14
      - name: Also attach to the rolling "ci-preview" pre-release (easy phone download)
        run: |
          files=$(ls preview/*/*.mp4 preview/*/*.png 2>/dev/null)
          gh release view ci-preview >/dev/null 2>&1 || \
            gh release create ci-preview --prerelease --target "$GITHUB_SHA" --title "Script previews (CI)" \
              --notes "Latest previews rendered by CI when scripts change. Not published anywhere."
          gh release upload ci-preview $files --clobber
