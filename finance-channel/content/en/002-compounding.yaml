short:
  scenes:
    - type: hook
      icon: up
      heading: "₹1 lakh, 20 years.\n**₹3 lakh or ₹6.7 lakh?**"
      say: "One lakh rupees, twenty years, ten percent interest a year. Do you end up with three lakh, or more than six and a half lakh?"
    - type: compare
      heading: "Two kinds of interest"
      left: {title: "Simple interest"}
      right: {title: "Compound interest"}
      rows:
        - left: "Interest on the principal only"
          right: "Principal + **interest on interest**"
          say: "With simple interest, you earn interest only on the principal. With compound interest, you also earn interest on the interest you've already earned."
        - left: "**₹3 lakh** in 20 years"
          right: "**₹6.7 lakh** in 20 years"
          say: "So in twenty years, simple interest gives you three lakh. Compound interest gives you about six lakh seventy thousand."
    - type: line
      heading: "The gap **grows** over time"
      xticks: [[0, "0"], [10, "10 yrs"], [20, "20 yrs"], [30, "30 yrs"]]
      yticks: [[1, "₹1L"], [5, "₹5L"], [10, "₹10L"], [15, "₹15L"]]
      series:
        - {name: "Simple", points: [[0, 1], [10, 2], [20, 3], [30, 4]], at: 0}
        - {name: "Compound", points: [[0, 1], [5, 1.61], [10, 2.59], [15, 4.18], [20, 6.73], [25, 10.83], [30, 17.45]], at: 1, color: "#fbbf24"}
      say:
        - "In thirty years, simple interest reaches only four lakh."
        - "Compound interest reaches about seventeen and a half lakh. Slow at first, then fast."
    - type: takeaway
