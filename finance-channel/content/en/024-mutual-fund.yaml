title_en: "What is a Mutual Fund?"
thumb_en: "Many people's money, **one expert manager**"
icon: users
keywords: [mutual fund, what is a mutual fund, NAV, fund manager, SEBI, mutual funds explained]
summary:
  - "How does a mutual fund work?"
  - "Units, NAV, fund manager: the basic terms"
