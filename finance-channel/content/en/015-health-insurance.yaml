long:
  intro_say: "Hello! Do you think that because you have an emergency fund, you don't need health insurance? Today, let's see why that isn't right."
  scenes:
    - type: hook
      chapter: "Why is it essential?"
      icon: heart
      heading: "Medical bills\n**don't send a warning**"
      say:
        - "One surgery, a few days in the ICU, one accident. The cost can run into lakhs within days."
        - "Medical costs are also said to rise faster than general inflation."
    - type: define
      chapter: "What is health insurance?"
      term: "Health Insurance"
      text: "The insurer pays hospital costs **up to the Sum Insured**, as per the policy terms. What you pay is a yearly **premium**."
      say:
        - "You pay a premium every year."
        - "If you need to be admitted to hospital, the insurance company pays those costs, up to the Sum Insured, as per the policy terms."
    - type: points
      chapter: "What's covered?"
      heading: "What is **usually covered**"
      say: "Every policy is different. But usually, these can be covered."
      marker: check
      items:
        - {text: "Costs while **admitted** to hospital", sub: "Room, doctor, medicines, tests", say: "Costs while you're admitted to hospital, like room charges, doctor's fees, medicines and tests."}
        - {text: "Some costs **before and after** admission", sub: "Pre & post hospitalisation", say: "Related costs for a set number of days before and after you're admitted."}
        - {text: "**Day-care** treatments", sub: "Treatments finished within a day", say: "Some treatments that are done within a single day, called day-care procedures."}
    - type: points
      chapter: "Is employer cover enough?"
      heading: "Employer cover: **the limits**"
      marker: cross
      items:
        - {text: "Change or lose your job and **the cover may end**", say: "Group insurance from your employer is a good benefit. But if you change or lose your job, it may end."}
        - {text: "It won't be there **after retirement**", say: "After retirement, when your medical needs are higher, that cover won't be there."}
        - {text: "**Buying new when older** is hard and costly", say: "Buying a new policy when you're older, or after an illness, is hard. And the premium is higher."}
    - type: points
      chapter: "A starter checklist"
      heading: "A **checklist** to get started"
      items:
        - {text: "**Enough Sum Insured** for costs in your city", say: "First, a Sum Insured that's enough for hospital costs in your city."}
        - {text: "Are **network hospitals** near you?", say: "Second, check whether the hospitals near your home are in that insurer's network."}
        - {text: "**Waiting period, room-rent limit, co-pay**", say: "Third, conditions like the waiting period, the room rent limit and co-pay. We'll explain these in upcoming videos."}
        - {text: "Don't hide **health details**", say: "Fourth, disclose your health details fully, including existing illnesses. Otherwise, a claim can run into trouble."}
    - type: takeaway
      text: "Health insurance is **a shield for your savings**. Think about it while you're young and healthy."
      say: "In short, health insurance is a shield that protects your savings and investments. It's best to think about it while you're healthy. Before you buy any policy, read its terms fully."
