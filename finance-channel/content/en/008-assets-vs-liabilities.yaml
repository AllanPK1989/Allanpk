short:
  scenes:
    - type: hook
      icon: question
      heading: "A new car:\n**asset or liability?**"
      say: "A new car bought on a loan. Is it your asset, or your liability?"
    - type: compare
      heading: "The simple difference"
      left: {title: "Asset", color: "#4ade80"}
      right: {title: "Liability", color: "#f87171"}
      rows:
        - {left: "Something you **own** that has value", right: "Something you **have to pay back**", say: "An asset is something you own that has value. A liability is a debt you have to pay back."}
        - {left: "Savings, investments", right: "Loans, card dues", say: "Savings and investments are assets. Loans and credit card dues are liabilities."}
    - type: points
      heading: "So what about **the car?**"
      marker: dot
      items:
        - {text: "The car is an asset, but **its value drops every year**", say: "The car is an asset. But its value drops every year. And it takes money out too, for fuel and maintenance."}
