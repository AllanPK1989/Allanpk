id: "016"
category: basics
title_ta: "நிதி மோசடிகளை அடையாளம் காண்பது எப்படி?"
title_en: "How to Spot Financial Scams"
thumb_ta: "'**மாதம் 10% லாபம்!**' — நம்பலாமா?"
icon: alert
keywords: [financial scams tamil, ponzi scheme, investment fraud, மோசடி, fake trading app, cyber fraud]
# This video quotes scammers' pitches so viewers can recognise them.
allow_phrases: ["உத்தரவாத லாபம்", "உறுதியான லாபம்"]
summary:
  - "நிதி மோசடிகளின் 5 எச்சரிக்கை அறிகுறிகள்"
  - "Ponzi திட்டம் எப்படி வேலை செய்கிறது"
  - "போலி 'trading' குழுக்கள், போலி ஆப்கள்"
  - "ஏமாந்தால் என்ன செய்வது: 1930 உதவி எண்"

short:
  scenes:
    - type: hook
      icon: alert
      heading: "'மாதம் **10% லாபம்**,\nஉத்தரவாதம்!'"
      say: "மாதம் பத்து சதவீதம் லாபம், உத்தரவாதம்! இப்படி ஒரு மெசேஜ் வந்தால், அது ஒரு பெரிய எச்சரிக்கை மணி."
    - type: points
      heading: "மோசடியின் **எச்சரிக்கை அறிகுறிகள்**"
      marker: cross
      items:
        - {text: "**உத்தரவாத லாபம்**, அதுவும் மிக அதிகமாக", say: "முதலாவது, மிக அதிக லாபம், அதுவும் உத்தரவாதத்துடன். சந்தையில் அப்படி எதுவும் கிடையாது."}
        - {text: "'**இன்றே** சேருங்கள், இடம் குறைவு'", say: "இரண்டாவது, அவசரப்படுத்துவது. இன்றே சேருங்கள், இடம் குறைவு என்று."}
        - {text: "**புதிய ஆட்களைச் சேர்த்தால்** கமிஷன்", say: "மூன்றாவது, புதிய ஆட்களைச் சேர்த்தால் கமிஷன். இது Ponzi திட்டங்களின் அடையாளம்."}
        - {text: "**பதிவு இல்லாத** நிறுவனம், நபர்", say: "நான்காவது, SEBI அல்லது RBI பதிவு இல்லாத நிறுவனம் அல்லது நபர்."}
    - type: takeaway
      text: "நம்ப முடியாத அளவுக்கு நல்லதாகத் தெரிந்தால், **பெரும்பாலும் அது மோசடிதான்**."
      say: "நினைவில் வையுங்கள். நம்ப முடியாத அளவுக்கு நல்லதாகத் தெரிந்தால், பெரும்பாலும் அது மோசடிதான்."

long:
  intro_say: "வணக்கம்! ஒவ்வொரு ஆண்டும், கடினமாக உழைத்துச் சேர்த்த பணத்தை, மோசடிகளில் பலர் இழக்கிறார்கள். இன்று, மோசடிகளை அடையாளம் காண்பது எப்படி என்று பார்க்கலாம்."
  scenes:
    - type: hook
      chapter: "ஒரு மெசேஜ்"
      icon: alert
      heading: "'மாதம் **10% லாபம்**,\n**உறுதியான லாபம்!**'"
      say:
        - "திடீரென ஒரு மெசேஜ். எங்கள் திட்டத்தில் சேர்ந்தால், மாதம் பத்து சதவீதம் லாபம், உறுதியான லாபம்."
        - "எழுபத்திரண்டு விதி நினைவிருக்கிறதா? மாதம் பத்து சதவீதம் என்றால், பணம் ஏழு மாதத்தில் இரட்டிப்பு. இது நடைமுறையில் சாத்தியமே இல்லாத வாக்குறுதி."
    - type: flow
      chapter: "Ponzi திட்டம்"
      heading: "Ponzi திட்டம் **எப்படி வேலை செய்கிறது?**"
      nodes:
        - {text: "முதலில் சேர்ந்தவர்களுக்கு 'லாபம்'", sub: "உண்மையில் புதியவர்களின் பணம்", say: "Ponzi திட்டத்தில், முதலில் சேர்ந்தவர்களுக்கு லாபம் கொடுக்கப்படுகிறது. ஆனால் அது உண்மையான லாபம் அல்ல. புதிதாகச் சேர்ந்தவர்களின் பணம்."}
        - {text: "நம்பிக்கை → மேலும் பலர் சேர்கிறார்கள்", say: "லாபம் வருவதைப் பார்த்து, நம்பிக்கையுடன் மேலும் பலர் சேர்கிறார்கள்."}
        - {text: "புதிய பணம் நின்றதும் → **சரிவு**", say: "புதிய ஆட்கள் சேர்வது குறைந்ததும், பணம் கொடுக்க முடியாமல், திட்டம் சரிகிறது. கடைசியில் சேர்ந்த பெரும்பாலோர் பணத்தை இழக்கிறார்கள்."}
    - type: points
      chapter: "5 எச்சரிக்கை அறிகுறிகள்"
      heading: "**5 எச்சரிக்கை** அறிகுறிகள்"
      marker: cross
      items:
        - {text: "மிக அதிக லாபம் + **உத்தரவாதம்**", say: "முதலாவது, மிக அதிக லாபம், அதுவும் உத்தரவாதத்துடன். சந்தை சார்ந்த எந்த முதலீட்டிலும், லாபத்துக்கு உத்தரவாதம் கிடையாது."}
        - {text: "**அவசரப்படுத்துதல்**: 'இன்றே கடைசி நாள்'", say: "இரண்டாவது, அவசரப்படுத்துதல். யோசிக்க நேரம் கொடுக்காமல், இன்றே முடிவு செய்யுங்கள் என்பது."}
        - {text: "**ஆள் சேர்த்தால்** கமிஷன், போனஸ்", say: "மூன்றாவது, புதிய ஆட்களைச் சேர்த்தால்தான் அதிக வருமானம் என்ற அமைப்பு."}
        - {text: "**பதிவு, ஆவணங்கள்** இல்லை", say: "நான்காவது, SEBI, RBI போன்ற ஒழுங்குமுறை அமைப்புகளின் பதிவு இல்லாதது, தெளிவான ஆவணங்கள் இல்லாதது."}
        - {text: "**பணம் எடுக்க** முடியாத நிலை", say: "ஐந்தாவது, பணம் போடுவது எளிது, ஆனால் எடுக்கும்போது, ஏதாவது காரணம் சொல்லித் தாமதப்படுத்துவது."}
    - type: points
      chapter: "புதிய வகை மோசடிகள்"
      heading: "இன்றைய **புதிய வகை** மோசடிகள்"
      marker: dot
      items:
        - {text: "போலி **'trading' குழுக்கள்**", sub: "சமூக ஊடகம், மெசேஜிங் ஆப் குழுக்கள்", say: "முதலாவது, சமூக ஊடகங்களிலும் மெசேஜிங் ஆப் குழுக்களிலும் நடத்தப்படும் போலி trading குழுக்கள். மற்றவர்கள் லாபம் பெறுவதாகக் காட்டும் screenshot-கள் பெரும்பாலும் போலி."}
        - {text: "போலி **முதலீட்டு ஆப்கள், இணையதளங்கள்**", say: "இரண்டாவது, உண்மையான நிறுவனங்களைப் போலத் தோற்றமளிக்கும் போலி ஆப்கள், இணையதளங்கள். அதில் லாபம் தெரியும், ஆனால் பணம் எடுக்க முடியாது."}
        - {text: "**OTP, PIN** கேட்கும் அழைப்புகள்", say: "மூன்றாவது, வங்கி அல்லது KYC பெயரில் அழைத்து, OTP, PIN கேட்பது. எந்த உண்மையான நிறுவனமும் இவற்றைக் கேட்காது."}
    - type: points
      chapter: "உங்களைப் பாதுகாக்க"
      heading: "உங்களைப் **பாதுகாக்க**"
      marker: check
      items:
        - {text: "**பதிவைச் சரிபாருங்கள்**: SEBI / RBI இணையதளங்களில்", say: "முதலாவது, எந்த நிறுவனம் அல்லது ஆலோசகராக இருந்தாலும், SEBI அல்லது RBI இணையதளங்களில் பதிவைச் சரிபாருங்கள்."}
        - {text: "**அவசர முடிவு வேண்டாம்**: யாரிடமாவது கேளுங்கள்", say: "இரண்டாவது, அவசரப்பட்டு முடிவெடுக்காதீர்கள். நம்பிக்கையான ஒருவரிடம் கேளுங்கள்."}
        - {text: "ஏமாந்தால்: **1930** சைபர் கிரைம் உதவி எண்", say: "மூன்றாவது, ஏமாந்துவிட்டால், உடனே தேசிய சைபர் கிரைம் உதவி எண் ஒன்பது மூன்று பூஜ்ஜியம், அதாவது 1930-ஐ அழைத்துப் புகார் செய்யுங்கள். சீக்கிரம் புகார் செய்தால், பணத்தை முடக்கும் வாய்ப்பு அதிகம்."}
    - type: takeaway
      text: "**அதிக லாபம் + உத்தரவாதம் + அவசரம்** = எச்சரிக்கை. நம்ப முடியாதது, பெரும்பாலும் உண்மையல்ல."
      say: "சுருக்கமாக, அதிக லாபம், உத்தரவாதம், அவசரம். இந்த மூன்றும் சேர்ந்து வந்தால், அது ஒரு பெரிய எச்சரிக்கை. நம்ப முடியாத அளவுக்கு நல்லதாகத் தெரிந்தால், பெரும்பாலும் அது உண்மை அல்ல. இந்த வீடியோவை உங்கள் குடும்பத்தினருடனும் பகிருங்கள்."
