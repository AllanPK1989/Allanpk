id: "002"
category: basics
title_ta: "கூட்டு வட்டியின் சக்தி"
title_en: "The Power of Compounding"
thumb_ta: "**வட்டிக்கு வட்டி** — பணம் எப்படி பெருகுகிறது?"
icon: up
keywords: [compounding, compound interest, கூட்டு வட்டி, power of compounding tamil, simple interest]
summary:
  - "சாதாரண வட்டி vs கூட்டு வட்டி — என்ன வித்தியாசம்?"
  - "வட்டிக்கு வட்டி: ஆண்டு வாரியாக ஒரு கணக்கு"
  - "கூட்டு வட்டி சூத்திரம்: A = P × (1 + r)ⁿ"
  - "நேரம் ஏன் மிக முக்கியமான மூலப்பொருள்"
  - "கடனிலும் கூட்டு வட்டி — உங்களுக்கு எதிராக"

short:
  scenes:
    - type: hook
      icon: up
      heading: "₹1 லட்சம், 20 வருடம்.\n**₹3 லட்சமா? ₹6.7 லட்சமா?**"
      say: "ஒரு லட்சம் ரூபாய், இருபது வருடம், ஆண்டுக்கு பத்து சதவீதம் வட்டி. கடைசியில் கிடைப்பது மூன்று லட்சமா, அல்லது ஆறரை லட்சத்திற்கும் மேலா?"
    - type: compare
      heading: "இரண்டு வகை வட்டி"
      left: {title: "சாதாரண வட்டி"}
      right: {title: "கூட்டு வட்டி"}
      rows:
        - left: "அசலுக்கு மட்டும் வட்டி"
          right: "அசல் + **வட்டிக்கும் வட்டி**"
          say: "சாதாரண வட்டியில், அசல் தொகைக்கு மட்டும்தான் வட்டி. கூட்டு வட்டியில், ஏற்கனவே கிடைத்த வட்டிக்கும் சேர்த்து வட்டி கிடைக்கும்."
        - left: "20 வருடத்தில் **₹3 லட்சம்**"
          right: "20 வருடத்தில் **₹6.7 லட்சம்**"
          say: "அதனால் இருபது வருடத்தில், சாதாரண வட்டியில் மூன்று லட்சம். கூட்டு வட்டியில் சுமார் ஆறு லட்சத்து எழுபதாயிரம்."
    - type: line
      heading: "வித்தியாசம் காலப்போக்கில் **பெரிதாகிறது**"
      xticks: [[0, "0"], [10, "10 ஆண்டு"], [20, "20 ஆண்டு"], [30, "30 ஆண்டு"]]
      yticks: [[1, "₹1L"], [5, "₹5L"], [10, "₹10L"], [15, "₹15L"]]
      series:
        - {name: "சாதாரண", points: [[0, 1], [10, 2], [20, 3], [30, 4]], at: 0}
        - {name: "கூட்டு", points: [[0, 1], [5, 1.61], [10, 2.59], [15, 4.18], [20, 6.73], [25, 10.83], [30, 17.45]], at: 1, color: "#fbbf24"}
      say:
        - "முப்பது வருடத்தில், சாதாரண வட்டி நான்கு லட்சம் மட்டுமே."
        - "கூட்டு வட்டியோ, சுமார் பதினேழரை லட்சம். ஆரம்பத்தில் மெதுவாக, பிறகு வேகமாக வளர்கிறது."
    - type: takeaway
      text: "கூட்டு வட்டியின் ரகசியம் **நேரம்**. எவ்வளவு சீக்கிரம் தொடங்குகிறீர்களோ, அவ்வளவு நல்லது."
      say: "கூட்டு வட்டியின் உண்மையான ரகசியம், நேரம். எவ்வளவு சீக்கிரம் தொடங்குகிறீர்களோ, அவ்வளவு அதிகமாக அது வேலை செய்யும்."

long:
  intro_say: "வணக்கம்! ஐன்ஸ்டீன் சொன்னதாகப் பரவலாகச் சொல்லப்படும் ஒரு வாக்கியம் உண்டு: கூட்டு வட்டி உலகின் எட்டாவது அதிசயம். இன்று அந்த அதிசயத்தை எளிமையாகப் புரிந்துகொள்வோம்."
  scenes:
    - type: hook
      chapter: "சதுரங்கப் பலகைக் கதை"
      icon: layers
      heading: "சதுரங்கப் பலகையில் **அரிசி**"
      sub: "ஒவ்வொரு கட்டத்திலும் இரண்டு மடங்கு"
      say:
        - "ஒரு பழைய கதை. சதுரங்கத்தைக் கண்டுபிடித்தவரிடம் அரசர், என்ன பரிசு வேண்டும் என்று கேட்டார்."
        - "அவர் சொன்னார்: முதல் கட்டத்தில் ஒரு அரிசி, இரண்டாவதில் இரண்டு, மூன்றாவதில் நான்கு. இப்படி ஒவ்வொரு கட்டத்திலும் இரண்டு மடங்கு."
        - "சின்ன பரிசு என்று நினைத்தார் அரசர். ஆனால் அறுபத்து நான்காவது கட்டத்தை எட்டும்போது, அது உலகம் முழுவதும் பல ஆண்டுகள் விளையும் அரிசியை விட அதிகம்!"
        - "தொடர்ந்து பெருகும் வளர்ச்சிக்கு இதுதான் சக்தி. கூட்டு வட்டியும் இதே போலத்தான் வேலை செய்கிறது."
    - type: define
      chapter: "இரண்டு வகை வட்டி"
      term: "சாதாரண வட்டி"
      term_en: "Simple Interest"
      text: "**அசல் தொகைக்கு மட்டும்** ஒவ்வொரு ஆண்டும் வட்டி. வட்டித் தொகை மாறாது."
      say:
        - "முதலில், சாதாரண வட்டி. இதில், நீங்கள் போட்ட அசல் தொகைக்கு மட்டும்தான் ஒவ்வொரு ஆண்டும் வட்டி கிடைக்கும்."
        - "ஒரு லட்சம் ரூபாய்க்கு பத்து சதவீதம் என்றால், ஒவ்வொரு ஆண்டும் அதே பத்தாயிரம் ரூபாய் வட்டி."
    - type: define
      term: "கூட்டு வட்டி"
      term_en: "Compound Interest"
      text: "அசலுக்கும், **ஏற்கனவே சேர்ந்த வட்டிக்கும்** சேர்த்து வட்டி. அதாவது **வட்டிக்கு வட்டி**."
      say:
        - "கூட்டு வட்டியில், கிடைத்த வட்டி மீண்டும் அசலுடன் சேர்கிறது."
        - "அடுத்த ஆண்டு, அந்தப் பெரிய தொகைக்கு வட்டி கிடைக்கிறது. இதைத்தான் வட்டிக்கு வட்டி என்கிறோம்."
    - type: steps
      chapter: "ஆண்டு வாரியாக ஒரு கணக்கு"
      heading: "₹1,00,000 @ 10% கூட்டு வட்டி"
      say: "ஒரு லட்சம் ரூபாய், ஆண்டுக்கு பத்து சதவீதம் கூட்டு வட்டி என்று வைத்துக்கொள்வோம்."
      lines:
        - {text: "1-ஆம் ஆண்டு: ₹1,00,000 + ₹10,000 = **₹1,10,000**", say: "முதல் ஆண்டு முடிவில், பத்தாயிரம் வட்டி சேர்ந்து, ஒரு லட்சத்து பத்தாயிரம்."}
        - {text: "2-ஆம் ஆண்டு: ₹1,10,000 + ₹11,000 = **₹1,21,000**", say: "இரண்டாம் ஆண்டு, வட்டி பத்தாயிரம் அல்ல, பதினொன்றாயிரம். ஏனென்றால் இப்போது ஒரு லட்சத்து பத்தாயிரத்துக்கு வட்டி."}
        - {text: "3-ஆம் ஆண்டு: ₹1,21,000 + ₹12,100 = **₹1,33,100**", say: "மூன்றாம் ஆண்டு, வட்டி பன்னிரண்டாயிரத்து நூறு. ஒவ்வொரு ஆண்டும் வட்டியே பெரிதாகிறது."}
      result: {text: "கூடுதல் ₹1,000, ₹2,100… இதுதான் **வட்டிக்கு வட்டி**", say: "சாதாரண வட்டியை விட கூடுதலாகக் கிடைக்கும் இந்தத் தொகைதான் வட்டிக்கு வட்டி. இது ஆண்டுகள் போகப் போக பனிப்பந்து போல உருள்கிறது."}
    - type: line
      chapter: "30 வருடத்தில் என்ன நடக்கும்?"
      heading: "₹1 லட்சம் @ 10%: சாதாரண vs **கூட்டு**"
      xticks: [[0, "0"], [10, "10 ஆண்டு"], [20, "20 ஆண்டு"], [30, "30 ஆண்டு"]]
      yticks: [[1, "₹1L"], [5, "₹5L"], [10, "₹10L"], [15, "₹15L"]]
      series:
        - {name: "சாதாரண ₹4L", points: [[0, 1], [10, 2], [20, 3], [30, 4]], at: 0}
        - {name: "கூட்டு ₹17.4L", points: [[0, 1], [5, 1.61], [10, 2.59], [15, 4.18], [20, 6.73], [25, 10.83], [30, 17.45]], at: 1, color: "#fbbf24"}
      say:
        - "இப்போது முப்பது வருடங்களுக்கு நீட்டிப் பார்ப்போம். சாதாரண வட்டியில், ஒரு லட்சம் நான்கு லட்சமாகிறது. நேர்கோட்டில், மெதுவாக."
        - "கூட்டு வட்டியில், அதே ஒரு லட்சம் சுமார் பதினேழரை லட்சமாகிறது."
        - "கவனியுங்கள், முதல் பத்து வருடம் இரண்டு கோடுகளும் அருகருகே இருக்கின்றன. கடைசி பத்து வருடங்களில்தான் பெரிய வளர்ச்சி நடக்கிறது."
    - type: formula
      chapter: "கூட்டு வட்டி சூத்திரம்"
      heading: "கூட்டு வட்டி சூத்திரம்"
      formula: "A = P × (1 + r)ⁿ"
      say: "இதைக் கணக்கிட ஒரு எளிய சூத்திரம் உண்டு."
      legend:
        - {sym: "A", text: "இறுதியில் கிடைக்கும் தொகை", say: "ஏ என்பது இறுதியில் கிடைக்கும் தொகை."}
        - {sym: "P", text: "ஆரம்ப அசல் தொகை", say: "பி என்பது நீங்கள் ஆரம்பத்தில் போடும் அசல் தொகை."}
        - {sym: "r", text: "ஆண்டு வட்டி விகிதம் (10% = 0.10)", say: "ஆர் என்பது ஆண்டு வட்டி விகிதம். பத்து சதவீதம் என்றால் பூஜ்ஜியம் புள்ளி ஒன்று."}
        - {sym: "n", text: "எத்தனை ஆண்டுகள்", say: "என் என்பது எத்தனை ஆண்டுகள். இந்த என், அடுக்கில் இருப்பதால்தான், நேரம் இவ்வளவு சக்தி வாய்ந்ததாக இருக்கிறது."}
    - type: points
      chapter: "மூன்று மூலப்பொருட்கள்"
      heading: "கூட்டு வட்டியின் 3 மூலப்பொருட்கள்"
      items:
        - {text: "**தொகை**: எவ்வளவு போடுகிறீர்கள்", say: "கூட்டு வட்டிக்கு மூன்று மூலப்பொருட்கள். முதலாவது, நீங்கள் போடும் தொகை."}
        - {text: "**விகிதம்**: எவ்வளவு வேகத்தில் வளர்கிறது", say: "இரண்டாவது, வளர்ச்சி விகிதம். ஆனால் அதிக விகிதம் என்றால் பொதுவாக அதிக அபாயமும் உண்டு."}
        - {text: "**நேரம்**: எவ்வளவு காலம் விடுகிறீர்கள்", say: "மூன்றாவது, மிக முக்கியமானது, நேரம். நேரத்தை யாராலும் பின்னால் சென்று வாங்க முடியாது."}
    - type: points
      chapter: "கடனில் கூட்டு வட்டி"
      heading: "எச்சரிக்கை: கடனிலும் **கூட்டு வட்டி**"
      marker: cross
      items:
        - {text: "கிரெடிட் கார்டு நிலுவையில் **வட்டிக்கு வட்டி**", say: "ஒரு எச்சரிக்கை. கூட்டு வட்டி உங்களுக்கு எதிராகவும் வேலை செய்யும். கிரெடிட் கார்டு நிலுவையைக் கட்டாமல் விட்டால், வட்டிக்கு வட்டி ஏறும்."}
        - {text: "கட்டாத கடன் **வேகமாகப் பெருகும்**", say: "அதிக வட்டிக் கடன்கள் கட்டப்படாமல் இருந்தால், அவை சேமிப்பை விட வேகமாகப் பெருகிவிடும்."}
    - type: takeaway
      text: "**சீக்கிரம் தொடங்கு, பொறுமையாக இரு** — கூட்டு வட்டியின் சக்தி நேரத்தில் இருக்கிறது."
      say: "சுருக்கமாக, கூட்டு வட்டி என்பது வட்டிக்கு வட்டி. அதன் சக்தி நேரத்தில் இருக்கிறது. சீக்கிரம் தொடங்குவதும், பொறுமையாக இருப்பதும்தான் அதன் ரகசியம்."
