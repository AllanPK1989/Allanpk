id: "018"
category: savings
title_ta: "ரெக்கரிங் டெபாசிட் (RD)"
title_en: "Recurring Deposit"
thumb_ta: "மாதம் கொஞ்சம், **இலக்கு பெரிசு**"
icon: calendar
keywords: [recurring deposit tamil, RD, ரெக்கரிங் டெபாசிட், monthly savings, short term goals]
summary:
  - "RD என்றால் என்ன, FD-யிலிருந்து எப்படி வேறுபடுகிறது?"
  - "குறுகிய கால இலக்குகளுக்கு RD எப்படி உதவும் (உதாரணம்)"
  - "தவணை தவறினால் என்ன ஆகும்?"
  - "RD வட்டிக்கும் வரி உண்டு"

short:
  scenes:
    - type: hook
      icon: calendar
      heading: "ஒரே நேரத்தில் பெரிய தொகை இல்லை.\n**மாதம் கொஞ்சம் முடியுமா?**"
      say: "FD போட, ஒரே நேரத்தில் பெரிய தொகை இல்லையா? மாதம் கொஞ்சம் கொஞ்சமாகச் சேமிக்க ஒரு எளிய வழி இருக்கிறது."
    - type: define
      term: "ரெக்கரிங் டெபாசிட்"
      term_en: "Recurring Deposit (RD)"
      text: "**ஒவ்வொரு மாதமும் ஒரே தொகையை**, குறிப்பிட்ட காலத்துக்கு, நிர்ணயிக்கப்பட்ட வட்டியில் போடுவது."
      say: "ஒவ்வொரு மாதமும் ஒரே தொகையை, குறிப்பிட்ட காலத்துக்கு, நிர்ணயிக்கப்பட்ட வட்டியில் போடுவதுதான் ரெக்கரிங் டெபாசிட்."
    - type: steps
      heading: "ஒரு வருட இலக்கு"
      lines:
        - {text: "இலக்கு: ஒரு வருடத்தில் **₹60,000**", say: "உதாரணமாக, ஒரு வருடத்தில் அறுபதாயிரம் ரூபாய் தேவை. ஒரு விழாவுக்கோ, புது laptop-க்கோ."}
        - {text: "மாதம் **₹5,000** RD × 12 மாதம்", say: "மாதம் ஐந்தாயிரம் ரூபாய் RD போட்டால், பன்னிரண்டு மாதத்தில் அறுபதாயிரம், அதோடு சிறிது வட்டி."}
      result: {text: "கடன் இல்லாமல் **இலக்கு நிறைவேறும்**", say: "இப்படி, கடன் வாங்காமலேயே இலக்கை அடையலாம்."}
    - type: takeaway
      text: "RD = **குறுகிய கால இலக்குகளுக்கான** ஒழுங்கான சேமிப்புப் பழக்கம்."
      say: "ரெக்கரிங் டெபாசிட், குறுகிய கால இலக்குகளுக்கு ஒழுங்காகச் சேமிக்க உதவும் ஒரு எளிய கருவி."

long:
  intro_say: "வணக்கம்! கடந்த வீடியோவில் FD பார்த்தோம். இன்று, மாதச் சம்பளம் வாங்குபவர்களுக்கு ஏற்ற அதன் சகோதரனைப் பார்க்கலாம். ரெக்கரிங் டெபாசிட்."
  scenes:
    - type: define
      chapter: "RD என்றால் என்ன?"
      term: "ரெக்கரிங் டெபாசிட்"
      term_en: "Recurring Deposit (RD)"
      text: "**ஒவ்வொரு மாதமும் ஒரே தொகையை**, குறிப்பிட்ட காலத்துக்கு (உதா: 6 மாதம் – 10 வருடம்), **நிர்ணயிக்கப்பட்ட வட்டியில்** போடுவது."
      say:
        - "ரெக்கரிங் டெபாசிட் என்பது, ஒவ்வொரு மாதமும் ஒரே தொகையை, ஒரு குறிப்பிட்ட காலத்துக்குப் போடுவது."
        - "தொடங்கும்போதே வட்டி விகிதம் நிர்ணயமாகிவிடும். காலம் முடிந்ததும், போட்ட மொத்தத் தொகையும் வட்டியும் சேர்த்துக் கிடைக்கும்."
    - type: compare
      chapter: "FD vs RD"
      heading: "FD vs **RD**"
      left: {title: "FD"}
      right: {title: "RD"}
      rows:
        - {left: "**ஒரே முறை** பெரிய தொகை", right: "**மாதா மாதம்** சிறிய தொகை", say: "FD-ல், ஒரே முறை ஒரு பெரிய தொகை போடுகிறோம். RD-ல், மாதா மாதம் ஒரு சிறிய தொகை."}
        - {left: "ஏற்கனவே பணம் உள்ளவர்களுக்கு", right: "**சம்பளத்திலிருந்து சேமிப்பவர்களுக்கு**", say: "கையில் ஏற்கனவே பணம் உள்ளவர்களுக்கு FD. மாதச் சம்பளத்திலிருந்து சேமிக்க நினைப்பவர்களுக்கு RD."}
        - {left: "வட்டி: நிர்ணயம்", right: "வட்டி: நிர்ணயம்", say: "இரண்டிலும், வட்டி விகிதம் தொடக்கத்திலேயே நிர்ணயமாகிவிடும்."}
    - type: steps
      chapter: "ஒரு உதாரணம்"
      heading: "ஒரு வருட இலக்குக்கு RD"
      say: "ஒரு உதாரணம். அடுத்த வருடம் ஒரு குடும்ப விழாவுக்கு, அறுபதாயிரம் ரூபாய் தேவை."
      lines:
        - {text: "இலக்கு: 12 மாதத்தில் **₹60,000**", say: "பன்னிரண்டு மாதத்தில் அறுபதாயிரம் ரூபாய் தேவை."}
        - {text: "மாதம் **₹5,000** RD", say: "மாதம் ஐந்தாயிரம் ரூபாய்க்கு, ஒரு வருட RD தொடங்குகிறீர்கள்."}
        - {text: "முதிர்வில்: ₹60,000 + **வட்டி**", say: "ஒரு வருடம் முடிந்ததும், போட்ட அறுபதாயிரமும், அதோடு வட்டியும் கிடைக்கும்."}
      result: {text: "கிரெடிட் கார்டு, கடன் இல்லாமல் **விழா முடிந்தது**", say: "இப்படி, கிரெடிட் கார்டோ கடனோ இல்லாமல், விழாவை நடத்தலாம். செலவுக்கு முன் சேமிப்பது, கடன் வாங்கிச் செலவு செய்வதை விட எவ்வளவோ மேல்."}
    - type: points
      chapter: "எதற்கு ஏற்றது?"
      heading: "RD **எதற்கு ஏற்றது?**"
      marker: check
      items:
        - {text: "**1–3 வருட** இலக்குகள்", sub: "விழா, பயணம், gadget, வண்டி down payment", say: "ஒன்று முதல் மூன்று வருடத்துக்குள் வரும் இலக்குகள். விழா, பயணம், புதிய பொருள், வண்டிக்கான முன்பணம் போன்றவை."}
        - {text: "**சேமிப்புப் பழக்கத்தை** உருவாக்க", say: "சேமிப்புப் பழக்கத்தைப் புதிதாகத் தொடங்குபவர்களுக்கு, ஒரு ஒழுங்கை உருவாக்க."}
        - {text: "**அபாயம் விரும்பாத** பணத்துக்கு", say: "இலக்குக்கான பணம், சந்தை ஏற்ற இறக்கத்தில் சிக்கக் கூடாது என்று நினைக்கும்போது."}
    - type: points
      chapter: "கவனிக்க வேண்டியவை"
      heading: "கவனிக்க **வேண்டியவை**"
      marker: dot
      items:
        - {text: "தவணை தவறினால் **அபராதம்** இருக்கலாம்", say: "மாதத் தவணையைத் தவறவிட்டால், சில வங்கிகள் அபராதம் விதிக்கலாம். auto-debit அமைப்பது நல்லது."}
        - {text: "RD வட்டிக்கும் **வருமான வரி** உண்டு", say: "FD போலவே, RD வட்டியும் உங்கள் வருமானத்துடன் சேர்த்து வரிக்கு உட்பட்டது."}
        - {text: "முன்கூட்டியே முடித்தால் **வட்டி குறையலாம்**", say: "காலம் முடியும் முன் முடித்தால், வட்டி குறைவாகக் கிடைக்கலாம்."}
    - type: takeaway
      text: "RD = **ஒழுங்கு + நிலைத்தன்மை**. குறுகிய கால இலக்குகளுக்கு, கடனுக்குப் பதிலாக **முன்கூட்டியே சேமியுங்கள்**."
      say: "சுருக்கமாக, RD ஒழுங்கையும் நிலைத்தன்மையையும் தருகிறது. குறுகிய கால இலக்குகளுக்கு, கடன் வாங்குவதற்குப் பதிலாக, முன்கூட்டியே சேமிக்க இது ஒரு எளிய வழி."
