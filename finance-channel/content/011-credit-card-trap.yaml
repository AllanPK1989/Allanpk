id: "011"
category: basics
title_ta: "கிரெடிட் கார்டு எப்படி வேலை செய்கிறது?"
title_en: "How Credit Cards Really Work"
thumb_ta: "'**Minimum Due**' கட்டினால் போதுமா?"
icon: card
keywords: [credit card tamil, minimum due trap, கிரெடிட் கார்டு, credit card interest, interest free period]
summary:
  - "Interest-free period: கடன் இலவசமாக இருக்கும் காலம்"
  - "Minimum Amount Due என்ற வலை"
  - "ஒரு உதாரணக் கணக்கு: கடன் ஏன் குறைவதில்லை?"
  - "கிரெடிட் கார்டைப் பாதுகாப்பாகப் பயன்படுத்த 4 விதிகள்"

short:
  scenes:
    - type: hook
      icon: card
      heading: "'**Minimum Due**' மட்டும் கட்டினால்\nபோதுமா?"
      say: "கிரெடிட் கார்டு பில்லில், Minimum Amount Due என்று ஒரு சின்ன தொகை இருக்கும். அதை மட்டும் கட்டினால் போதுமா?"
    - type: compare
      heading: "இரண்டு வழிகள், **இரண்டு முடிவுகள்**"
      left: {title: "முழுத் தொகை", color: "#4ade80"}
      right: {title: "Minimum Due மட்டும்", color: "#f87171"}
      rows:
        - {left: "வட்டி **₹0**", right: "மீதிக்கு **அதிக வட்டி**", say: "முழு பில்லையும் தேதிக்குள் கட்டினால், வட்டி பூஜ்ஜியம். Minimum Due மட்டும் கட்டினால், மீதித் தொகைக்கு அதிக வட்டி."}
        - {left: "Interest-free period **தொடரும்**", right: "புதுச் செலவுக்கும் **வட்டி**", say: "பொதுவாக, மீதி நிலுவை இருக்கும்போது, புதிதாகச் செய்யும் செலவுகளுக்கும் வட்டி இல்லாத சலுகை கிடைக்காமல் போகலாம்."}
    - type: stat
      label: "கார்டு வட்டி (உதாரணம்)"
      value: "மாதம் ~3.5%"
      to: "ஆண்டுக்கு ~40%+"
      caption: "Minimum Due = **கடன் வலை**"
      say: "கிரெடிட் கார்டு வட்டி, மாதம் சுமார் மூன்றரை சதவீதம் வரை இருக்கலாம்."
      to_say: "அது ஆண்டுக்கு நாற்பது சதவீதத்துக்கும் மேல். அதனால் Minimum Due மட்டும் கட்டுவது, ஒரு கடன் வலை."
    - type: takeaway
      text: "ஒவ்வொரு மாதமும் **முழு பில்லையும்** தேதிக்குள் கட்ட முடிந்தால் மட்டுமே கார்டு பயன்படுத்துங்கள்."
      say: "எளிய விதி. ஒவ்வொரு மாதமும் முழு பில்லையும் தேதிக்குள் கட்ட முடிந்தால் மட்டுமே, கிரெடிட் கார்டைப் பயன்படுத்துங்கள்."

long:
  intro_say: "வணக்கம்! கிரெடிட் கார்டு, சரியாகப் பயன்படுத்தினால் வசதியான கருவி. தவறாகப் பயன்படுத்தினால், மிக விலை உயர்ந்த கடன். இன்று அது எப்படி வேலை செய்கிறது என்று பார்க்கலாம்."
  scenes:
    - type: hook
      chapter: "இலவசப் பணமா?"
      icon: card
      heading: "கிரெடிட் கார்டு:\n**இலவசப் பணமா?**"
      say:
        - "கிரெடிட் கார்டு என்பது இலவசப் பணம் அல்ல. அது வங்கி உங்களுக்குக் கொடுக்கும் ஒரு குறுகிய காலக் கடன்."
        - "அந்தக் கடனை எப்போது, எவ்வளவு திருப்பிக் கட்டுகிறீர்கள் என்பதைப் பொறுத்துதான், அது இலவசமா, விலை உயர்ந்ததா என்பது முடிவாகிறது."
    - type: flow
      chapter: "பில்லிங் சுழற்சி"
      heading: "ஒரு மாதச் **சுழற்சி**"
      nodes:
        - {text: "செலவு செய்கிறீர்கள்", sub: "பில்லிங் காலம் (சுமார் 30 நாள்)", say: "பில்லிங் காலம் என்று சுமார் ஒரு மாதம் உண்டு. அதில் நீங்கள் செய்யும் செலவுகள் எல்லாம் சேர்கின்றன."}
        - {text: "Statement / பில் வருகிறது", say: "காலம் முடிந்ததும், ஒரு பில் அல்லது statement வருகிறது."}
        - {text: "Due date-க்குள் கட்ட வேண்டும்", sub: "சுமார் 15-20 நாள் கழித்து", say: "அதைக் கட்ட, இன்னும் சில வாரங்கள் அவகாசம் கிடைக்கும். அதுதான் due date."}
      after: "செலவு செய்த நாளிலிருந்து due date வரை, சில வாரங்கள் வரை வட்டி இல்லாத காலம் கிடைக்கும். இதைத்தான் interest-free period என்கிறார்கள். கார்டுக்குக் கார்டு இது மாறும்."
    - type: define
      chapter: "Minimum Amount Due"
      term: "Minimum Amount Due"
      term_en: "குறைந்தபட்சத் தொகை"
      text: "பில்லில் ஒரு **சிறிய பகுதி** மட்டும். இதைக் கட்டினால் **தாமதக் கட்டணம் தவிர்க்கப்படும்**, ஆனால் **மீதிக்கு வட்டி** தொடங்கும்."
      say:
        - "பில்லில், Minimum Amount Due என்று ஒரு சிறிய தொகை இருக்கும். பெரும்பாலும் மொத்த நிலுவையின் ஒரு சிறிய சதவீதம்."
        - "இதைக் கட்டினால், தாமதக் கட்டணம் தவிர்க்கப்படும். ஆனால் கடன் தீர்ந்துவிடவில்லை. மீதித் தொகைக்கு, அதிக வட்டி தொடங்கும்."
    - type: steps
      chapter: "ஒரு உதாரணக் கணக்கு"
      heading: "₹50,000 பில், Minimum Due மட்டும்"
      say: "ஒரு உதாரணக் கணக்கு பார்ப்போம். எண்கள் தோராயமானவை."
      lines:
        - {text: "பில்: **₹50,000**; Minimum Due (5%): **₹2,500**", say: "பில் ஐம்பதாயிரம். Minimum Due, ஐந்து சதவீதம் என்றால், இரண்டாயிரத்து ஐநூறு. அதை மட்டும் கட்டுகிறீர்கள்."}
        - {text: "மீதி **₹47,500** மீது மாதம் ~3.5% வட்டி ≈ **₹1,660**", say: "மீதி நாற்பத்தேழாயிரத்து ஐநூறுக்கு, மாதம் சுமார் மூன்றரை சதவீதம் வட்டி. அது சுமார் ஆயிரத்து அறுநூற்று அறுபது ரூபாய்."}
        - {text: "வட்டிக்கு மேல் **GST** ≈ ₹300", say: "அந்த வட்டிக்கு மேல், ஜி.எஸ்.டி. சுமார் முந்நூறு ரூபாய்."}
      result: {text: "அடுத்த பில் ≈ ₹49,500: **கடன் கிட்டத்தட்ட குறையவே இல்லை!**", say: "அடுத்த மாதம், புதுச் செலவு இல்லாமலேயே, பில் சுமார் நாற்பத்தொன்பதாயிரத்து ஐநூறு. இரண்டாயிரத்து ஐநூறு கட்டியும், கடன் கிட்டத்தட்ட குறையவே இல்லை."}
    - type: stat
      chapter: "வட்டி எவ்வளவு?"
      label: "கிரெடிட் கார்டு வட்டி (உதாரணம்)"
      value: "மாதம் ~3-3.75%"
      to: "ஆண்டுக்கு ~36-45%"
      caption: "பல கார்டுகளின் விகிதம். உங்கள் கார்டின் விகிதத்தை **அதன் விதிமுறைகளில்** சரிபாருங்கள்."
      say: "கிரெடிட் கார்டு வட்டி, மாதக் கணக்கில் சின்னதாகத் தெரியும். மாதம் மூன்று முதல் மூன்றே முக்கால் சதவீதம்."
      to_say: "ஆனால் ஆண்டுக்குக் கணக்கிட்டால், முப்பத்தாறு முதல் நாற்பத்தைந்து சதவீதம் வரை. இது பெரும்பாலான கடன்களை விட மிக அதிகம்."
    - type: points
      chapter: "பாதுகாப்பாகப் பயன்படுத்த 4 விதிகள்"
      heading: "கார்டைப் **பாதுகாப்பாகப்** பயன்படுத்த"
      marker: check
      items:
        - {text: "**முழு பில்லையும்** தேதிக்குள் கட்டுங்கள்", say: "முதல் விதி, ஒவ்வொரு மாதமும் முழு பில்லையும் due date-க்குள் கட்டுங்கள். முடிந்தால் auto-pay-ல் முழுத் தொகையையும் அமைத்துவிடுங்கள்."}
        - {text: "வரம்பில் **ஒரு பகுதி மட்டும்** பயன்படுத்துங்கள்", say: "இரண்டாவது, கார்டு வரம்பில் ஒரு சிறிய பகுதி மட்டும் பயன்படுத்துங்கள். இது கிரெடிட் ஸ்கோருக்கும் நல்லது."}
        - {text: "கார்டில் **பணம் எடுக்காதீர்கள்** (Cash advance)", say: "மூன்றாவது, கிரெடிட் கார்டில் ATM-ல் பணம் எடுக்காதீர்கள். பொதுவாக அதற்கு எடுத்த நாளிலிருந்தே வட்டியும், தனிக் கட்டணமும் உண்டு."}
        - {text: "நிலுவை இருந்தால் **முதலில் அதை அடையுங்கள்**", say: "நான்காவது, ஏற்கனவே நிலுவை இருந்தால், புதுச் செலவுகளை நிறுத்தி, முதலில் அதை அடையுங்கள். அதிக வட்டிக் கடனை அடைப்பதும் ஒரு நல்ல வருமானம் போலத்தான்."}
    - type: takeaway
      text: "கிரெடிட் கார்டு = **வசதி**, முழு பில் கட்டினால். **கடன் வலை**, Minimum Due மட்டும் கட்டினால்."
      say: "சுருக்கமாக, முழு பில்லையும் கட்டினால், கிரெடிட் கார்டு ஒரு வசதி. Minimum Due மட்டும் கட்டினால், அது ஒரு கடன் வலை. தேர்வு உங்கள் கையில்."
