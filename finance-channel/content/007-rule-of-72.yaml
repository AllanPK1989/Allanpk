id: "007"
category: basics
title_ta: "72 விதி"
title_en: "The Rule of 72"
thumb_ta: "பணம் **இரட்டிப்பாக** எத்தனை வருடம்?"
icon: calc
keywords: [rule of 72, 72 விதி, doubling time, money doubling tamil, compound interest shortcut]
summary:
  - "72 விதி என்றால் என்ன?"
  - "பணம் இரட்டிப்பாக எத்தனை ஆண்டுகள் ஆகும் — மனக்கணக்கில்"
  - "பணவீக்கத்துக்கும் இதே விதி: பணத்தின் மதிப்பு பாதியாக எத்தனை ஆண்டு?"
  - "இந்த விதியின் வரம்புகள்"

short:
  scenes:
    - type: hook
      icon: calc
      heading: "உங்கள் பணம் **இரட்டிப்பாக**\nஎத்தனை வருடம் ஆகும்?"
      say: "உங்கள் பணம் இரட்டிப்பாக எத்தனை வருடம் ஆகும்? கால்குலேட்டர் இல்லாமல், பத்து வினாடியில் கண்டுபிடிக்கலாம்."
    - type: formula
      heading: "72 விதி (Rule of 72)"
      formula: "ஆண்டுகள் ≈ 72 ÷ வளர்ச்சி விகிதம் (%)"
      say: "எழுபத்திரண்டை, ஆண்டு வளர்ச்சி விகிதத்தால் வகுங்கள். கிடைப்பது, பணம் இரட்டிப்பாகத் தேவையான தோராயமான ஆண்டுகள்."
    - type: bars
      heading: "இரட்டிப்பாக ஆகும் ஆண்டுகள்"
      bars:
        - {label: "6%", value: 12, display: "12 ஆண்டு", say: "ஆறு சதவீதம் என்றால், எழுபத்திரண்டு வகுத்தல் ஆறு, பன்னிரண்டு ஆண்டுகள்."}
        - {label: "8%", value: 9, display: "9 ஆண்டு", say: "எட்டு சதவீதம் என்றால், ஒன்பது ஆண்டுகள்."}
        - {label: "12%", value: 6, display: "6 ஆண்டு", say: "பன்னிரண்டு சதவீதம் என்றால், ஆறு ஆண்டுகள்."}
      note: "உதாரண விகிதங்கள் மட்டுமே"
    - type: takeaway
      text: "பணவீக்கம் 6% என்றால், உங்கள் பணத்தின் மதிப்பு **12 ஆண்டில் பாதியாகும்**!"
      say: "இதே விதி பணவீக்கத்துக்கும் பொருந்தும். பணவீக்கம் ஆறு சதவீதம் என்றால், சுமார் பன்னிரண்டு ஆண்டில் உங்கள் பணத்தின் வாங்கும் சக்தி பாதியாகிவிடும்."

long:
  intro_say: "வணக்கம்! இன்று ஒரு சின்ன கணக்கு ரகசியத்தைப் பார்க்கலாம். இது தெரிந்தால், எந்த வட்டி விகிதத்தையும் உடனே புரிந்துகொள்ள முடியும். அதுதான் எழுபத்திரண்டு விதி."
  scenes:
    - type: hook
      chapter: "ஒரு கேள்வி"
      icon: question
      heading: "'**8 வருடத்தில் இரட்டிப்பு!**'\nஎன்றால் எவ்வளவு வட்டி?"
      say:
        - "யாராவது, இந்தத் திட்டத்தில் உங்கள் பணம் எட்டு வருடத்தில் இரட்டிப்பாகும் என்று சொன்னால், அது ஆண்டுக்கு எவ்வளவு வளர்ச்சி என்று உங்களுக்கு உடனே தெரியுமா?"
        - "இந்த வீடியோ முடியும்போது, பத்து வினாடியில் சொல்லிவிடுவீர்கள்."
    - type: formula
      chapter: "72 விதி என்றால் என்ன?"
      heading: "72 விதி (Rule of 72)"
      formula: "ஆண்டுகள் ≈ 72 ÷ வளர்ச்சி விகிதம் (%)"
      say: "விதி மிக எளிது. எழுபத்திரண்டை, ஆண்டு வளர்ச்சி விகிதத்தால் வகுத்தால், பணம் இரட்டிப்பாகத் தேவையான தோராயமான ஆண்டுகள் கிடைக்கும்."
      legend:
        - {sym: "72", text: "எப்போதும் இதே எண்", say: "எழுபத்திரண்டு என்பது மாறாத எண்."}
        - {sym: "%", text: "ஆண்டு வளர்ச்சி அல்லது வட்டி விகிதம்", say: "வளர்ச்சி விகிதத்தை, சதவீத எண்ணாகவே போடுங்கள். எட்டு சதவீதம் என்றால், எட்டு."}
      after: "இது கூட்டு வட்டி அடிப்படையிலான ஒரு குறுக்கு வழி. துல்லியமான பதில் அல்ல, ஆனால் மிக அருகில் இருக்கும்."
    - type: bars
      chapter: "உதாரணங்கள்"
      heading: "பணம் இரட்டிப்பாக **எத்தனை ஆண்டு?**"
      say: "சில உதாரண விகிதங்களைப் பார்ப்போம்."
      bars:
        - {label: "4%", value: 18, display: "18 ஆண்டு", say: "நான்கு சதவீதம் என்றால், எழுபத்திரண்டு வகுத்தல் நான்கு, பதினெட்டு ஆண்டுகள்."}
        - {label: "6%", value: 12, display: "12 ஆண்டு", say: "ஆறு சதவீதம் என்றால், பன்னிரண்டு ஆண்டுகள்."}
        - {label: "8%", value: 9, display: "9 ஆண்டு", say: "எட்டு சதவீதம் என்றால், ஒன்பது ஆண்டுகள்."}
        - {label: "12%", value: 6, display: "6 ஆண்டு", say: "பன்னிரண்டு சதவீதம் என்றால், ஆறு ஆண்டுகள்."}
      note: "உதாரண விகிதங்கள் மட்டுமே; எந்த முதலீட்டுக்கும் உத்தரவாதம் அல்ல"
      after: "விகிதம் கொஞ்சம் கூடினாலும், இரட்டிப்பாகும் காலம் கணிசமாகக் குறைகிறது. ஆனால் அதிக விகிதம் என்றால், பொதுவாக அதிக அபாயமும் உண்டு என்பதை மறக்காதீர்கள்."
    - type: steps
      chapter: "தலைகீழாகவும் பயன்படுத்தலாம்"
      heading: "தலைகீழாக: **எவ்வளவு விகிதம்** தேவை?"
      say: "இந்த விதியைத் தலைகீழாகவும் பயன்படுத்தலாம். ஆரம்பக் கேள்விக்கு வருவோம்."
      lines:
        - {text: "'8 வருடத்தில் இரட்டிப்பு' என்றால்", say: "எட்டு வருடத்தில் இரட்டிப்பு என்று ஒருவர் சொன்னால்,"}
        - {text: "72 ÷ 8 = **9%**", say: "எழுபத்திரண்டை எட்டால் வகுங்கள். ஒன்பது. அதாவது ஆண்டுக்கு சுமார் ஒன்பது சதவீத வளர்ச்சி."}
        - {text: "'3 வருடத்தில் இரட்டிப்பு' என்றால் 72 ÷ 3 = **24%**!", say: "மூன்று வருடத்தில் இரட்டிப்பு என்றால், ஆண்டுக்கு இருபத்து நான்கு சதவீதம். இது மிக அதிகம்."}
      result: {text: "நம்ப முடியாத விகிதம் = **எச்சரிக்கை மணி**", say: "யாராவது மிகக் குறுகிய காலத்தில் இரட்டிப்பு என்று உத்தரவாதம் கொடுத்தால், இந்தக் கணக்கைப் போட்டுப் பாருங்கள். நம்ப முடியாத அளவுக்கு விகிதம் வந்தால், அது ஒரு எச்சரிக்கை மணி."}
    - type: stat
      chapter: "பணவீக்கத்துக்கும் இதே விதி"
      label: "பணவீக்கம் ஆண்டுக்கு 6% என்றால்"
      value: "₹1,00,000"
      to: "₹50,000"
      caption: "சுமார் **12 ஆண்டில்** வாங்கும் சக்தி **பாதியாகும்**"
      say: "இந்த விதியின் இன்னொரு முக்கியப் பயன், பணவீக்கம். பணவீக்கம் ஆண்டுக்கு ஆறு சதவீதம் என்றால், எழுபத்திரண்டு வகுத்தல் ஆறு, பன்னிரண்டு."
      to_say: "அதாவது, இன்று ஒரு லட்சம் ரூபாய்க்கு வாங்கும் பொருட்களை, பன்னிரண்டு வருடத்தில் அதே பணத்துக்குப் பாதி அளவுதான் வாங்க முடியும்."
    - type: points
      chapter: "வரம்புகள்"
      heading: "இந்த விதியின் **வரம்புகள்**"
      marker: dot
      items:
        - {text: "இது **தோராயமான** கணக்கு மட்டுமே", say: "முதலில், இது தோராயமான கணக்கு. சுமார் ஆறு முதல் பத்து சதவீத விகிதங்களில் மிகத் துல்லியமாக இருக்கும்."}
        - {text: "**நிலையான** விகிதத்தை எடுத்துக்கொள்கிறது", say: "இரண்டாவது, ஒவ்வொரு ஆண்டும் ஒரே விகிதம் என்று இது எடுத்துக்கொள்கிறது. பங்குச் சந்தை போன்றவற்றில் வருமானம் ஆண்டுக்கு ஆண்டு மாறும்."}
        - {text: "வரி, கட்டணங்களை **சேர்க்கவில்லை**", say: "மூன்றாவது, வரி, கட்டணங்கள் போன்றவற்றை இது கணக்கில் எடுப்பதில்லை."}
    - type: takeaway
      text: "**72 ÷ விகிதம்** = இரட்டிப்பாகும் ஆண்டுகள். வருமானத்துக்கும், பணவீக்கத்துக்கும், மோசடிகளைக் கண்டுபிடிக்கவும் உதவும்."
      say: "சுருக்கமாக, எழுபத்திரண்டை விகிதத்தால் வகுத்தால், இரட்டிப்பாகும் ஆண்டுகள் கிடைக்கும். வளர்ச்சியைப் புரிந்துகொள்ள, பணவீக்கத்தின் தாக்கத்தைப் பார்க்க, நம்ப முடியாத வாக்குறுதிகளைச் சோதிக்க, இது ஒரு அருமையான கருவி."
