id: "005"
category: savings
title_ta: "அவசர கால நிதி"
title_en: "Emergency Fund"
thumb_ta: "வேலை போனால் **எத்தனை மாதம்** சமாளிப்பீர்கள்?"
icon: umbrella
keywords: [emergency fund, அவசர கால நிதி, emergency fund tamil, savings tamil, financial safety net]
summary:
  - "அவசர கால நிதி (Emergency Fund) என்றால் என்ன?"
  - "எவ்வளவு தேவை? ஒரு உதாரணக் கணக்கு"
  - "எங்கே வைக்கலாம், எங்கே வைக்கக் கூடாது"
  - "படிப்படியாக எப்படி உருவாக்குவது"

short:
  scenes:
    - type: hook
      icon: umbrella
      heading: "நாளையே வேலை போனால்,\n**எத்தனை மாதம் சமாளிப்பீர்கள்?**"
      say: "நாளையே வேலை போனால், அல்லது திடீரென ஒரு பெரிய செலவு வந்தால், எத்தனை மாதம் சமாளிக்க முடியும்?"
    - type: define
      term: "அவசர கால நிதி"
      term_en: "Emergency Fund"
      text: "எதிர்பாராத செலவுக்கும், வருமான இழப்புக்கும் **மட்டுமே** ஒதுக்கி வைக்கும் பணம்."
      say: "எதிர்பாராத செலவுக்கும், வருமான இழப்புக்கும் மட்டுமே ஒதுக்கி வைக்கும் பணம்தான் அவசர கால நிதி."
    - type: steps
      heading: "எவ்வளவு தேவை?"
      lines:
        - {text: "மாத அத்தியாவசியச் செலவு: **₹30,000**", say: "உங்கள் மாத அத்தியாவசியச் செலவு முப்பதாயிரம் என்று வைத்துக்கொள்வோம்."}
        - {text: "× **6 மாதம்**", say: "பொதுவாக, ஆறு மாதச் செலவை வைத்திருப்பது நல்லது என்று சொல்லப்படுகிறது."}
      result: {text: "இலக்கு: ₹1,80,000", say: "அப்படியென்றால், உங்கள் இலக்கு ஒரு லட்சத்து எண்பதாயிரம் ரூபாய்."}
    - type: takeaway
      text: "இந்தப் பணம் **பாதுகாப்பாகவும், உடனே எடுக்கக்கூடியதாகவும்** இருக்க வேண்டும். லாபம் இதன் நோக்கம் அல்ல."
      say: "இந்தப் பணம் பாதுகாப்பாகவும், தேவைப்படும்போது உடனே எடுக்கக்கூடியதாகவும் இருக்க வேண்டும். அதிக லாபம் இதன் நோக்கம் அல்ல."

long:
  intro_say: "வணக்கம்! முதலீடு பற்றிப் பேசுவதற்கு முன், ஒவ்வொருவருக்கும் இருக்க வேண்டிய ஒரு பாதுகாப்பு வலையைப் பற்றிப் பார்க்கலாம். அவசர கால நிதி."
  scenes:
    - type: hook
      chapter: "ஏன் தேவை?"
      icon: alert
      heading: "வாழ்க்கை **எச்சரிக்கை கொடுத்துவிட்டு** வருவதில்லை"
      say:
        - "வேலை இழப்பு, மருத்துவச் செலவு, வண்டி பழுது, வீட்டில் திடீர் பழுது. இவை எதுவும் முன்கூட்டியே சொல்லிவிட்டு வருவதில்லை."
        - "அப்போது கையில் பணம் இல்லையென்றால், அதிக வட்டிக் கடன் வாங்கவோ, நீண்டகால முதலீடுகளை நஷ்டத்தில் விற்கவோ வேண்டி வரும்."
    - type: define
      chapter: "அவசர கால நிதி என்றால் என்ன?"
      term: "அவசர கால நிதி"
      term_en: "Emergency Fund"
      text: "எதிர்பாராத செலவுக்கும், வருமான இழப்புக்கும் **மட்டுமே** ஒதுக்கி வைக்கும் பணம். இது **முதலீடு அல்ல**, ஒரு **பாதுகாப்பு வலை**."
      say:
        - "எதிர்பாராத செலவுக்கும், வருமான இழப்புக்கும் மட்டுமே ஒதுக்கி வைக்கும் பணம்தான் அவசர கால நிதி."
        - "இதை ஒரு முதலீடாக நினைக்கக் கூடாது. இது ஒரு பாதுகாப்பு வலை. கீழே விழுந்தால் நம்மைத் தாங்கிப் பிடிப்பது."
    - type: points
      chapter: "எவ்வளவு தேவை?"
      heading: "எத்தனை மாதச் செலவு?"
      say: "எவ்வளவு வைத்திருக்க வேண்டும்? பொதுவாக மூன்று முதல் ஆறு மாத அத்தியாவசியச் செலவு என்று சொல்லப்படுகிறது. ஆனால் உங்கள் நிலையைப் பொறுத்து இது மாறும்."
      items:
        - {text: "நிலையான வேலை, இருவர் சம்பாதிக்கும் குடும்பம்: **3-6 மாதம்**", say: "நிலையான வேலை, குடும்பத்தில் இருவர் சம்பாதிக்கிறார்கள் என்றால், மூன்று முதல் ஆறு மாதம்."}
        - {text: "ஒருவர் மட்டும் சம்பாதிப்பவர்: **6 மாதம் அல்லது அதற்கு மேல்**", say: "குடும்பத்தில் ஒருவர் மட்டுமே சம்பாதிக்கிறார் என்றால், ஆறு மாதம் அல்லது அதற்கு மேல்."}
        - {text: "சுயதொழில், மாறும் வருமானம்: **9-12 மாதம்**", say: "சுயதொழில் செய்பவர்கள், வருமானம் மாதா மாதம் மாறுபவர்கள், ஒன்பது முதல் பன்னிரண்டு மாதம் வைத்திருப்பது பாதுகாப்பானது."}
    - type: steps
      chapter: "ஒரு உதாரணக் கணக்கு"
      heading: "மாத அத்தியாவசியச் செலவு"
      say: "மாத அத்தியாவசியச் செலவு என்றால் என்ன என்று ஒரு உதாரணத்துடன் பார்ப்போம்."
      lines:
        - {text: "வாடகை + மளிகை + பில்கள்: **₹22,000**", say: "வாடகை, மளிகை, மின்சாரம், போன் பில்கள் சேர்த்து இருபத்திரண்டாயிரம்."}
        - {text: "கடன் EMI: **₹5,000**", say: "ஏதாவது கடன் EMI இருந்தால், அது ஐந்தாயிரம்."}
        - {text: "காப்பீட்டுப் பிரீமியம் (மாத சராசரி): **₹3,000**", say: "காப்பீட்டுப் பிரீமியங்களின் மாத சராசரி மூவாயிரம். மொத்தம் முப்பதாயிரம்."}
        - {text: "₹30,000 × 6 மாதம்", say: "இதை ஆறு மாதத்தால் பெருக்குங்கள்."}
      result: {text: "இலக்கு: ₹1,80,000", say: "உங்கள் அவசர கால நிதி இலக்கு, ஒரு லட்சத்து எண்பதாயிரம் ரூபாய். விருப்பச் செலவுகளை இதில் சேர்க்கத் தேவையில்லை."}
    - type: compare
      chapter: "எங்கே வைப்பது?"
      heading: "எங்கே வைக்கலாம்?"
      left: {title: "பொருத்தமானவை", color: "#4ade80"}
      right: {title: "பொருத்தமற்றவை", color: "#f87171"}
      say: "இந்தப் பணத்துக்கு இரண்டு குணங்கள் வேண்டும். பாதுகாப்பு, மற்றும் உடனே எடுக்கும் வசதி."
      rows:
        - {left: "சேமிப்புக் கணக்கு", right: "பங்குகள்", say: "ஒரு பகுதியை சேமிப்புக் கணக்கில் வைக்கலாம். பங்குகளில் வைக்கக் கூடாது, ஏனென்றால் அவசரத்தின்போது சந்தை இறங்கியிருக்கலாம்."}
        - {left: "Fixed Deposit (FD)", right: "நீண்ட lock-in உள்ளவை", say: "ஒரு பகுதியை FD-யில் வைக்கலாம். நீண்ட lock-in உள்ள திட்டங்கள் பொருந்தாது."}
        - {left: "Liquid Fund", right: "நிலம், வீடு", say: "குறைந்த அபாயம் உள்ள liquid fund-களையும் சிலர் பயன்படுத்துகிறார்கள். நிலம், வீடு போன்றவற்றை உடனே விற்க முடியாது."}
      after: "வங்கியில் உள்ள டெபாசிட்டுகளுக்கு, ஒரு குறிப்பிட்ட வரம்பு வரை காப்பீடு உண்டு. அந்த வரம்பை வங்கியின் இணையதளத்தில் சரிபார்த்துக்கொள்ளுங்கள்."
    - type: points
      chapter: "படிப்படியாக உருவாக்குவது"
      heading: "படிப்படியாக **உருவாக்குங்கள்**"
      marker: check
      items:
        - {text: "முதல் இலக்கு: **ஒரு மாதச் செலவு**", say: "ஒரே நேரத்தில் முழுத் தொகையும் தேவையில்லை. முதல் இலக்கு, ஒரு மாதச் செலவு."}
        - {text: "மாதா மாதம் **தானியங்கியாக** சேர்த்தல்", say: "சம்பளம் வந்தவுடன், ஒரு சிறிய தொகை தானாக இந்தக் கணக்குக்குச் செல்லுமாறு ஏற்பாடு செய்யுங்கள்."}
        - {text: "போனஸ், பரிசுப் பணம் → **அவசர நிதிக்கு**", say: "போனஸ், பரிசுப் பணம் போன்ற கூடுதல் வருமானத்தின் ஒரு பகுதியை இதற்குப் போடுங்கள்."}
        - {text: "பயன்படுத்தினால் **மீண்டும் நிரப்புங்கள்**", say: "பயன்படுத்த வேண்டி வந்தால், அதன் பிறகு மீண்டும் நிரப்புவதை முதல் வேலையாக வையுங்கள்."}
    - type: points
      chapter: "தவிர்க்க வேண்டிய தவறுகள்"
      heading: "தவிர்க்க வேண்டிய **தவறுகள்**"
      marker: cross
      items:
        - {text: "Sale, சுற்றுலாவுக்கு **இதைத் தொடுவது**", say: "ஆஃபர் விற்பனை, சுற்றுலா போன்றவற்றுக்கு இந்தப் பணத்தைத் தொடுவது, முதல் பெரிய தவறு."}
        - {text: "**காப்பீட்டுக்குப் பதிலாக** இதை நினைப்பது", say: "இரண்டாவது, அவசர நிதி இருக்கிறது, அதனால் ஹெல்த் இன்சூரன்ஸ் தேவையில்லை என்று நினைப்பது. ஒரு பெரிய மருத்துவமனைச் செலவு, அவசர நிதியை ஒரே நாளில் காலி செய்துவிடும்."}
    - type: takeaway
      text: "முதலீட்டுக்கு முன், **பாதுகாப்பு வலை**. அவசர கால நிதி உங்களுக்கு **மன அமைதியைத்** தருகிறது."
      say: "சுருக்கமாக, முதலீடு செய்வதற்கு முன், ஒரு பாதுகாப்பு வலை தேவை. அவசர கால நிதி, கஷ்ட காலத்தில் கடன் வாங்காமலும், முதலீடுகளைத் தொடாமலும் சமாளிக்க உதவுகிறது. அதைவிட முக்கியமாக, மன அமைதியைத் தருகிறது."
