id: "026"
category: stocks
title_ta: "பங்கு (Share) என்றால் என்ன?"
title_en: "What is a Share?"
thumb_ta: "ஒரு நிறுவனத்தின் **சிறு உரிமையாளர்** ஆகலாம்!"
icon: pie
keywords: [what is a share, share market tamil, பங்கு, stock basics tamil, shareholder, equity]
summary:
  - "பங்கு (Share) என்றால் என்ன?"
  - "நிறுவனங்கள் ஏன் பங்குகளை வெளியிடுகின்றன?"
  - "பங்குதாரருக்கு என்ன கிடைக்கும், என்ன அபாயம்?"
  - "ஒரு எளிய உதாரணம்: உங்கள் உரிமை எவ்வளவு?"

short:
  scenes:
    - type: hook
      icon: building
      heading: "ஒரு பெரிய நிறுவனத்தின்\n**உரிமையாளர்** ஆக முடியுமா?"
      say: "ஒரு பெரிய நிறுவனத்தின் உரிமையாளர் ஆக, கோடிக்கணக்கில் பணம் வேண்டுமா? இல்லை. ஒரு பங்கு வாங்கினால் போதும்."
    - type: define
      term: "பங்கு"
      term_en: "Share / Stock"
      text: "ஒரு நிறுவனத்தின் உரிமையில் ஒரு **சிறு அலகு**. பங்கு வைத்திருப்பவர் அந்த நிறுவனத்தின் **பங்குதாரர்**."
      say: "பங்கு என்பது, ஒரு நிறுவனத்தின் உரிமையில் ஒரு சிறு அலகு. அதை வைத்திருப்பவர், அந்த நிறுவனத்தின் பங்குதாரர்."
    - type: compare
      heading: "பங்குதாரருக்கு **என்ன கிடைக்கும்?**"
      left: {title: "சாத்தியமான பலன்கள்", color: "#4ade80"}
      right: {title: "அபாயங்கள்", color: "#f87171"}
      rows:
        - {left: "நிறுவனம் வளர்ந்தால், பங்கின் **மதிப்பு உயரலாம்**", right: "நிறுவனம் தடுமாறினால், **மதிப்பு இறங்கலாம்**", say: "நிறுவனம் வளர்ந்தால், பங்கின் மதிப்பு உயரலாம். தடுமாறினால், இறங்கலாம்."}
        - {left: "லாபத்தில் ஒரு பகுதி: **டிவிடெண்ட்**", right: "டிவிடெண்ட் **உத்தரவாதம் இல்லை**", say: "சில நிறுவனங்கள், லாபத்தில் ஒரு பகுதியை டிவிடெண்டாகப் பகிர்கின்றன. ஆனால் அதற்கு உத்தரவாதம் இல்லை."}
    - type: takeaway
      text: "பங்கு வாங்குவது = ஒரு **வணிகத்தில் பங்குதாரர்** ஆவது. அதன் **வெற்றியும் தோல்வியும்** உங்களையும் பாதிக்கும்."
      say: "பங்கு வாங்குவது என்பது, ஒரு வணிகத்தின் பங்குதாரர் ஆவது. அதன் வெற்றியும் தோல்வியும் உங்களையும் பாதிக்கும்."

long:
  intro_say: "வணக்கம்! இன்றிலிருந்து, பங்குச் சந்தை என்ற பெரிய உலகத்துக்குள் அடியெடுத்து வைக்கிறோம். முதல் கேள்வி, பங்கு என்றால் என்ன?"
  scenes:
    - type: hook
      chapter: "ஒரு டீக்கடைக் கதை"
      icon: users
      heading: "நான்கு நண்பர்கள்,\n**ஒரு டீக்கடை**"
      say:
        - "நான்கு நண்பர்கள், ஆளுக்கு ஒரு லட்சம் போட்டு, ஒரு டீக்கடை தொடங்குகிறார்கள். கடை நான்கு லட்சம் மதிப்புள்ள வணிகம்."
        - "ஒவ்வொருவருக்கும் கடையில் நான்கில் ஒரு பங்கு உரிமை. லாபம் வந்தால், நான்கில் ஒரு பங்கு. நஷ்டம் வந்தாலும், நான்கில் ஒரு பங்கு."
        - "பெரிய நிறுவனங்களும் இப்படித்தான். ஆனால் நான்கு பங்குகளுக்குப் பதிலாக, கோடிக்கணக்கான பங்குகள்."
    - type: define
      chapter: "பங்கு என்றால் என்ன?"
      term: "பங்கு"
      term_en: "Share / Stock / Equity"
      text: "ஒரு நிறுவனத்தின் உரிமையில் ஒரு **சிறு அலகு**. பங்கு வைத்திருப்பவர், அந்த நிறுவனத்தின் **பங்குதாரர்** (Shareholder)."
      say:
        - "பங்கு என்பது, ஒரு நிறுவனத்தின் உரிமையில் ஒரு சிறு அலகு. ஆங்கிலத்தில் share, stock, equity என்று பல பெயர்கள்."
        - "பங்கு வைத்திருப்பவரை, பங்குதாரர் என்கிறோம். நீங்கள் ஒரு பங்கு வாங்கினாலும், அந்த நிறுவனத்தின் ஒரு சிறிய உரிமையாளர் ஆகிறீர்கள்."
    - type: steps
      chapter: "உங்கள் உரிமை எவ்வளவு?"
      heading: "Company A: உங்கள் **உரிமை எவ்வளவு?**"
      say: "ஒரு கற்பனை நிறுவனம், Company A. அதன் கணக்கைப் பார்ப்போம்."
      lines:
        - {text: "Company A-வின் மொத்தப் பங்குகள்: **1 கோடி**", say: "Company A, மொத்தம் ஒரு கோடி பங்குகளாகப் பிரிக்கப்பட்டிருக்கிறது."}
        - {text: "நீங்கள் வாங்கியது: **100 பங்குகள்**", say: "நீங்கள் நூறு பங்குகள் வாங்குகிறீர்கள்."}
        - {text: "உங்கள் உரிமை: 100 ÷ 1,00,00,000 = **0.001%**", say: "அப்படியென்றால், நிறுவனத்தில் உங்கள் உரிமை, பூஜ்ஜியம் புள்ளி பூஜ்ஜியம் பூஜ்ஜியம் ஒன்று சதவீதம்."}
      result: {text: "சிறிய பங்குதான், ஆனால் **உண்மையான உரிமை**", say: "சிறிய பங்குதான். ஆனால் அது உண்மையான உரிமை. நிறுவனத்தின் லாப நஷ்டத்தில், அந்த விகிதத்தில் நீங்களும் பங்கு பெறுகிறீர்கள்."}
    - type: points
      chapter: "நிறுவனங்கள் ஏன் பங்கு விற்கின்றன?"
      heading: "நிறுவனங்கள் **ஏன் பங்கு விற்கின்றன?**"
      items:
        - {text: "**வளர்ச்சிக்கு மூலதனம்**: புதிய தொழிற்சாலை, கிளைகள்", say: "நிறுவனங்கள் பங்குகளை விற்பது, முக்கியமாக வளர்ச்சிக்கான பணம் திரட்ட. புதிய தொழிற்சாலை, புதிய கிளைகள், புதிய பொருட்கள்."}
        - {text: "**கடன் இல்லாமல்** பணம் திரட்ட", say: "கடன் வாங்கினால் வட்டி கட்ட வேண்டும். பங்கு விற்றால், வட்டி இல்லை. ஆனால் உரிமையைப் பகிர வேண்டும்."}
        - {text: "**ஆரம்ப முதலீட்டாளர்கள்** வெளியேற", say: "சில நேரம், நிறுவனத்தின் ஆரம்ப முதலீட்டாளர்கள், தங்கள் பங்குகளை விற்று வெளியேறவும் இது உதவுகிறது."}
    - type: compare
      chapter: "பலன்களும் அபாயங்களும்"
      heading: "பங்குதாரர்: **பலன்கள் vs அபாயங்கள்**"
      left: {title: "சாத்தியமான பலன்கள்", color: "#4ade80"}
      right: {title: "அபாயங்கள்", color: "#f87171"}
      rows:
        - {left: "பங்கின் **மதிப்பு உயரலாம்**", right: "மதிப்பு **இறங்கலாம்**, பெரிதாகவும்", say: "நிறுவனம் நன்றாக வளர்ந்தால், பங்கின் மதிப்பு உயரலாம். மோசமாகச் செயல்பட்டால், மதிப்பு இறங்கலாம். சில நேரம் மிகப் பெரிதாக."}
        - {left: "**டிவிடெண்ட்**: லாபத்தில் பங்கு", right: "டிவிடெண்ட் **கட்டாயம் அல்ல**", say: "லாபத்தில் ஒரு பகுதியை, சில நிறுவனங்கள் டிவிடெண்டாகப் பகிர்கின்றன. ஆனால் அது கட்டாயம் அல்ல."}
        - {left: "**வாக்குரிமை**: முக்கிய முடிவுகளில்", right: "நிறுவனம் மூடினால், **கடைசியில்தான்** பங்குதாரர்கள்", say: "பங்குதாரர்களுக்கு, முக்கிய முடிவுகளில் வாக்களிக்கும் உரிமை உண்டு. ஆனால் நிறுவனம் மூடப்பட்டால், கடன் கொடுத்தவர்களுக்குப் பிறகுதான், மீதி இருந்தால் பங்குதாரர்களுக்கு."}
      after: "ஒரு நல்ல செய்தி. சாதாரணப் பங்குகளில், நீங்கள் போட்ட பணத்தை விட அதிகமாக இழக்க முடியாது. நிறுவனத்தின் கடனுக்கு நீங்கள் பொறுப்பல்ல."
    - type: takeaway
      text: "பங்கு = **வணிகத்தில் உரிமை**. விலையை மட்டும் பார்க்காமல், **பின்னால் உள்ள வணிகத்தைப்** புரிந்துகொள்ள வேண்டும்."
      say: "சுருக்கமாக, பங்கு என்பது ஒரு வணிகத்தில் உரிமை. அதனால், பங்கின் விலையை மட்டும் பார்க்காமல், அதன் பின்னால் உள்ள வணிகத்தைப் புரிந்துகொள்வதுதான் முக்கியம். அடுத்த வீடியோவில், இந்தப் பங்குகள் வாங்கி விற்கப்படும் இடமான பங்குச் சந்தையைப் பார்க்கலாம்."
