id: "023"
category: investing
title_ta: "ஏன் சீக்கிரம் முதலீடு தொடங்க வேண்டும்?"
title_en: "Why Start Investing Early?"
thumb_ta: "**10 வருடம் முன்பே** தொடங்கினால்?"
icon: clock
keywords: [start investing early, cost of delay, compounding tamil, early investing, சீக்கிரம் முதலீடு]
summary:
  - "இரண்டு நண்பர்களின் கதை (கற்பனை உதாரணம்)"
  - "தாமதத்தின் விலை (Cost of delay)"
  - "சின்னத் தொகையில் தொடங்குவதன் சக்தி"
  - "சீக்கிரம் தொடங்குவது என்றால் அவசரப்படுவது அல்ல"

short:
  scenes:
    - type: hook
      icon: clock
      heading: "₹6 லட்சம் போட்டவர் vs ₹15 லட்சம் போட்டவர்.\n**யாருக்கு அதிகம்?**"
      say: "ஆறு லட்சம் போட்டவருக்கு அதிகம் கிடைத்ததா, பதினைந்து லட்சம் போட்டவருக்கா? பதில் உங்களை ஆச்சரியப்படுத்தும்."
    - type: compare
      heading: "இரண்டு நண்பர்கள் (கற்பனை உதாரணம், 10%)"
      left: {title: "அருண்: 25-35 வயது"}
      right: {title: "பாலா: 35-60 வயது"}
      rows:
        - {left: "மாதம் ₹5,000, **10 வருடம்** மட்டும்", right: "மாதம் ₹5,000, **25 வருடம்**", say: "அருண், இருபத்தைந்து வயதில் தொடங்கி, மாதம் ஐயாயிரம், பத்து வருடம் மட்டும் போட்டு நிறுத்துகிறார். பாலா, முப்பத்தைந்து வயதில் தொடங்கி, அறுபது வயது வரை, இருபத்தைந்து வருடம் போடுகிறார்."}
        - {left: "போட்டது: **₹6 லட்சம்**", right: "போட்டது: **₹15 லட்சம்**", say: "அருண் போட்டது ஆறு லட்சம். பாலா போட்டது பதினைந்து லட்சம்."}
        - {left: "60 வயதில்: **≈ ₹1.24 கோடி**", right: "60 வயதில்: **≈ ₹67 லட்சம்**", say: "ஆண்டுக்குப் பத்து சதவீதம் என்ற கற்பனை வளர்ச்சியில், அறுபது வயதில் அருணுக்குச் சுமார் ஒன்று புள்ளி இரண்டு நான்கு கோடி. பாலாவுக்கு சுமார் அறுபத்தேழு லட்சம்."}
    - type: takeaway
      text: "முதலீட்டில் **தொகையை விட, நேரம்** பெரிய பங்கு வகிக்கிறது."
      say: "முதலீட்டில், போடும் தொகையை விட, நேரம் பெரிய பங்கு வகிக்கிறது. இது கற்பனை உதாரணம் மட்டுமே, உண்மையான வருமானம் மாறுபடும்."

long:
  intro_say: "வணக்கம்! முதலீடு செய்ய சரியான நேரம் எப்போது? இந்தக் கேள்விக்குப் பலர் சொல்லும் பதில்: முடிந்தவரை சீக்கிரம். ஏன் என்று, ஒரு கதையுடன் பார்க்கலாம்."
  scenes:
    - type: hook
      chapter: "இரண்டு நண்பர்களின் கதை"
      icon: users
      heading: "அருணும் பாலாவும்:\n**ஒரே வயது, வேறு முடிவுகள்**"
      say:
        - "அருணும் பாலாவும் ஒரே வயது நண்பர்கள். இருவரும் இருபத்தைந்து வயதில் வேலைக்குச் சேர்கிறார்கள்."
        - "அருண் உடனே மாதம் ஐயாயிரம் முதலீடு செய்யத் தொடங்குகிறார். பாலா, இன்னும் நேரம் இருக்கிறது, பிறகு பார்க்கலாம் என்று நினைக்கிறார்."
    - type: compare
      chapter: "கணக்கு"
      heading: "கற்பனை உதாரணம்: ஆண்டுக்கு 10% வளர்ச்சி"
      left: {title: "அருண்"}
      right: {title: "பாலா"}
      say: "இது ஒரு கற்பனைக் கணக்கு. ஆண்டுக்குப் பத்து சதவீத வளர்ச்சி என்று வைத்துக்கொள்வோம். உண்மையான வருமானம் இப்படி நிலையாக இருக்காது."
      rows:
        - {left: "25-35 வயது: மாதம் ₹5,000", right: "35-60 வயது: மாதம் ₹5,000", say: "அருண், இருபத்தைந்து முதல் முப்பத்தைந்து வயது வரை, பத்து வருடம் மட்டும் போட்டு, பிறகு நிறுத்திவிடுகிறார். பாலா, முப்பத்தைந்து வயதில் தொடங்கி, அறுபது வயது வரை, இருபத்தைந்து வருடம் போடுகிறார்."}
        - {left: "மொத்தம் போட்டது: **₹6 லட்சம்**", right: "மொத்தம் போட்டது: **₹15 லட்சம்**", say: "அருண் மொத்தம் போட்டது ஆறு லட்சம். பாலா போட்டது பதினைந்து லட்சம். இரண்டு மடங்குக்கும் மேல்."}
        - {left: "60 வயதில்: **≈ ₹1.24 கோடி**", right: "60 வயதில்: **≈ ₹67 லட்சம்**", say: "ஆனால் அறுபது வயதில், அருணிடம் சுமார் ஒன்று புள்ளி இரண்டு நான்கு கோடி. பாலாவிடம் சுமார் அறுபத்தேழு லட்சம்."}
      after: "குறைவாகப் போட்ட அருணுக்கு, கிட்டத்தட்ட இரண்டு மடங்கு. ஏனென்றால், அருணின் பணத்துக்கு வளர இருபத்தைந்து கூடுதல் வருடங்கள் கிடைத்தன."
    - type: line
      chapter: "ஏன் இப்படி?"
      heading: "அருணின் பணம்: **நிறுத்திய பிறகும் வளர்கிறது**"
      xticks: [[25, "25"], [35, "35"], [45, "45"], [60, "60 வயது"]]
      yticks: [[0, "0"], [40, "₹40L"], [80, "₹80L"], [120, "₹1.2Cr"]]
      series:
        - {name: "அருண்", points: [[25, 0], [30, 3.9], [35, 10.3], [40, 17.0], [45, 28.0], [50, 46.0], [55, 75.7], [60, 124.5]], at: 0}
        - {name: "பாலா", points: [[25, 0], [35, 0], [40, 3.9], [45, 10.3], [50, 20.9], [55, 38.3], [60, 66.9]], at: 1, color: "#fbbf24"}
      say:
        - "அருணின் கோட்டைப் பாருங்கள். முப்பத்தைந்து வயதில் அவர் முதலீட்டை நிறுத்திவிட்டார். ஆனால் அதன் பிறகும், கூட்டு வட்டியால் அவரது பணம் வளர்ந்துகொண்டே இருக்கிறது."
        - "பாலா அதிகம் போட்டாலும், அவரது பணத்துக்கு வளரக் குறைவான நேரமே கிடைத்தது. இதைத்தான் தாமதத்தின் விலை, அதாவது cost of delay என்கிறோம்."
    - type: stat
      chapter: "இருவரும் சேர்ந்தால்?"
      label: "அருண் 25 முதல் 60 வரை தொடர்ந்து போட்டிருந்தால்?"
      value: "₹21 லட்சம்"
      to: "≈ ₹1.9 கோடி"
      caption: "கற்பனைக் கணக்கு, ஆண்டுக்கு 10%. உத்தரவாதம் அல்ல."
      say: "அருண் நிறுத்தாமல், இருபத்தைந்து முதல் அறுபது வயது வரை தொடர்ந்து போட்டிருந்தால்? மொத்தம் போட்டது இருபத்தொரு லட்சம்."
      to_say: "அதே கற்பனை வளர்ச்சியில், அது சுமார் ஒன்று புள்ளி ஒன்பது கோடி ஆகியிருக்கும். சீக்கிரம் தொடங்குவதும், தொடர்ந்து செய்வதும் சேர்ந்தால், சக்தி இன்னும் அதிகம்."
    - type: points
      chapter: "தொடங்குவது எப்படி?"
      heading: "சீக்கிரம் தொடங்குவது **எப்படி?**"
      marker: check
      items:
        - {text: "**சின்னத் தொகையில்** தொடங்குங்கள்", say: "முதலாவது, பெரிய தொகை வரும் வரை காத்திருக்காதீர்கள். சின்னத் தொகையில் தொடங்குவதே முக்கியம்."}
        - {text: "முதலில் **அவசர நிதி, காப்பீடு**", say: "இரண்டாவது, சீக்கிரம் தொடங்குவது என்றால் அவசரப்படுவது அல்ல. அவசர நிதியும், தேவையான காப்பீடும் முதலில்."}
        - {text: "**புரிந்ததில் மட்டும்** முதலீடு", say: "மூன்றாவது, புரியாத, அதிக லாபம் வாக்களிக்கும் எதிலும் அவசரப்பட்டு இறங்காதீர்கள். கற்றுக்கொண்டு, புரிந்ததில் மட்டும் முதலீடு செய்யுங்கள்."}
    - type: takeaway
      text: "முதலீட்டில் **மிகச் சிறந்த நேரம்: பல வருடங்களுக்கு முன்**. **அடுத்த சிறந்த நேரம்: இன்று**."
      say: "சுருக்கமாக, ஒரு பழமொழி உண்டு. மரம் நட மிகச் சிறந்த நேரம், இருபது வருடங்களுக்கு முன். அடுத்த சிறந்த நேரம், இன்று. முதலீட்டுக்கும் இது பொருந்தும். இந்த வீடியோவில் உள்ள எண்கள் எல்லாம் கற்பனை உதாரணங்கள், எந்த வருமானத்துக்கும் உத்தரவாதம் அல்ல."
