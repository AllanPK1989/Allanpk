id: "012"
category: basics
title_ta: "EMI என்றால் என்ன?"
title_en: "EMI Explained"
thumb_ta: "முதல் EMI-ல் **பெரும்பகுதி வட்டி!**"
icon: calendar
keywords: [EMI explained tamil, EMI calculation, home loan EMI, loan interest, prepayment]
summary:
  - "EMI என்றால் என்ன? அசல் + வட்டி"
  - "ஆரம்ப EMI-களில் ஏன் பெரும்பகுதி வட்டி?"
  - "EMI சூத்திரம்"
  - "10 வருடம் vs 20 வருடம்: மொத்த வட்டியில் பெரிய வித்தியாசம் (உதாரணம்)"

short:
  scenes:
    - type: hook
      icon: calendar
      heading: "₹9,000 EMI கட்டுகிறீர்கள்.\n**கடன் எவ்வளவு குறைந்தது?**"
      say: "மாதம் சுமார் ஒன்பதாயிரம் ரூபாய் EMI கட்டுகிறீர்கள். ஆனால் முதல் மாதத்தில், உங்கள் கடன் எவ்வளவு குறைந்திருக்கும் தெரியுமா?"
    - type: steps
      heading: "₹10 லட்சம், 9%, 20 வருடம்"
      lines:
        - {text: "மாத EMI: **₹8,997**", say: "பத்து லட்சம் கடன், ஆண்டுக்கு ஒன்பது சதவீதம் வட்டி, இருபது வருடம். EMI சுமார் எட்டாயிரத்துத் தொள்ளாயிரத்துத் தொண்ணூற்றேழு ரூபாய்."}
        - {text: "முதல் EMI-ல் வட்டி: **₹7,500**", say: "முதல் EMI-ல், ஏழாயிரத்து ஐநூறு ரூபாய் வட்டிக்கே போகிறது."}
        - {text: "அசல் குறைந்தது: **₹1,497** மட்டும்", say: "கடன் குறைந்தது, ஆயிரத்து நானூற்றுத் தொண்ணூற்றேழு ரூபாய் மட்டுமே."}
      result: {text: "20 வருடத்தில் மொத்த வட்டி ≈ ₹11.6 லட்சம்!", say: "இருபது வருடத்தில், மொத்த வட்டி சுமார் பதினொன்றரை லட்சம். வாங்கிய கடனை விட அதிகம்!"}
    - type: takeaway
      text: "EMI-ஐ மட்டும் பார்க்காதீர்கள். **மொத்த வட்டியையும்** பாருங்கள்."
      say: "அதனால், கடன் வாங்கும்போது மாத EMI-ஐ மட்டும் பார்க்காதீர்கள். கடன் காலம் முழுவதும் கட்டும் மொத்த வட்டியையும் பாருங்கள்."

long:
  intro_say: "வணக்கம்! வீடு, வண்டி, மொபைல். இன்று பலவற்றையும் EMI-ல்தான் வாங்குகிறோம். ஆனால் EMI-க்குள் என்ன நடக்கிறது என்று எத்தனை பேருக்குத் தெரியும்? இன்று பார்க்கலாம்."
  scenes:
    - type: define
      chapter: "EMI என்றால் என்ன?"
      term: "EMI"
      term_en: "Equated Monthly Instalment"
      text: "கடனை அடைக்க, ஒவ்வொரு மாதமும் கட்டும் **சம அளவுத் தொகை**. இதில் **அசலும் வட்டியும்** இரண்டும் உண்டு."
      say:
        - "EMI என்றால், Equated Monthly Instalment. அதாவது, கடனை அடைக்க ஒவ்வொரு மாதமும் கட்டும் சம அளவுத் தொகை."
        - "ஒவ்வொரு EMI-க்குள்ளும் இரண்டு பகுதிகள் உண்டு. ஒன்று அசல், இன்னொன்று வட்டி."
    - type: formula
      chapter: "EMI சூத்திரம்"
      heading: "EMI சூத்திரம்"
      formula: "EMI = P × r × (1+r)ⁿ ÷ ((1+r)ⁿ − 1)"
      say: "EMI-ஐக் கணக்கிட ஒரு சூத்திரம் உண்டு. கவலை வேண்டாம், இதை மனப்பாடம் செய்யத் தேவையில்லை. எந்த EMI கால்குலேட்டரும் இதைத்தான் பயன்படுத்துகிறது."
      legend:
        - {sym: "P", text: "கடன் தொகை (அசல்)", say: "பி என்பது கடன் தொகை."}
        - {sym: "r", text: "மாத வட்டி விகிதம் (ஆண்டு விகிதம் ÷ 12)", say: "ஆர் என்பது மாத வட்டி விகிதம். ஆண்டு விகிதத்தைப் பன்னிரண்டால் வகுக்க வேண்டும்."}
        - {sym: "n", text: "மொத்த மாதங்கள்", say: "என் என்பது மொத்த மாதங்களின் எண்ணிக்கை. இருபது வருடம் என்றால் இருநூற்று நாற்பது."}
    - type: steps
      chapter: "முதல் EMI-க்குள் என்ன நடக்கிறது?"
      heading: "₹10 லட்சம், 9%, 20 வருடம்"
      say: "ஒரு உதாரணம். பத்து லட்சம் ரூபாய் கடன், ஆண்டுக்கு ஒன்பது சதவீதம், இருபது வருடம்."
      lines:
        - {text: "மாத EMI: **₹8,997**", say: "EMI, மாதம் சுமார் எட்டாயிரத்துத் தொள்ளாயிரத்துத் தொண்ணூற்றேழு ரூபாய்."}
        - {text: "முதல் மாத வட்டி: ₹10,00,000 × 0.75% = **₹7,500**", say: "முதல் மாதம், பத்து லட்சத்துக்கு முக்கால் சதவீதம் வட்டி. அது ஏழாயிரத்து ஐநூறு."}
        - {text: "அசல் குறைவது: ₹8,997 − ₹7,500 = **₹1,497**", say: "மீதி ஆயிரத்து நானூற்றுத் தொண்ணூற்றேழு ரூபாய் மட்டுமே அசலைக் குறைக்கிறது."}
      result: {text: "ஆரம்ப வருடங்களில் EMI-ன் **பெரும்பகுதி வட்டி**", say: "அதனால்தான், ஆரம்ப வருடங்களில் EMI-ன் பெரும்பகுதி வட்டிக்கே போகிறது. அசல் குறையக் குறைய, வட்டிப் பகுதி குறைந்து, அசல் பகுதி கூடும்."}
    - type: compare
      chapter: "10 வருடம் vs 20 வருடம்"
      heading: "அதே ₹10 லட்சம்: **காலம் மாறினால்?**"
      left: {title: "10 வருடம்"}
      right: {title: "20 வருடம்"}
      say: "இப்போது கடன் காலத்தை மாற்றிப் பார்ப்போம். அதே பத்து லட்சம், அதே ஒன்பது சதவீதம்."
      rows:
        - {left: "EMI ≈ **₹12,668**", right: "EMI ≈ **₹8,997**", say: "பத்து வருடம் என்றால், EMI சுமார் பன்னிரண்டாயிரத்து அறுநூற்று அறுபத்தெட்டு. இருபது வருடம் என்றால், சுமார் எட்டாயிரத்துத் தொள்ளாயிரத்துத் தொண்ணூற்றேழு."}
        - {left: "மொத்த வட்டி ≈ **₹5.2 லட்சம்**", right: "மொத்த வட்டி ≈ **₹11.6 லட்சம்**", say: "ஆனால் மொத்த வட்டி, பத்து வருடத்தில் சுமார் ஐந்து புள்ளி இரண்டு லட்சம். இருபது வருடத்தில், சுமார் பதினொன்று புள்ளி ஆறு லட்சம். இரண்டு மடங்குக்கும் மேல்!"}
      after: "குறைந்த EMI கவர்ச்சியாகத் தெரியும். ஆனால் நீண்ட காலம் என்றால், மொத்த வட்டி மிக அதிகம்."
    - type: points
      chapter: "Prepayment"
      heading: "வட்டியைக் குறைக்க **வழிகள்**"
      marker: check
      items:
        - {text: "முடிந்தவரை **குறுகிய காலம்** தேர்ந்தெடுங்கள்", say: "முதலாவது, EMI உங்களால் தாங்கக்கூடிய அளவுக்குள், முடிந்தவரை குறுகிய கடன் காலத்தைத் தேர்ந்தெடுங்கள்."}
        - {text: "**Prepayment**: போனஸ் பணத்தில் அசலைக் குறையுங்கள்", say: "இரண்டாவது, போனஸ் போன்ற கூடுதல் பணம் வரும்போது, அசலில் ஒரு பகுதியை முன்கூட்டியே கட்டுங்கள். ஆரம்ப வருடங்களில் இப்படிச் செய்தால், வட்டி கணிசமாகக் குறையும். உங்கள் கடனுக்கு prepayment கட்டணம் உண்டா என்று முதலில் சரிபாருங்கள்."}
        - {text: "**மொத்த வட்டியை** ஒப்பிட்டுப் பாருங்கள்", say: "மூன்றாவது, கடன்களை ஒப்பிடும்போது, EMI மட்டும் அல்ல, வட்டி விகிதம், processing கட்டணம், மொத்த வட்டி எல்லாவற்றையும் ஒப்பிடுங்கள்."}
    - type: takeaway
      text: "EMI-ஐ மட்டும் பார்க்காதீர்கள். **காலம், மொத்த வட்டி, prepayment** மூன்றையும் பாருங்கள்."
      say: "சுருக்கமாக, EMI என்பது அசலும் வட்டியும் சேர்ந்த ஒரு மாதத் தொகை. ஆரம்ப வருடங்களில் வட்டி அதிகம். கடன் வாங்கும்போது EMI-ஐ மட்டும் பார்க்காமல், கடன் காலம், மொத்த வட்டி, prepayment வசதி மூன்றையும் பாருங்கள்."
