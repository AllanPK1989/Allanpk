id: "013"
category: insurance
title_ta: "காப்பீடு என்றால் என்ன?"
title_en: "What is Insurance?"
thumb_ta: "காப்பீடு = **ஆபத்தைப் பகிர்வது**"
icon: shield
keywords: [what is insurance, காப்பீடு, insurance tamil, risk pooling, premium, IRDAI]
summary:
  - "காப்பீடு எப்படி வேலை செய்கிறது: ஆபத்தைப் பகிர்தல்"
  - "Premium, Sum Assured / Sum Insured, Claim — அடிப்படைச் சொற்கள்"
  - "காப்பீடு ஒரு முதலீடு அல்ல — அது பாதுகாப்பு"
  - "எந்த ஆபத்துகளுக்குக் காப்பீடு தேவை?"

short:
  scenes:
    - type: hook
      icon: shield
      heading: "1000 பேர் தலா **₹1,000**.\nஒருவருக்கு விபத்து என்றால்?"
      say: "ஆயிரம் பேர், ஆளுக்கு ஆயிரம் ரூபாய் போடுகிறார்கள். அவர்களில் ஒருவருக்கு ஒரு பெரிய இழப்பு வந்தால் என்ன ஆகும்?"
    - type: steps
      heading: "காப்பீட்டின் அடிப்படை"
      tag: "எளிய உதாரணம்"
      lines:
        - {text: "1,000 பேர் × ₹1,000 = **₹10 லட்சம்** பொது நிதி", say: "எல்லோரும் சேர்த்து, பத்து லட்சம் ரூபாய் ஒரு பொது நிதியாகிறது."}
        - {text: "ஒருவருக்கு இழப்பு → அவருக்கு **பெரிய தொகை**", say: "இழப்பு வந்தவருக்கு, அந்த நிதியிலிருந்து பெரிய தொகை கிடைக்கிறது."}
      result: {text: "சின்னத் தொகை கொடுத்து, **பெரிய ஆபத்தைப் பகிர்கிறோம்**", say: "ஒவ்வொருவரும் ஒரு சின்னத் தொகை கொடுத்து, பெரிய ஆபத்தைப் பகிர்ந்துகொள்கிறோம். இதுதான் காப்பீடு."}
    - type: takeaway
      text: "காப்பீடு ஒரு **முதலீடு அல்ல**. அது உங்கள் குடும்பத்தின் **பாதுகாப்பு**."
      say: "நினைவில் வையுங்கள், காப்பீடு ஒரு முதலீடு அல்ல. அது, ஒரு பெரிய இழப்பிலிருந்து உங்கள் குடும்பத்தைக் காக்கும் பாதுகாப்பு."

long:
  intro_say: "வணக்கம்! இன்றிலிருந்து, நிதித் திட்டமிடலின் மிக முக்கியமான பகுதியைப் பார்க்கத் தொடங்குகிறோம். காப்பீடு. முதலில், காப்பீடு என்றால் என்ன, அது எப்படி வேலை செய்கிறது?"
  scenes:
    - type: hook
      chapter: "ஒரு எளிய கதை"
      icon: users
      heading: "ஒரு கிராமம், 1000 வீடுகள்,\n**ஒரு தீ விபத்து**"
      say:
        - "ஒரு கிராமத்தில் ஆயிரம் வீடுகள். ஒவ்வொரு வருடமும், ஏதாவது ஒரு வீட்டில் தீ விபத்து நடக்கலாம். எந்த வீடு என்று யாருக்கும் தெரியாது."
        - "தீ விபத்து வந்த குடும்பம், தனியாக அந்த இழப்பைச் சமாளிக்க முடியாது. ஆனால், எல்லோரும் சேர்ந்தால்?"
    - type: steps
      chapter: "ஆபத்தைப் பகிர்தல்"
      heading: "எல்லோரும் சேர்ந்து **ஆபத்தைப் பகிர்வது**"
      tag: "எளிய உதாரணம்"
      lines:
        - {text: "1,000 வீடுகள் × ஆண்டுக்கு ₹1,000 = **₹10 லட்சம்**", say: "ஒவ்வொரு வீடும் ஆண்டுக்கு ஆயிரம் ரூபாய் கொடுத்தால், பத்து லட்சம் ரூபாய் பொது நிதி."}
        - {text: "தீ விபத்து நடந்த வீட்டுக்கு **இழப்பீடு**", say: "தீ விபத்து நடந்த வீட்டுக்கு, அந்த நிதியிலிருந்து இழப்பீடு கொடுக்கப்படுகிறது."}
        - {text: "மற்ற 999 பேருக்கு இழப்பு: ₹1,000 மட்டும்", say: "மற்ற தொள்ளாயிரத்துத் தொண்ணூற்றொன்பது பேருக்கு, இழப்பு வெறும் ஆயிரம் ரூபாய். ஆனால் ஒரு வருடம் முழுவதும் மன நிம்மதி."}
      result: {text: "இதைத்தான் காப்பீட்டு நிறுவனம் **பெரிய அளவில்** செய்கிறது", say: "காப்பீட்டு நிறுவனம், இதையே லட்சக்கணக்கான மக்களுடன், பெரிய அளவில் செய்கிறது. இதை risk pooling என்பார்கள்."}
    - type: points
      chapter: "அடிப்படைச் சொற்கள்"
      heading: "தெரிந்துகொள்ள வேண்டிய **சொற்கள்**"
      items:
        - {text: "**Premium**: நீங்கள் கட்டும் தொகை", say: "Premium. காப்பீட்டுக்காக நீங்கள் கட்டும் தொகை. மாதம், வருடம் என்று கட்டலாம்."}
        - {text: "**Sum Assured / Sum Insured**: கிடைக்கும் அதிகபட்சத் தொகை", say: "Sum Assured அல்லது Sum Insured. இழப்பு நடந்தால் கிடைக்கும் அதிகபட்சத் தொகை, அதாவது cover."}
        - {text: "**Claim**: இழப்பீடு கேட்பது", say: "Claim. இழப்பு நடந்த பிறகு, காப்பீட்டு நிறுவனத்திடம் இழப்பீடு கேட்பது."}
        - {text: "**Policy document**: விதிமுறைகள் அனைத்தும்", sub: "எது cover ஆகும், எது ஆகாது", say: "Policy document. எது cover ஆகும், எது ஆகாது என்ற எல்லா விதிமுறைகளும் இதில் இருக்கும். வாங்கும் முன் படிப்பது மிக முக்கியம்."}
    - type: points
      chapter: "எந்த ஆபத்துகளுக்கு?"
      heading: "முக்கியமான **காப்பீட்டு வகைகள்**"
      marker: check
      items:
        - {text: "**உயிர் காப்பீடு**: சம்பாதிப்பவர் இல்லையென்றால்", say: "முதலாவது, உயிர் காப்பீடு. குடும்பத்துக்காகச் சம்பாதிப்பவர் இறந்துவிட்டால், குடும்பத்தின் வருமானத்தைக் காக்க."}
        - {text: "**மருத்துவக் காப்பீடு**: மருத்துவமனைச் செலவுகள்", say: "இரண்டாவது, மருத்துவக் காப்பீடு. பெரிய மருத்துவமனைச் செலவுகளிலிருந்து சேமிப்பைக் காக்க."}
        - {text: "**வாகனம், வீடு, விபத்து** காப்பீடுகள்", say: "மூன்றாவது, வாகனம், வீடு, விபத்து போன்றவற்றுக்கான காப்பீடுகள்."}
      after: "இந்தியாவில், காப்பீட்டுத் துறையைக் கண்காணிப்பது IRDAI என்ற ஒழுங்குமுறை அமைப்பு."
    - type: compare
      chapter: "காப்பீடு ஒரு முதலீடு அல்ல"
      heading: "காப்பீடு vs முதலீடு"
      left: {title: "காப்பீடு"}
      right: {title: "முதலீடு"}
      rows:
        - {left: "நோக்கம்: **பாதுகாப்பு**", right: "நோக்கம்: **வளர்ச்சி**", say: "காப்பீட்டின் நோக்கம் பாதுகாப்பு. முதலீட்டின் நோக்கம் பணத்தை வளர்ப்பது."}
        - {left: "இழப்பு நடந்தால் **பெரிய தொகை**", right: "காலப்போக்கில் **பணம் பெருகும்**", say: "காப்பீடு, இழப்பு நடந்தால் பெரிய தொகை தருகிறது. முதலீடு, காலப்போக்கில் பணத்தைப் பெருக்குகிறது."}
        - {left: "எதுவும் நடக்கவில்லை = **நல்ல செய்தி**", right: "வருமானம் சந்தையைப் பொறுத்தது", say: "காப்பீடு வாங்கி, எந்த இழப்பும் நடக்கவில்லை என்றால், பணம் வீணானது அல்ல. அது நல்ல செய்தி. அந்த வருடம் முழுவதும் பாதுகாப்பு கிடைத்தது."}
    - type: takeaway
      text: "காப்பீடு = **சின்னத் தொகை கொடுத்து, பெரிய ஆபத்தை மாற்றுவது**. முதலீட்டுக்கு முன், பாதுகாப்பு."
      say: "சுருக்கமாக, காப்பீடு என்பது ஒரு சின்னத் தொகை கொடுத்து, தாங்க முடியாத பெரிய ஆபத்தை வேறொருவருக்கு மாற்றுவது. முதலீடு செய்வதற்கு முன், சரியான பாதுகாப்பு இருப்பது முக்கியம். அடுத்த வீடியோவில், மிக முக்கியமான உயிர் காப்பீட்டு வகையைப் பார்க்கலாம். டேர்ம் இன்சூரன்ஸ்."
