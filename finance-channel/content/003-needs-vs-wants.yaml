id: "003"
category: savings
title_ta: "தேவைகள் vs விருப்பங்கள்"
title_en: "Needs vs Wants"
thumb_ta: "இது **தேவையா?** இல்லை **விருப்பமா?**"
icon: scale
keywords: [needs vs wants, budgeting tamil, saving money tamil, தேவைகள், விருப்பங்கள், lifestyle inflation]
summary:
  - "தேவை (Need) என்றால் என்ன, விருப்பம் (Want) என்றால் என்ன?"
  - "இரண்டுக்கும் நடுவில் உள்ள 'சாம்பல் பகுதி'"
  - "வாங்கும் முன் கேட்க வேண்டிய 3 கேள்விகள்"
  - "Lifestyle inflation — சம்பளம் கூடும்போது செலவும் கூடுவது"

short:
  scenes:
    - type: hook
      icon: question
      heading: "புது phone:\n**தேவையா? விருப்பமா?**"
      say: "புது மொபைல் போன் வாங்க நினைக்கிறீர்கள். அது உங்கள் தேவையா, இல்லை விருப்பமா?"
    - type: compare
      heading: "இரண்டும் வேறு வேறு"
      left: {title: "தேவைகள் (Needs)"}
      right: {title: "விருப்பங்கள் (Wants)"}
      rows:
        - {left: "வாடகை, உணவு, மின்சாரம்", right: "ஹோட்டல் சாப்பாடு, OTT", say: "தேவை என்பது இல்லாமல் வாழ முடியாதது. வாடகை, உணவு, மின்சாரம் போன்றவை."}
        - {left: "மருத்துவம், கடன் EMI", right: "புது gadget, ஷாப்பிங்", say: "விருப்பம் என்பது வாழ்க்கையை இனிமையாக்குவது, ஆனால் இல்லாமலும் சமாளிக்க முடியும்."}
    - type: points
      heading: "வாங்கும் முன் **3 கேள்விகள்**"
      items:
        - {text: "இது இல்லாமல் **வாழ முடியுமா?**", say: "வாங்கும் முன் மூன்று கேள்விகள் கேளுங்கள். இது இல்லாமல் வாழ முடியுமா?"}
        - {text: "இது இல்லையென்றால் **வேலை/வருமானம் பாதிக்குமா?**", say: "இது இல்லையென்றால், என் வேலையோ வருமானமோ பாதிக்குமா?"}
        - {text: "**30 நாள்** காத்திருக்க முடியுமா?", say: "முப்பது நாள் காத்திருக்க முடியுமா? காத்திருக்க முடிந்தால், அது பெரும்பாலும் விருப்பம்தான்."}
    - type: takeaway
      text: "விருப்பங்கள் தவறு அல்ல. ஆனால் **தேவைகளும் சேமிப்பும் முதலில்**."
      say: "விருப்பங்கள் தவறு இல்லை. ஆனால் தேவைகளும் சேமிப்பும் முதலில், விருப்பங்கள் அதற்குப் பிறகுதான்."

long:
  intro_say: "வணக்கம்! பட்ஜெட் போடுவதற்கு முன் கற்றுக்கொள்ள வேண்டிய முதல் பாடம் இது. தேவைகளுக்கும் விருப்பங்களுக்கும் உள்ள வித்தியாசம்."
  scenes:
    - type: hook
      chapter: "ஏன் இது முக்கியம்?"
      icon: wallet
      heading: "மாத இறுதியில் **பணம் எங்கே போனது?**"
      say:
        - "மாதம் முடியும்போது, சம்பளம் எங்கே போனது என்றே தெரியவில்லை என்று பலர் சொல்வார்கள்."
        - "பெரும்பாலும் காரணம், சின்னச் சின்ன விருப்பச் செலவுகள், தேவைகள் போல மாறுவேடம் போட்டு வருவதுதான்."
    - type: define
      chapter: "தேவை என்றால் என்ன?"
      term: "தேவைகள்"
      term_en: "Needs"
      text: "வாழ்வதற்கும், வேலை செய்து சம்பாதிப்பதற்கும் **அத்தியாவசியமானவை**. இவற்றைத் தவிர்க்க முடியாது."
      say:
        - "தேவைகள் என்பவை, வாழ்வதற்கும், வேலைக்குப் போய் சம்பாதிப்பதற்கும் அத்தியாவசியமானவை."
        - "வீட்டு வாடகை அல்லது வீட்டுக் கடன் EMI, உணவு, மின்சாரம், தண்ணீர், மருத்துவம், குழந்தைகளின் படிப்பு, வேலைக்குப் போகும் போக்குவரத்து. இவை எல்லாம் தேவைகள்."
    - type: define
      chapter: "விருப்பம் என்றால் என்ன?"
      term: "விருப்பங்கள்"
      term_en: "Wants"
      text: "வாழ்க்கையை **இனிமையாக்குபவை**, ஆனால் இல்லாமலும் சமாளிக்க முடியும்."
      say:
        - "விருப்பங்கள் என்பவை, வாழ்க்கையை இனிமையாக்குபவை. ஆனால் அவை இல்லாமலும் நம்மால் சமாளிக்க முடியும்."
        - "ஹோட்டலில் சாப்பிடுவது, புது டிரெஸ், சமீபத்திய மாடல் போன், பல OTT subscriptions, சுற்றுலா. இவை விருப்பங்கள்."
    - type: compare
      chapter: "சாம்பல் பகுதி"
      heading: "ஒரே பொருள், **இரண்டு நிலை**"
      left: {title: "தேவை நிலை"}
      right: {title: "விருப்ப நிலை"}
      say: "சில நேரம், ஒரே பொருளில் தேவையும் விருப்பமும் கலந்திருக்கும். இதைச் சாம்பல் பகுதி என்று சொல்லலாம்."
      rows:
        - {left: "வேலைக்கு ஒரு phone", right: "விலை உயர்ந்த புது model", say: "வேலைக்கு ஒரு மொபைல் போன் தேவைதான். ஆனால் ஒவ்வொரு வருடமும் விலை உயர்ந்த புது மாடல், அது விருப்பம்."}
        - {left: "போக்குவரத்து", right: "புது கார்", say: "வேலைக்குப் போக போக்குவரத்து தேவை. ஆனால் பஸ் அல்லது பைக் போதும் என்ற நிலையில் புது கார் வாங்குவது விருப்பம்."}
        - {left: "உணவு", right: "தினமும் ஆர்டர்", say: "உணவு தேவை. ஆனால் தினமும் ஆன்லைனில் ஆர்டர் செய்து சாப்பிடுவது விருப்பம்."}
    - type: points
      chapter: "வாங்கும் முன் 3 கேள்விகள்"
      heading: "வாங்கும் முன் **3 கேள்விகள்**"
      items:
        - {text: "இது இல்லாமல் **வாழ முடியுமா?**", say: "ஒரு பொருளை வாங்கும் முன், மூன்று கேள்விகள் கேட்டுக்கொள்ளுங்கள். முதல் கேள்வி, இது இல்லாமல் வாழ முடியுமா?"}
        - {text: "இது இல்லையென்றால் **வருமானம் பாதிக்குமா?**", say: "இரண்டாவது, இது இல்லையென்றால், என் வேலையோ வருமானமோ பாதிக்குமா?"}
        - {text: "**30 நாள்** காத்திருக்க முடியுமா?", sub: "30-day rule", say: "மூன்றாவது, முப்பது நாள் காத்திருக்க முடியுமா? பல நேரம், முப்பது நாள் கழித்து அந்த ஆசையே போய்விடும். இதை 30-day rule என்பார்கள்."}
    - type: stat
      chapter: "Lifestyle Inflation"
      label: "சம்பளம் கூடுகிறது… ஆனால் சேமிப்பு?"
      value: "₹30,000"
      to: "₹50,000"
      caption: "சம்பளம் உயர்ந்தும், சேமிப்பு **அப்படியே** இருந்தால்?"
      say: "இன்னொரு மறைமுகப் பிரச்சனை, lifestyle inflation. உதாரணமாக, சம்பளம் முப்பதாயிரத்தில் இருந்தது."
      to_say: "சில வருடங்களில் அது ஐம்பதாயிரமாக உயர்கிறது. ஆனால் புது விருப்பச் செலவுகளும் அதே வேகத்தில் கூடினால், சேமிப்பு மட்டும் உயராமலே இருக்கும்."
    - type: points
      chapter: "நடைமுறை குறிப்புகள்"
      heading: "எளிய **நடைமுறைக் குறிப்புகள்**"
      marker: check
      items:
        - {text: "ஒரு மாதம் **எல்லாச் செலவையும் எழுதுங்கள்**", say: "முதலில், ஒரு மாதம் முழுவதும் ஒவ்வொரு செலவையும் எழுதி வையுங்கள். பிறகு அவற்றைத் தேவை, விருப்பம் என்று பிரியுங்கள்."}
        - {text: "சம்பளம் உயரும்போது **சேமிப்பையும் உயர்த்துங்கள்**", say: "இரண்டாவது, சம்பளம் உயரும்போதெல்லாம், உயர்வின் ஒரு பகுதியை முதலில் சேமிப்புக்கு ஒதுக்குங்கள்."}
        - {text: "விருப்பங்களுக்கு **ஒரு வரம்பு** வையுங்கள்", say: "மூன்றாவது, விருப்பச் செலவுகளுக்கு மாதம் ஒரு வரம்பு வையுங்கள். அந்த வரம்புக்குள் மகிழ்ச்சியாகச் செலவு செய்யுங்கள்."}
    - type: takeaway
      text: "விருப்பங்கள் தவறு அல்ல. **தேவைகளும் சேமிப்பும் முதலில்**, விருப்பங்கள் அதன் பிறகு."
      say: "சுருக்கமாக, விருப்பங்கள் தவறு இல்லை. வாழ்க்கையை அனுபவிக்கவும் வேண்டும். ஆனால் வரிசை முக்கியம். தேவைகளும் சேமிப்பும் முதலில், விருப்பங்கள் அதன் பிறகு. அடுத்த வீடியோவில், இதை வைத்து ஒரு எளிய பட்ஜெட் விதியைப் பார்க்கலாம்."
