id: "022"
category: investing
title_ta: "சொத்து வகைகள் (Asset Classes)"
title_en: "Asset Classes"
thumb_ta: "பங்கு, கடன், தங்கம், நிலம்: **எது எதற்கு?**"
icon: pie
keywords: [asset classes tamil, equity debt gold real estate, சொத்து வகைகள், investing basics tamil]
summary:
  - "ஐந்து முக்கியச் சொத்து வகைகள்"
  - "ஒவ்வொன்றின் வேலை: வளர்ச்சி, நிலைத்தன்மை, பாதுகாப்பு, பணப்புழக்கம்"
  - "ஒவ்வொன்றின் அபாயங்கள்"
  - "ஏன் கலவை முக்கியம்"

short:
  scenes:
    - type: hook
      icon: pie
      heading: "பங்கு, கடன், தங்கம், நிலம், ரொக்கம்:\n**எது எதற்கு?**"
      say: "பங்கு, கடன் பத்திரம், தங்கம், நிலம், ரொக்கம். ஒவ்வொரு சொத்து வகைக்கும் ஒரு வேலை உண்டு."
    - type: points
      heading: "ஒவ்வொன்றின் **வேலை**"
      items:
        - {text: "**பங்குகள்**: நீண்டகால வளர்ச்சி", sub: "ஏற்ற இறக்கம் அதிகம்", say: "பங்குகள், நீண்டகால வளர்ச்சிக்கு. ஆனால் ஏற்ற இறக்கம் அதிகம்."}
        - {text: "**கடன் பத்திரங்கள், FD**: நிலைத்தன்மை", sub: "வட்டி வருமானம்", say: "கடன் பத்திரங்களும் FD-யும், நிலைத்தன்மைக்கும் வட்டி வருமானத்துக்கும்."}
        - {text: "**தங்கம்**: நெருக்கடியில் பாதுகாப்பு", sub: "வட்டி/டிவிடெண்ட் இல்லை", say: "தங்கம், நெருக்கடி காலங்களில் ஒரு பாதுகாப்பாகப் பார்க்கப்படுகிறது. ஆனால் அதிலிருந்து வட்டியோ டிவிடெண்டோ வராது."}
        - {text: "**நிலம், வீடு**: பெரிய தொகை, மெதுவான விற்பனை", say: "நிலமும் வீடும், பெரிய தொகை தேவை, விற்பதும் மெதுவாகத்தான் நடக்கும்."}
        - {text: "**ரொக்கம்**: உடனடித் தேவைகளுக்கு", say: "ரொக்கம், உடனடித் தேவைகளுக்கும் அவசரத்துக்கும்."}
    - type: takeaway
      text: "எந்த ஒரு சொத்து வகையும் **எல்லா வேலையும்** செய்யாது. அதனால்தான் **கலவை** முக்கியம்."
      say: "எந்த ஒரு சொத்து வகையும், எல்லா வேலையையும் செய்யாது. அதனால்தான், உங்கள் இலக்குகளுக்கு ஏற்ற ஒரு கலவை முக்கியம்."

long:
  intro_say: "வணக்கம்! கடந்த வீடியோவில், பல்வகைப்படுத்தல் பற்றிப் பார்த்தோம். பல கூடைகள் வேண்டும் என்றோம். இன்று, அந்தக் கூடைகள் என்னென்ன என்று பார்க்கலாம். சொத்து வகைகள்."
  scenes:
    - type: define
      chapter: "Asset Class என்றால் என்ன?"
      term: "சொத்து வகை"
      term_en: "Asset Class"
      text: "**ஒரே மாதிரி நடந்துகொள்ளும்** முதலீடுகளின் ஒரு குழு. ஒவ்வொரு வகைக்கும் **தனி அபாயமும், தனி வேலையும்** உண்டு."
      say:
        - "சொத்து வகை என்பது, ஒரே மாதிரியான குணங்களுடன், ஒரே மாதிரி நடந்துகொள்ளும் முதலீடுகளின் ஒரு குழு."
        - "முக்கியமாக ஐந்து வகைகள் உண்டு. ஒவ்வொன்றுக்கும் ஒரு தனி அபாயமும், ஒரு தனி வேலையும் உண்டு."
    - type: define
      chapter: "பங்குகள்"
      label: "வகை 1"
      term: "பங்குகள்"
      term_en: "Equity"
      text: "நிறுவனங்களின் **உரிமையில் ஒரு பங்கு**. வேலை: **நீண்டகால வளர்ச்சி**. அபாயம்: **குறுகிய காலத்தில் பெரிய ஏற்ற இறக்கம்**."
      say:
        - "முதல் வகை, பங்குகள். ஒரு நிறுவனத்தின் உரிமையில் ஒரு சிறு பகுதியை வாங்குவது."
        - "நிறுவனங்கள் வளரும்போது, பங்குதாரர்களும் பயன் பெறலாம். அதனால் நீண்டகால வளர்ச்சிக்குப் பங்குகள் பயன்படுகின்றன. ஆனால் குறுகிய காலத்தில், மதிப்பு பெரிதாக ஏறி இறங்கலாம்."
    - type: define
      chapter: "கடன் பத்திரங்கள்"
      label: "வகை 2"
      term: "கடன் சார்ந்த முதலீடுகள்"
      term_en: "Debt / Fixed Income"
      text: "அரசுக்கோ நிறுவனத்துக்கோ **கடன் கொடுத்து வட்டி** பெறுவது. FD, பத்திரங்கள், டெட் ஃபண்டுகள். வேலை: **நிலைத்தன்மை**."
      say:
        - "இரண்டாவது, கடன் சார்ந்த முதலீடுகள். அரசுக்கோ நிறுவனத்துக்கோ கடன் கொடுத்து, வட்டி பெறுவது. FD, அரசுப் பத்திரங்கள், டெட் ஃபண்டுகள் இந்த வகை."
        - "இவற்றின் வேலை, நிலைத்தன்மையும் வழக்கமான வருமானமும். அபாயம், கடன் வாங்கியவர் திருப்பித் தராமல் போவதும், வட்டி விகித மாற்றங்களும்."
    - type: points
      chapter: "தங்கம், நிலம், ரொக்கம்"
      heading: "மேலும் **மூன்று வகைகள்**"
      items:
        - {text: "**தங்கம்**: நெருக்கடியில் பாதுகாப்பு உணர்வு", sub: "அபாயம்: விலை ஏற்ற இறக்கம்; வட்டி இல்லை", say: "மூன்றாவது, தங்கம். பங்குச் சந்தை நெருக்கடிகளில், பலர் தங்கத்தை ஒரு பாதுகாப்பாகப் பார்க்கிறார்கள். ஆனால் அதன் விலையும் ஏறி இறங்கும், அதிலிருந்து வட்டி வருமானம் இல்லை."}
        - {text: "**நிலம், வீடு**: பயன்பாடு + வாடகை வருமானம்", sub: "அபாயம்: பெரிய தொகை, விற்பது மெதுவாக, செலவுகள்", say: "நான்காவது, நிலம் மற்றும் வீடு. வாடகை வருமானமும் மதிப்பு உயர்வும் சாத்தியம். ஆனால் பெரிய தொகை தேவை, பதிவுச் செலவு அதிகம், உடனே விற்பது கடினம்."}
        - {text: "**ரொக்கம்**: உடனடி பணப்புழக்கம்", sub: "அபாயம்: பணவீக்கத்தில் மதிப்பு குறைவு", say: "ஐந்தாவது, ரொக்கம், அதாவது சேமிப்புக் கணக்கு போன்றவை. உடனே பயன்படுத்தலாம். ஆனால் நீண்டகாலம் வைத்திருந்தால், பணவீக்கம் அதன் மதிப்பைக் குறைக்கும்."}
    - type: compare
      chapter: "ஒரு ஒப்பீடு"
      heading: "ஒரு **பொதுவான ஒப்பீடு**"
      left: {title: "வளர்ச்சி வாய்ப்பு அதிகம்"}
      right: {title: "நிலைத்தன்மை அதிகம்"}
      rows:
        - {left: "பங்குகள்", right: "FD, அரசுப் பத்திரங்கள்", say: "பொதுவாக, பங்குகளில் வளர்ச்சி வாய்ப்பு அதிகம், நிலைத்தன்மை குறைவு. FD, அரசுப் பத்திரங்களில் நிலைத்தன்மை அதிகம், வளர்ச்சி குறைவு."}
        - {left: "நீண்ட காலத்துக்கு", right: "குறுகிய காலத்துக்கு", say: "அதனால், நீண்டகால இலக்குகளுக்கு வளர்ச்சி சார்ந்தவையும், குறுகிய கால இலக்குகளுக்கு நிலையானவையும் பொதுவாகப் பொருந்தும் என்று சொல்லப்படுகிறது."}
      after: "இது ஒரு பொதுவான பார்வை மட்டுமே. உங்கள் நிலைக்கு எது பொருந்தும் என்பது, உங்கள் இலக்குகளையும் அபாயத் திறனையும் பொறுத்தது."
    - type: takeaway
      text: "ஒவ்வொரு சொத்து வகைக்கும் **ஒரு வேலை**. ஒன்று இறங்கும்போது, இன்னொன்று **தாங்கிப் பிடிக்கலாம்**."
      say: "சுருக்கமாக, ஒவ்வொரு சொத்து வகைக்கும் ஒரு வேலை உண்டு. ஒன்று இறங்கும்போது, இன்னொன்று தாங்கிப் பிடிக்கலாம். இவற்றை உங்கள் இலக்குகளுக்கு ஏற்ப கலப்பதைத்தான் asset allocation என்கிறோம். அதை ஒரு தனி வீடியோவில் பார்க்கலாம்."
