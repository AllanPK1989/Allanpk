id: "015"
category: insurance
title_ta: "ஹெல்த் இன்சூரன்ஸ் அடிப்படைகள்"
title_en: "Health Insurance Basics"
thumb_ta: "ஒரு மருத்துவமனை பில், **பல வருடச் சேமிப்பு**"
icon: heart
keywords: [health insurance tamil, ஹெல்த் இன்சூரன்ஸ், medical insurance, mediclaim, hospital bills]
summary:
  - "ஹெல்த் இன்சூரன்ஸ் ஏன் அவசியம்?"
  - "நிறுவனம் தரும் cover மட்டும் போதுமா?"
  - "என்னென்ன cover ஆகும் (பொதுவாக)"
  - "எளிய தொடக்கச் சரிபார்ப்புப் பட்டியல்"

short:
  scenes:
    - type: hook
      icon: heart
      heading: "ஒரு மருத்துவமனை பில்,\n**பல வருடச் சேமிப்பை** காலி செய்யலாம்"
      say: "ஒரே ஒரு மருத்துவமனை பில், பல வருடங்களாகச் சேர்த்த சேமிப்பைக் காலி செய்துவிடலாம்."
    - type: define
      term: "ஹெல்த் இன்சூரன்ஸ்"
      term_en: "Health Insurance"
      text: "மருத்துவமனையில் சேர்ந்தால் ஆகும் செலவுகளை, பாலிசி விதிமுறைகளின்படி, **Sum Insured வரை** காப்பீட்டு நிறுவனம் ஏற்கும்."
      say: "மருத்துவமனையில் சேர்ந்தால் ஆகும் செலவுகளை, பாலிசி விதிமுறைகளின்படி, Sum Insured வரை காப்பீட்டு நிறுவனம் ஏற்றுக்கொள்ளும்."
    - type: points
      heading: "நிறுவனக் cover **மட்டும் போதுமா?**"
      marker: cross
      items:
        - {text: "வேலை மாறினால், போனால் **cover போகலாம்**", say: "நிறுவனம் தரும் cover நல்லதுதான். ஆனால் வேலை மாறினாலோ, போனாலோ, அந்த cover போய்விடலாம்."}
        - {text: "பெரும்பாலும் **cover தொகை குறைவு**", say: "பெரும்பாலும் அந்த cover தொகையும் குறைவாக இருக்கும்."}
    - type: takeaway
      text: "உங்களுக்கும் குடும்பத்துக்கும் **சொந்தமாக** ஒரு ஹெல்த் பாலிசி இருப்பது பாதுகாப்பானது."
      say: "அதனால், நிறுவனக் cover இருந்தாலும், உங்களுக்கும் குடும்பத்துக்கும் சொந்தமாக ஒரு ஹெல்த் பாலிசி இருப்பது பாதுகாப்பானது."

long:
  intro_say: "வணக்கம்! அவசர கால நிதி இருக்கிறது, அதனால் ஹெல்த் இன்சூரன்ஸ் தேவையில்லை என்று நினைக்கிறீர்களா? இன்று, அது ஏன் சரியல்ல என்று பார்க்கலாம்."
  scenes:
    - type: hook
      chapter: "ஏன் அவசியம்?"
      icon: heart
      heading: "மருத்துவச் செலவு\n**எச்சரிக்கை கொடுத்து வருவதில்லை**"
      say:
        - "ஒரு அறுவை சிகிச்சை, சில நாள் ICU, ஒரு விபத்து. இவற்றின் செலவு, சில நாட்களில் லட்சக்கணக்கில் போகலாம்."
        - "மருத்துவச் செலவுகள், பொதுவான பணவீக்கத்தை விட வேகமாக உயர்கின்றன என்றும் சொல்லப்படுகிறது."
    - type: define
      chapter: "ஹெல்த் இன்சூரன்ஸ் என்றால் என்ன?"
      term: "ஹெல்த் இன்சூரன்ஸ்"
      term_en: "Health Insurance"
      text: "மருத்துவமனைச் செலவுகளை, பாலிசி விதிமுறைகளின்படி, **Sum Insured வரை** காப்பீட்டு நிறுவனம் ஏற்கும். நீங்கள் கட்டுவது ஆண்டு **Premium**."
      say:
        - "நீங்கள் ஆண்டுதோறும் ஒரு பிரீமியம் கட்டுகிறீர்கள்."
        - "மருத்துவமனையில் சேர வேண்டி வந்தால், அந்தச் செலவுகளை, பாலிசி விதிமுறைகளின்படி, Sum Insured தொகை வரை காப்பீட்டு நிறுவனம் ஏற்றுக்கொள்ளும்."
    - type: points
      chapter: "என்ன cover ஆகும்?"
      heading: "பொதுவாக **cover ஆகக்கூடியவை**"
      say: "ஒவ்வொரு பாலிசியும் வேறுபடும். ஆனால் பொதுவாக, இவை cover ஆகலாம்."
      marker: check
      items:
        - {text: "மருத்துவமனையில் **சேர்ந்திருக்கும்** செலவுகள்", sub: "அறை, மருத்துவர், மருந்து, பரிசோதனைகள்", say: "மருத்துவமனையில் சேர்ந்திருக்கும்போது ஆகும் அறைக் கட்டணம், மருத்துவர் கட்டணம், மருந்துகள், பரிசோதனைகள்."}
        - {text: "சேர்வதற்கு **முன்னும் பின்னும்** சில நாள் செலவுகள்", sub: "Pre & post hospitalisation", say: "மருத்துவமனையில் சேர்வதற்கு முன்னும் பின்னும், குறிப்பிட்ட நாட்களுக்கான தொடர்புடைய செலவுகள்."}
        - {text: "**Day-care** சிகிச்சைகள்", sub: "ஒரு நாளுக்குள் முடியும் சிகிச்சைகள்", say: "ஒரே நாளில் முடியும் சில சிகிச்சைகள், அதாவது day-care procedures."}
    - type: points
      chapter: "நிறுவனக் cover போதுமா?"
      heading: "நிறுவனம் தரும் cover: **வரம்புகள்**"
      marker: cross
      items:
        - {text: "வேலை மாறினால், போனால் **cover முடியலாம்**", say: "நிறுவனம் தரும் குழு காப்பீடு நல்ல ஒரு வசதி. ஆனால் வேலை மாறினாலோ, போனாலோ, அது முடிந்துவிடலாம்."}
        - {text: "**ஓய்வுக்குப் பிறகு** இருக்காது", say: "ஓய்வுக்குப் பிறகு, மருத்துவத் தேவை அதிகமாக இருக்கும்போது, அந்த cover இருக்காது."}
        - {text: "**வயதான பிறகு** புதிதாக வாங்குவது கடினம், விலை அதிகம்", say: "வயதான பிறகு, அல்லது ஏதாவது நோய் வந்த பிறகு, புதிதாக பாலிசி வாங்குவது கடினம். பிரீமியமும் அதிகம்."}
    - type: points
      chapter: "தொடக்கச் சரிபார்ப்புப் பட்டியல்"
      heading: "தொடங்க ஒரு **சரிபார்ப்புப் பட்டியல்**"
      items:
        - {text: "உங்கள் நகரத்தின் செலவுக்கு **போதுமான Sum Insured**", say: "முதலாவது, உங்கள் நகரத்தின் மருத்துவமனைச் செலவுகளுக்குப் போதுமான Sum Insured."}
        - {text: "**Network மருத்துவமனைகள்** அருகில் உள்ளனவா?", say: "இரண்டாவது, உங்கள் வீட்டுக்கு அருகில் உள்ள மருத்துவமனைகள், அந்த நிறுவனத்தின் network-ல் இருக்கின்றனவா என்று பாருங்கள்."}
        - {text: "**Waiting period, room-rent வரம்பு, co-pay**", say: "மூன்றாவது, காத்திருப்புக் காலம், அறை வாடகை வரம்பு, co-pay போன்ற நிபந்தனைகள். இவற்றை அடுத்தடுத்த வீடியோக்களில் விளக்குகிறோம்."}
        - {text: "**உடல்நலத் தகவல்களை** மறைக்காதீர்கள்", say: "நான்காவது, ஏற்கனவே உள்ள நோய்கள் உட்பட, உடல்நலத் தகவல்களை மறைக்காமல் சொல்லுங்கள். இல்லையென்றால் claim சிக்கலாகலாம்."}
    - type: takeaway
      text: "ஹெல்த் இன்சூரன்ஸ் உங்கள் **சேமிப்பைக் காக்கும் கேடயம்**. இளம் வயதில், ஆரோக்கியமாக இருக்கும்போதே யோசியுங்கள்."
      say: "சுருக்கமாக, ஹெல்த் இன்சூரன்ஸ், உங்கள் சேமிப்பையும் முதலீடுகளையும் காக்கும் கேடயம். ஆரோக்கியமாக இருக்கும்போதே இதைப் பற்றி யோசிப்பது நல்லது. எந்த பாலிசியையும் வாங்கும் முன், விதிமுறைகளை முழுமையாகப் படியுங்கள்."
