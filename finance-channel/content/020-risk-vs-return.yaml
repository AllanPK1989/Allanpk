id: "020"
category: investing
title_ta: "அபாயம் vs வருமானம்"
title_en: "Risk vs Return"
thumb_ta: "அதிக வருமானம் = **அதிக அபாயம்**"
icon: scale
keywords: [risk vs return, அபாயம், investment risk tamil, risk return tradeoff, volatility]
summary:
  - "அபாயம்-வருமானம் தொடர்பு (Risk-Return tradeoff)"
  - "முதலீட்டு வகைகளின் அபாய ஏணி"
  - "அபாயத்தின் பல முகங்கள்: சந்தை, பணவீக்கம், கடன், பணப்புழக்கம்"
  - "காலம் அபாயத்தை எப்படி மாற்றுகிறது"

short:
  scenes:
    - type: hook
      icon: scale
      heading: "அதிக வருமானம்,\n**அபாயமே இல்லாமல்?**"
      say: "அதிக வருமானம், அபாயமே இல்லாமல். அப்படி ஒன்று இருக்கிறதா? இல்லை. ஏன் என்று பார்ப்போம்."
    - type: bars
      heading: "அபாய **ஏணி** (பொதுவான வரிசை)"
      bars:
        - {label: "சேமிப்புக் கணக்கு, FD", value: 1, display: "குறைவு", color: "#4ade80", say: "சேமிப்புக் கணக்கு, FD போன்றவை, குறைந்த அபாயம், பொதுவாகக் குறைந்த வருமானம்."}
        - {label: "Debt / பத்திரங்கள்", value: 2, display: "மிதமானது", color: "#a3e635", say: "பத்திரங்கள், டெட் ஃபண்டுகள், கொஞ்சம் கூடுதல் அபாயம்."}
        - {label: "பங்குகள் (Equity)", value: 3, display: "அதிகம்", color: "#fbbf24", say: "பங்குகள், அதிக ஏற்ற இறக்கம், நீண்டகாலத்தில் அதிக வருமான வாய்ப்பு."}
        - {label: "F&O, ஊகவணிகம்", value: 4, display: "மிக அதிகம்", color: "#f87171", say: "F&O போன்ற ஊகவணிகம், மிக அதிக அபாயம்."}
    - type: takeaway
      text: "யாராவது **அதிக வருமானம், அபாயம் இல்லை** என்று சொன்னால், **சந்தேகப்படுங்கள்**."
      say: "அதனால், யாராவது அதிக வருமானம், அபாயமே இல்லை என்று சொன்னால், உடனே சந்தேகப்படுங்கள்."

long:
  intro_say: "வணக்கம்! முதலீட்டு உலகின் முதல் விதி இது. அதிக வருமானம் வேண்டுமென்றால், அதிக அபாயத்தையும் ஏற்க வேண்டும். இன்று இதை எளிமையாகப் புரிந்துகொள்வோம்."
  scenes:
    - type: hook
      chapter: "ஏன் இலவச மதிய உணவு இல்லை?"
      icon: scale
      heading: "அதிக வருமானம், அபாயம் இல்லை?\n**அப்படி எதுவும் இல்லை**"
      say:
        - "ஒரு முதலீடு அபாயமே இல்லாமல் அதிக வருமானம் தந்தால், எல்லோரும் அதில்தான் முதலீடு செய்வார்கள். அதன் விலை உயர்ந்து, வருமானம் குறைந்துவிடும்."
        - "அதனால், சந்தையில் பொதுவாக, அதிக வருமான வாய்ப்பு என்பது அதிக அபாயத்துக்கான கூலி."
    - type: define
      chapter: "அபாயம் என்றால் என்ன?"
      term: "அபாயம்"
      term_en: "Risk"
      text: "எதிர்பார்த்த வருமானம் **கிடைக்காமல் போகும்** வாய்ப்பு, அல்லது **போட்ட பணத்தில் நஷ்டம்** வரும் வாய்ப்பு."
      say:
        - "அபாயம் என்றால், எதிர்பார்த்த வருமானம் கிடைக்காமல் போகும் வாய்ப்பு. சில நேரம், போட்ட பணத்திலேயே நஷ்டம் வரும் வாய்ப்பு."
        - "குறுகிய காலத்தில், மதிப்பு எவ்வளவு ஏறி இறங்குகிறது என்பதும் அபாயத்தின் ஒரு அளவு."
    - type: bars
      chapter: "அபாய ஏணி"
      heading: "அபாய **ஏணி** (பொதுவான வரிசை)"
      say: "பொதுவான முதலீட்டு வகைகளை, அபாயத்தின் அடிப்படையில் ஒரு ஏணியாக வரிசைப்படுத்தலாம்."
      bars:
        - {label: "சேமிப்புக் கணக்கு, FD", value: 1, display: "குறைவு", color: "#4ade80", say: "கீழ்ப்படியில், சேமிப்புக் கணக்கு, FD, அரசு ஆதரவுள்ள சிறுசேமிப்புத் திட்டங்கள். அபாயம் குறைவு, வருமானமும் பொதுவாகக் குறைவு."}
        - {label: "Debt / பத்திரங்கள்", value: 2, display: "மிதமானது", color: "#a3e635", say: "அடுத்து, பத்திரங்கள், டெட் ஃபண்டுகள். வட்டி விகித மாற்றம், கடன் திருப்பம் போன்ற அபாயங்கள் உண்டு."}
        - {label: "பங்குகள் (Equity)", value: 3, display: "அதிகம்", color: "#fbbf24", say: "அதற்கு மேல், பங்குகள். குறுகிய காலத்தில் பெரிய ஏற்ற இறக்கம். ஆனால் நீண்டகாலத்தில், வணிக வளர்ச்சியில் பங்கு பெறும் வாய்ப்பு."}
        - {label: "F&O, ஊகவணிகம்", value: 4, display: "மிக அதிகம்", color: "#f87171", say: "மேல்ப்படியில், F&O போன்ற ஊகவணிகம். குறுகிய காலத்தில் பெரிய நஷ்டத்தின் வாய்ப்பு மிக அதிகம்."}
      note: "பொதுவான வரிசை மட்டுமே; ஒவ்வொரு வகைக்குள்ளும் அபாயம் வேறுபடும்"
    - type: points
      chapter: "அபாயத்தின் பல முகங்கள்"
      heading: "அபாயத்தின் **பல முகங்கள்**"
      items:
        - {text: "**சந்தை அபாயம்**: விலை இறங்குவது", say: "முதலாவது, சந்தை அபாயம். சந்தை விலைகள் இறங்கி, முதலீட்டின் மதிப்பு குறைவது."}
        - {text: "**பணவீக்க அபாயம்**: வருமானம் விலைவாசியை மிஞ்சாதது", say: "இரண்டாவது, பணவீக்க அபாயம். பாதுகாப்பான இடத்தில் வைத்த பணமும், பணவீக்கத்தை மிஞ்சவில்லை என்றால், மதிப்பு குறைகிறது. அதனால், அபாயமே இல்லாத இடம் என்று எதுவுமில்லை."}
        - {text: "**கடன் அபாயம்**: கடன் வாங்கியவர் திருப்பித் தராதது", say: "மூன்றாவது, கடன் அபாயம். நீங்கள் பணம் கொடுத்த நிறுவனம் அதைத் திருப்பித் தர முடியாமல் போவது."}
        - {text: "**பணப்புழக்க அபாயம்**: தேவைக்கு உடனே விற்க முடியாதது", say: "நான்காவது, பணப்புழக்க அபாயம். பணம் தேவைப்படும்போது, நியாயமான விலையில் உடனே விற்க முடியாதது."}
    - type: compare
      chapter: "காலமும் அபாயமும்"
      heading: "காலம் **அபாயத்தை மாற்றும்**"
      left: {title: "1 வருடத்தில் தேவை"}
      right: {title: "15 வருடத்தில் தேவை"}
      say: "ஒரே முதலீடு, உங்கள் காலத்தைப் பொறுத்து வேறு அளவு அபாயமாக இருக்கும்."
      rows:
        - {left: "பங்குச் சந்தை இறக்கம் = **பெரிய பிரச்சனை**", right: "இறக்கத்திலிருந்து மீள **நேரம் உண்டு**", say: "ஒரு வருடத்தில் பணம் தேவை என்றால், பங்குச் சந்தை இறக்கம் பெரிய பிரச்சனை. பதினைந்து வருடம் இருந்தால், மீள நேரம் உண்டு. ஆனால் அதற்கும் உத்தரவாதம் இல்லை."}
        - {left: "நிலையான வருமானம் உள்ளவை", right: "வளர்ச்சி சார்ந்தவை பொருந்தலாம்", say: "அதனால், குறுகிய கால இலக்குகளுக்கு நிலையானவையும், நீண்டகால இலக்குகளுக்கு வளர்ச்சி சார்ந்தவையும் பொதுவாகப் பொருந்தும் என்று சொல்லப்படுகிறது."}
    - type: points
      chapter: "உங்கள் அபாயத் திறன்"
      heading: "உங்களால் **எவ்வளவு அபாயம்** ஏற்க முடியும்?"
      marker: dot
      items:
        - {text: "**அபாயத் திறன்**: நஷ்டத்தைத் தாங்கும் நிதி நிலை", sub: "வருமானம், சேமிப்பு, பொறுப்புகள், வயது", say: "இரண்டு கேள்விகள். முதலாவது, அபாயத் திறன். நஷ்டம் வந்தால், உங்கள் நிதி நிலை அதைத் தாங்குமா? வருமானம், சேமிப்பு, பொறுப்புகள் இதைப் பாதிக்கும்."}
        - {text: "**அபாயச் சகிப்பு**: இறக்கத்தில் மனம் தாங்குமா?", say: "இரண்டாவது, அபாயச் சகிப்பு. மதிப்பு இருபது சதவீதம் இறங்கினால், பயத்தில் விற்றுவிடுவீர்களா, அமைதியாக இருப்பீர்களா?"}
    - type: takeaway
      text: "அபாயமும் வருமானமும் **இணைபிரியாதவை**. உங்கள் **இலக்கு, காலம், மனநிலைக்கு** ஏற்ப அபாயத்தைத் தேர்ந்தெடுங்கள்."
      say: "சுருக்கமாக, அபாயமும் வருமானமும் இணைபிரியாதவை. அபாயமே இல்லாத அதிக வருமானம் என்று எதுவுமில்லை. உங்கள் இலக்கு, காலம், மனநிலைக்கு ஏற்ப எவ்வளவு அபாயம் என்பதைப் புரிந்துகொள்வதுதான் முதல் படி."
