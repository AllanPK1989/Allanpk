id: "029"
category: insurance
title_ta: "எவ்வளவு லைஃப் கவர் தேவை?"
title_en: "How Much Life Cover Do You Need?"
thumb_ta: "₹10 லட்சம் cover **போதுமா?**"
icon: calc
keywords: [how much life insurance, term insurance cover amount, life cover calculation tamil, human life value]
summary:
  - "Life cover எவ்வளவு என்று எப்படி யோசிப்பது?"
  - "மூன்று கேள்விகள்: வருமானம், கடன்கள், இலக்குகள்"
  - "ஒரு உதாரணக் கணக்கு"
  - "Rule of thumb-களின் வரம்புகள்"

short:
  scenes:
    - type: hook
      icon: calc
      heading: "₹10 லட்சம் life cover.\n**உங்கள் குடும்பத்துக்குப் போதுமா?**"
      say: "பத்து லட்சம் ரூபாய் life cover இருக்கிறது. அது உங்கள் குடும்பத்துக்கு எத்தனை வருடம் போதும்?"
    - type: steps
      heading: "ஒரு எளிய கணக்கு (உதாரணம்)"
      lines:
        - {text: "குடும்பச் செலவு: **ஆண்டுக்கு ₹4 லட்சம்**", say: "குடும்பத்தின் ஆண்டுச் செலவு நான்கு லட்சம் என்று வைத்துக்கொள்வோம்."}
        - {text: "₹10 லட்சம் ÷ ₹4 லட்சம் ≈ **2.5 வருடம்**", say: "பத்து லட்சம், சுமார் இரண்டரை வருடச் செலவுக்கு மட்டுமே போதும்."}
      result: {text: "குழந்தைகளின் படிப்பு, கடன்கள்? **போதாது!**", say: "அதன் பிறகு, குழந்தைகளின் படிப்பு, வீட்டுக் கடன்? போதாது."}
    - type: points
      heading: "யோசிக்க **3 கேள்விகள்**"
      items:
        - {text: "குடும்பத்துக்கு **எத்தனை வருட வருமானம்** தேவை?", say: "முதலாவது, உங்கள் குடும்பத்துக்கு எத்தனை வருட வருமானம் தேவை?"}
        - {text: "**கடன்கள்** எவ்வளவு?", say: "இரண்டாவது, அடைக்க வேண்டிய கடன்கள் எவ்வளவு?"}
        - {text: "**பெரிய இலக்குகள்**: படிப்பு, திருமணம்", say: "மூன்றாவது, குழந்தைகளின் படிப்பு போன்ற பெரிய இலக்குகளுக்கு எவ்வளவு?"}
    - type: takeaway
      text: "Cover = **குடும்பத்தின் தேவை** அடிப்படையில். ஒரு சுற்று எண்ணை வைத்து அல்ல."
      say: "Life cover, ஒரு சுற்று எண்ணை வைத்து அல்ல, உங்கள் குடும்பத்தின் உண்மையான தேவையை வைத்து முடிவு செய்ய வேண்டும்."

long:
  intro_say: "வணக்கம்! டேர்ம் இன்சூரன்ஸ் ஏன் முக்கியம் என்று பார்த்தோம். அடுத்த கேள்வி, எவ்வளவு cover தேவை? இன்று, அதை எப்படி யோசிப்பது என்று பார்க்கலாம்."
  scenes:
    - type: hook
      chapter: "ஒரு பொதுவான தவறு"
      icon: alert
      heading: "'**ஒரு சுற்று எண் போதும்**'\nஎன்பது பொதுவான தவறு"
      say:
        - "பலர், பத்து லட்சம், இருபது லட்சம் என்று ஒரு சுற்று எண்ணைத் தேர்ந்தெடுக்கிறார்கள். அல்லது ஏஜென்ட் சொன்ன எண்ணை."
        - "ஆனால் சரியான cover, உங்கள் குடும்பத்தின் தேவையைப் பொறுத்தது. அதை எப்படிக் கணக்கிடுவது என்று பார்ப்போம்."
    - type: points
      chapter: "மூன்று கேள்விகள்"
      heading: "யோசிக்க **மூன்று கேள்விகள்**"
      items:
        - {text: "**வருமான மாற்று**: குடும்பத்துக்கு எத்தனை வருடச் செலவு?", say: "முதல் கேள்வி. நீங்கள் இல்லையென்றால், குடும்பத்தின் வழக்கமான செலவுகளுக்கு, எத்தனை வருடம் பணம் தேவைப்படும்?"}
        - {text: "**கடன்கள்**: வீட்டுக் கடன், வாகனக் கடன், பிற", say: "இரண்டாவது கேள்வி. அடைக்க வேண்டிய கடன்கள் எவ்வளவு? வீட்டுக் கடன், வாகனக் கடன், பிற கடன்கள்."}
        - {text: "**இலக்குகள்**: குழந்தைகளின் படிப்பு, திருமணம்", say: "மூன்றாவது கேள்வி. குழந்தைகளின் உயர்கல்வி, திருமணம் போன்ற பெரிய இலக்குகளுக்கு எவ்வளவு தேவை?"}
      after: "இந்த மூன்றையும் கூட்டி, ஏற்கனவே உள்ள சேமிப்பு, முதலீடுகள், பிற காப்பீடுகளைக் கழித்தால், ஒரு தோராயமான தேவை கிடைக்கும்."
    - type: steps
      chapter: "ஒரு உதாரணக் கணக்கு"
      heading: "ஒரு உதாரணக் **கணக்கு**"
      say: "ஒரு கற்பனை உதாரணம். முப்பது வயது ராஜா, ஆண்டு வருமானம் எட்டு லட்சம். மனைவி, ஒரு குழந்தை."
      lines:
        - {text: "குடும்பச் செலவு ₹5L/ஆண்டு × 15 வருடம் ≈ **₹75 லட்சம்**", say: "குடும்பத்தின் ஆண்டுச் செலவு ஐந்து லட்சம். குழந்தை சுயமாக நிற்கும் வரை, சுமார் பதினைந்து வருடத்துக்கு என்றால், எழுபத்தைந்து லட்சம். இது எளிமைப்படுத்திய கணக்கு. பணவீக்கத்தையும் சேர்த்தால் இன்னும் அதிகம் தேவைப்படும்."}
        - {text: "+ வீட்டுக் கடன் நிலுவை: **₹25 லட்சம்**", say: "அதோடு, வீட்டுக் கடன் நிலுவை இருபத்தைந்து லட்சம்."}
        - {text: "+ குழந்தையின் உயர்கல்வி: **₹20 லட்சம்**", say: "குழந்தையின் உயர்கல்விக்கு இருபது லட்சம்."}
        - {text: "− ஏற்கனவே உள்ள சேமிப்பு, முதலீடு: **₹10 லட்சம்**", say: "ஏற்கனவே உள்ள சேமிப்பும் முதலீடும் பத்து லட்சம். அதைக் கழிக்கிறோம்."}
      result: {text: "தேவையான cover ≈ ₹1.1 கோடி", say: "மொத்தம், சுமார் ஒரு கோடியே பத்து லட்சம். பத்து லட்சம் cover எங்கே, இந்தத் தேவை எங்கே என்று பாருங்கள்."}
    - type: points
      chapter: "Rule of thumb"
      heading: "பரவலாகச் சொல்லப்படும் **Rule of thumb**"
      marker: dot
      items:
        - {text: "ஆண்டு வருமானத்தின் **10 முதல் 15 மடங்கு**", say: "பரவலாகச் சொல்லப்படும் ஒரு விதி, ஆண்டு வருமானத்தின் பத்து முதல் பதினைந்து மடங்கு cover."}
        - {text: "**ஒரு தொடக்கப் புள்ளி** மட்டுமே", say: "இது ஒரு தொடக்கப் புள்ளி மட்டுமே. பெரிய கடன், அதிக பொறுப்புகள் உள்ளவர்களுக்கு இது போதாமல் போகலாம்."}
        - {text: "வாழ்க்கை மாறும்போது **மறுபரிசீலனை**", say: "திருமணம், குழந்தை, புதிய வீட்டுக் கடன் போன்ற வாழ்க்கை மாற்றங்கள் வரும்போது, cover போதுமா என்று மறுபடியும் பாருங்கள்."}
    - type: points
      chapter: "கவனிக்க வேண்டியவை"
      heading: "கவனிக்க **வேண்டியவை**"
      marker: check
      items:
        - {text: "**பணவீக்கம்**: இன்றைய ₹1 கோடி, 20 வருடத்தில் குறைவு", say: "பணவீக்கம். இன்று போதுமானதாகத் தெரியும் தொகை, இருபது வருடம் கழித்து குறைவாகத் தோன்றலாம்."}
        - {text: "நிறுவனம் தரும் cover, **வேலையுடன் போகலாம்**", say: "நிறுவனம் தரும் life cover, வேலை மாறும்போது போய்விடலாம். அதை மட்டும் நம்பி இருக்காதீர்கள்."}
        - {text: "இறுதி முடிவுக்கு **தகுதியான ஆலோசகர்**", say: "உங்கள் நிலைக்கு ஏற்ற சரியான தொகைக்கு, தகுதியான, பதிவு பெற்ற ஆலோசகரின் உதவியைப் பெறலாம்."}
    - type: takeaway
      text: "Life cover = **வருமான மாற்று + கடன்கள் + இலக்குகள் − ஏற்கனவே உள்ள சொத்துகள்**."
      say: "சுருக்கமாக, தேவையான life cover என்பது, குடும்பத்துக்கான வருமான மாற்று, கடன்கள், பெரிய இலக்குகள் மூன்றையும் கூட்டி, ஏற்கனவே உள்ள சொத்துகளைக் கழித்தால் கிடைக்கும் தொகை. ஒரு சுற்று எண்ணை வைத்து அல்ல."
