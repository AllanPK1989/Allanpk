id: "025"
category: investing
title_ta: "SIP என்றால் என்ன?"
title_en: "What is SIP?"
thumb_ta: "SIP ஒரு **திட்டம் அல்ல**, ஒரு **முறை!**"
icon: calendar
keywords: [SIP tamil, systematic investment plan, எஸ்ஐபி, mutual fund SIP, monthly investment]
summary:
  - "SIP என்றால் என்ன? அது ஒரு முதலீட்டு முறை"
  - "SIP எப்படி வேலை செய்கிறது: NAV-க்கு ஏற்ப யூனிட்டுகள்"
  - "SIP-ன் நன்மைகள்: ஒழுங்கு, சின்னத் தொகை, தானியங்கி"
  - "SIP பற்றிய பொதுவான தவறான எண்ணங்கள்"

short:
  scenes:
    - type: hook
      icon: calendar
      heading: "SIP ஒரு **திட்டம் அல்ல**.\nஒரு **முறை!**"
      say: "SIP என்பது ஒரு தனி முதலீட்டுத் திட்டம் என்று பலர் நினைக்கிறார்கள். உண்மையில் அது ஒரு முதலீட்டு முறை."
    - type: define
      term: "SIP"
      term_en: "Systematic Investment Plan"
      text: "ஒரு மியூச்சுவல் ஃபண்டில், **ஒவ்வொரு மாதமும் ஒரு நிலையான தொகையை** தானாக முதலீடு செய்யும் **முறை**."
      say: "SIP என்றால், ஒரு மியூச்சுவல் ஃபண்டில், ஒவ்வொரு மாதமும் ஒரு நிலையான தொகையைத் தானாக முதலீடு செய்யும் முறை."
    - type: points
      heading: "SIP-ன் **பலங்கள்**"
      marker: check
      items:
        - {text: "**சின்னத் தொகையில்** தொடங்கலாம்", say: "சின்னத் தொகையிலேயே தொடங்கலாம்."}
        - {text: "**தானியங்கி**: ஒழுங்கு தானாக வரும்", say: "தானியங்கியாக நடப்பதால், ஒழுங்கு தானாக வரும்."}
        - {text: "**சந்தை நேரத்தைக்** கணிக்கத் தேவையில்லை", say: "எப்போது வாங்குவது என்று சந்தையைக் கணிக்கத் தேவையில்லை."}
    - type: takeaway
      text: "SIP **ஒழுங்கைத் தருகிறது**. ஆனால் வருமானம், நீங்கள் தேர்ந்தெடுக்கும் **ஃபண்டையும் சந்தையையும்** பொறுத்தது."
      say: "SIP ஒழுங்கைத் தருகிறது. ஆனால் வருமானம், நீங்கள் தேர்ந்தெடுக்கும் ஃபண்டையும் சந்தையையும் பொறுத்தது. SIP-க்கு எந்த உத்தரவாதமும் இல்லை."

long:
  intro_say: "வணக்கம்! கடந்த வீடியோவில் மியூச்சுவல் ஃபண்ட் பற்றிப் பார்த்தோம். இன்று, அதில் முதலீடு செய்யும் மிகப் பிரபலமான முறையைப் பார்க்கலாம். SIP."
  scenes:
    - type: hook
      chapter: "SIP ஒரு முறை"
      icon: question
      heading: "'எந்த SIP நல்லது?'\n**தவறான கேள்வி!**"
      say:
        - "எந்த SIP நல்லது என்று பலர் கேட்பார்கள். ஆனால் இது கொஞ்சம் தவறான கேள்வி."
        - "ஏனென்றால், SIP என்பது ஒரு தனி முதலீட்டுப் பொருள் அல்ல. அது ஒரு முதலீட்டு முறை. Recurring Deposit போல, மாதா மாதம் போடும் ஒரு வழி."
    - type: define
      chapter: "SIP என்றால் என்ன?"
      term: "SIP"
      term_en: "Systematic Investment Plan"
      text: "நீங்கள் தேர்ந்தெடுக்கும் மியூச்சுவல் ஃபண்டில், **ஒவ்வொரு மாதமும் ஒரு நிலையான தொகை** உங்கள் வங்கிக் கணக்கிலிருந்து **தானாக** முதலீடாகும் முறை."
      say:
        - "SIP-ல், நீங்கள் ஒரு மியூச்சுவல் ஃபண்டையும், ஒரு தொகையையும், ஒரு தேதியையும் தேர்ந்தெடுக்கிறீர்கள்."
        - "ஒவ்வொரு மாதமும் அந்தத் தேதியில், அந்தத் தொகை உங்கள் வங்கிக் கணக்கிலிருந்து தானாக அந்த ஃபண்டில் முதலீடாகும்."
    - type: steps
      chapter: "எப்படி வேலை செய்கிறது?"
      heading: "மாதம் ₹1,000 SIP: **யூனிட்டுகள் மாறும்**"
      tag: "உதாரணம் (கற்பனை NAV)"
      say: "SIP எப்படி வேலை செய்கிறது என்று ஒரு கற்பனை உதாரணம் பார்ப்போம். மாதம் ஆயிரம் ரூபாய்."
      lines:
        - {text: "மாதம் 1: NAV ₹20 → **50 யூனிட்**", say: "முதல் மாதம், NAV இருபது ரூபாய். ஆயிரம் ரூபாய்க்கு ஐம்பது யூனிட்டுகள்."}
        - {text: "மாதம் 2: NAV ₹25 → **40 யூனிட்**", say: "இரண்டாம் மாதம், NAV இருபத்தைந்து ஆக உயர்ந்தது. அதே ஆயிரத்துக்கு நாற்பது யூனிட்டுகள் மட்டுமே."}
        - {text: "மாதம் 3: NAV ₹16 → **62.5 யூனிட்**", say: "மூன்றாம் மாதம், NAV பதினாறாக இறங்கியது. அதே ஆயிரத்துக்கு அறுபத்திரண்டரை யூனிட்டுகள்."}
      result: {text: "விலை குறையும்போது **அதிக யூனிட்**, கூடும்போது **குறைவான யூனிட்**", say: "விலை குறையும்போது அதிக யூனிட்டுகள், கூடும்போது குறைவான யூனிட்டுகள் தானாகக் கிடைக்கின்றன. இதை rupee cost averaging என்பார்கள். இதற்கு ஒரு தனி வீடியோ வருகிறது."}
    - type: points
      chapter: "SIP-ன் நன்மைகள்"
      heading: "SIP-ன் **நன்மைகள்**"
      marker: check
      items:
        - {text: "**சின்னத் தொகையில்** தொடங்கலாம்", say: "முதலாவது, சின்னத் தொகையிலேயே தொடங்கலாம். பெரிய தொகை சேரும் வரை காத்திருக்க வேண்டியதில்லை."}
        - {text: "**Pay Yourself First**: தானியங்கி ஒழுங்கு", say: "இரண்டாவது, நாம் முன்பு பார்த்த pay yourself first பழக்கத்தை, இது தானாகச் செயல்படுத்துகிறது."}
        - {text: "**சந்தையைக் கணிக்கும்** அழுத்தம் இல்லை", say: "மூன்றாவது, சந்தை எப்போது ஏறும், இறங்கும் என்று கணிக்கும் அழுத்தம் இல்லை."}
        - {text: "**நெகிழ்வு**: நிறுத்தலாம், மாற்றலாம், உயர்த்தலாம்", say: "நான்காவது, பொதுவாக, தேவைப்பட்டால் நிறுத்தலாம், தொகையை மாற்றலாம், ஆண்டுதோறும் உயர்த்தலாம். ஆனால் ELSS போன்ற சில ஃபண்டுகளில் lock-in உண்டு."}
    - type: points
      chapter: "தவறான எண்ணங்கள்"
      heading: "SIP பற்றிய **தவறான எண்ணங்கள்**"
      marker: cross
      items:
        - {text: "'SIP-ல் **நஷ்டம் வராது**'", say: "முதல் தவறான எண்ணம், SIP-ல் நஷ்டமே வராது. தவறு. SIP ஒரு முறை மட்டுமே. ஃபண்டின் மதிப்பு இறங்கினால், உங்கள் முதலீட்டின் மதிப்பும் இறங்கும்."}
        - {text: "'SIP-க்கு **உத்தரவாத வருமானம்**'", say: "இரண்டாவது, SIP-க்கு நிலையான வருமானம் உண்டு என்பது. இல்லை. வருமானம் சந்தையைப் பொறுத்தது."}
        - {text: "'சந்தை இறங்கினால் **SIP-ஐ நிறுத்து**'", say: "மூன்றாவது, சந்தை இறங்கும்போது பயந்து SIP-ஐ நிறுத்துவது. அப்போதுதான் குறைந்த விலையில் அதிக யூனிட்டுகள் கிடைக்கின்றன என்பதைப் பலர் மறந்துவிடுகிறார்கள்."}
    - type: takeaway
      text: "SIP = **ஒழுங்கான, தானியங்கி முதலீட்டு முறை**. எந்த ஃபண்டில் என்பது **உங்கள் இலக்கையும் அபாயத் திறனையும்** பொறுத்தது."
      say: "சுருக்கமாக, SIP என்பது ஒழுங்கான, தானியங்கியான முதலீட்டு முறை. எந்த ஃபண்டில் SIP போடுவது என்பது, உங்கள் இலக்கு, காலம், அபாயத் திறனைப் பொறுத்தது. மியூச்சுவல் ஃபண்ட் முதலீடுகள் சந்தை அபாயங்களுக்கு உட்பட்டவை. திட்ட ஆவணங்களைக் கவனமாகப் படியுங்கள்."
