id: "019"
category: savings
title_ta: "பொது வருங்கால வைப்பு நிதி (PPF)"
title_en: "Public Provident Fund (PPF)"
thumb_ta: "**15 வருடம்**, அரசு ஆதரவு, வரிச் சலுகை"
icon: lock
keywords: [PPF tamil, public provident fund, பிபிஎஃப், PPF rules, EEE tax, long term savings]
summary:
  - "PPF என்றால் என்ன?"
  - "15 வருட lock-in, ஆண்டு வரம்புகள்"
  - "வரி நிலை: EEE என்றால் என்ன?"
  - "பகுதி எடுப்பு, கடன், நீட்டிப்பு"

short:
  scenes:
    - type: hook
      icon: lock
      heading: "அரசு ஆதரவு, வரிச் சலுகை,\n**15 வருடப் பொறுமை**"
      say: "அரசு ஆதரவு, வரிச் சலுகை, ஆனால் பதினைந்து வருடப் பொறுமை தேவை. அதுதான் PPF."
    - type: define
      term: "பொது வருங்கால வைப்பு நிதி"
      term_en: "Public Provident Fund (PPF)"
      text: "மத்திய அரசு ஆதரவுள்ள **நீண்டகாலச் சேமிப்புத் திட்டம்**. காலம் **15 வருடம்**; வட்டி விகிதத்தை அரசு **காலாண்டுதோறும்** அறிவிக்கிறது."
      say: "PPF என்பது, மத்திய அரசு ஆதரவுள்ள நீண்டகாலச் சேமிப்புத் திட்டம். காலம் பதினைந்து வருடம். வட்டி விகிதத்தை அரசு ஒவ்வொரு காலாண்டும் அறிவிக்கிறது."
    - type: points
      heading: "முக்கிய **அம்சங்கள்**"
      marker: check
      items:
        - {text: "ஆண்டுக்கு குறைந்தது **₹500**, அதிகபட்சம் **₹1.5 லட்சம்**", say: "ஆண்டுக்குக் குறைந்தது ஐநூறு ரூபாய், அதிகபட்சம் ஒன்றரை லட்சம் ரூபாய் போடலாம்."}
        - {text: "வட்டியும் முதிர்வுத் தொகையும் **வரி இல்லாதவை**", say: "தற்போதைய விதிகளின்படி, வட்டியும் முதிர்வுத் தொகையும் வரி இல்லாதவை."}
        - {text: "**15 வருட lock-in**: நீண்டகால இலக்குகளுக்கு", say: "பதினைந்து வருட lock-in இருப்பதால், இது நீண்டகால இலக்குகளுக்கானது."}
    - type: takeaway
      text: "PPF = **பாதுகாப்பு + வரிச் சலுகை + பொறுமை**. விதிகள் மாறலாம், **அதிகாரபூர்வ தளத்தில்** சரிபாருங்கள்."
      say: "PPF, பாதுகாப்பும் வரிச் சலுகையும் தருகிறது, பொறுமையை எதிர்பார்க்கிறது. விதிகளும் வட்டி விகிதமும் மாறலாம், அதிகாரபூர்வ தளத்தில் சரிபாருங்கள்."

long:
  intro_say: "வணக்கம்! நீண்டகாலச் சேமிப்புக்கு, பல தலைமுறைகளாக இந்தியர்கள் நம்பும் ஒரு திட்டம் இருக்கிறது. பொது வருங்கால வைப்பு நிதி, அதாவது PPF. இன்று அதன் அடிப்படைகளைப் பார்க்கலாம்."
  scenes:
    - type: define
      chapter: "PPF என்றால் என்ன?"
      term: "பொது வருங்கால வைப்பு நிதி"
      term_en: "Public Provident Fund (PPF)"
      text: "மத்திய அரசு ஆதரவுள்ள **நீண்டகாலச் சேமிப்புத் திட்டம்**. வங்கிகளிலும் தபால் நிலையங்களிலும் கணக்குத் தொடங்கலாம்."
      say:
        - "PPF என்பது, மத்திய அரசு ஆதரவுள்ள ஒரு நீண்டகாலச் சேமிப்புத் திட்டம்."
        - "அங்கீகரிக்கப்பட்ட வங்கிகளிலும், தபால் நிலையங்களிலும் கணக்குத் தொடங்கலாம். ஒருவருக்கு ஒரு கணக்கு மட்டுமே."
    - type: points
      chapter: "அடிப்படை விதிகள்"
      heading: "அடிப்படை **விதிகள்**"
      items:
        - {text: "காலம்: **15 நிதியாண்டுகள்**", say: "கணக்கின் காலம் பதினைந்து நிதியாண்டுகள்."}
        - {text: "ஆண்டுக்கு **₹500 – ₹1.5 லட்சம்**", say: "ஒவ்வொரு நிதியாண்டும் குறைந்தது ஐநூறு ரூபாய் போட வேண்டும். அதிகபட்சம் ஒன்றரை லட்சம் ரூபாய்."}
        - {text: "வட்டி: அரசு **காலாண்டுதோறும்** அறிவிக்கும்", say: "வட்டி விகிதத்தை, மத்திய அரசு ஒவ்வொரு காலாண்டும் அறிவிக்கிறது. அது ஆண்டுதோறும் கூட்டு வட்டியாகச் சேரும்."}
        - {text: "மாதம் **5-ஆம் தேதிக்குள்** போட்டால் அந்த மாத வட்டி", sub: "வட்டி கணக்கிடும் முறை", say: "ஒரு சிறிய குறிப்பு. ஒவ்வொரு மாதமும் ஐந்தாம் தேதிக்குப் பிறகு உள்ள குறைந்தபட்ச இருப்புக்குத்தான் வட்டி கணக்கிடப்படுகிறது. அதனால், ஐந்தாம் தேதிக்குள் போடுவது வட்டிக்கு நல்லது."}
    - type: define
      chapter: "EEE வரி நிலை"
      label: "வரி நிலை"
      term: "EEE: மூன்று இடத்திலும் விலக்கு"
      term_en: "Exempt – Exempt – Exempt"
      text: "**போடும்போது** (பழைய வரி முறையில் 80C கழிவு), **வட்டி** வரும்போது, **முதிர்வில் எடுக்கும்போது**. தற்போதைய விதிகளின்படி மூன்றிலும் வரிச் சலுகை."
      say:
        - "PPF-ன் பெரிய பலம், அதன் வரி நிலை. இதை EEE என்பார்கள்."
        - "முதலாவது, போடும் தொகைக்கு, பழைய வரி முறையில் 80C கீழ் கழிவு. இரண்டாவது, வட்டிக்கு வரி இல்லை. மூன்றாவது, முதிர்வுத் தொகைக்கும் வரி இல்லை."
        - "புதிய வரி முறையைத் தேர்ந்தெடுத்தவர்களுக்கு, 80C கழிவு கிடைக்காது. வரி விதிகள் மாறக்கூடியவை, தாக்கல் செய்யும் முன் சரிபாருங்கள்."
    - type: points
      chapter: "பணம் தேவைப்பட்டால்?"
      heading: "இடையில் **பணம் தேவைப்பட்டால்?**"
      marker: dot
      items:
        - {text: "**3 முதல் 6-வது** நிதியாண்டு: இருப்பின் மேல் **கடன்**", say: "மூன்றாம் நிதியாண்டு முதல் ஆறாம் நிதியாண்டு வரை, PPF இருப்பின் மேல் ஒரு சிறிய கடன் பெறலாம்."}
        - {text: "**7-வது** நிதியாண்டு முதல்: **பகுதி எடுப்பு**", say: "ஏழாம் நிதியாண்டு முதல், விதிகளுக்கு உட்பட்டு, ஒரு பகுதியை எடுக்கலாம்."}
        - {text: "15 வருடம் முடிந்ததும்: **5 வருடத் தொகுதிகளாக நீட்டிப்பு**", say: "பதினைந்து வருடம் முடிந்ததும், கணக்கை ஐந்து வருடத் தொகுதிகளாக நீட்டிக்கலாம், புதிய பணம் போட்டோ போடாமலோ."}
    - type: compare
      chapter: "நன்மைகள், வரம்புகள்"
      heading: "நன்மைகள் vs **வரம்புகள்**"
      left: {title: "நன்மைகள்", color: "#4ade80"}
      right: {title: "வரம்புகள்", color: "#f87171"}
      rows:
        - {left: "**அரசு ஆதரவு**: மிகக் குறைந்த அபாயம்", right: "**நீண்ட lock-in**: 15 வருடம்", say: "நன்மை, அரசு ஆதரவு. அபாயம் மிகக் குறைவு. வரம்பு, பதினைந்து வருட நீண்ட lock-in."}
        - {left: "**வரிச் சலுகை** (EEE)", right: "ஆண்டு **₹1.5 லட்சம்** வரம்பு", say: "நன்மை, வரிச் சலுகை. வரம்பு, ஆண்டுக்கு ஒன்றரை லட்சம் மட்டுமே போட முடியும்."}
        - {left: "**கூட்டு வட்டி** + ஒழுங்கு", right: "வட்டி விகிதம் **மாறலாம்**", say: "நன்மை, கூட்டு வட்டியும் கட்டாய ஒழுங்கும். வரம்பு, வட்டி விகிதம் காலாண்டுதோறும் மாறலாம்."}
    - type: takeaway
      text: "PPF = **பாதுகாப்பான, வரிச் சலுகையுள்ள நீண்டகாலச் சேமிப்பு**. அவசர நிதிக்கு அல்ல."
      say: "சுருக்கமாக, PPF பாதுகாப்பான, வரிச் சலுகையுள்ள நீண்டகாலச் சேமிப்புக் கருவி. ஆனால் lock-in நீண்டது, அதனால் அவசர நிதிக்கு ஏற்றது அல்ல. தற்போதைய வட்டி விகிதத்தையும் விதிகளையும், அதிகாரபூர்வ அரசு இணையதளத்தில் சரிபாருங்கள்."
