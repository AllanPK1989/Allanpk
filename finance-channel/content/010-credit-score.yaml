id: "010"
category: basics
title_ta: "கிரெடிட் ஸ்கோர் என்றால் என்ன?"
title_en: "What is a Credit Score?"
thumb_ta: "உங்கள் **கடன் மதிப்பெண்** எவ்வளவு?"
icon: target
keywords: [credit score, CIBIL score tamil, கிரெடிட் ஸ்கோர், credit report, loan eligibility]
summary:
  - "கிரெடிட் ஸ்கோர் என்றால் என்ன, ஏன் முக்கியம்?"
  - "300 முதல் 900 வரை: எந்த அளவு நல்லது?"
  - "ஸ்கோரைப் பாதிக்கும் 5 காரணிகள்"
  - "உங்கள் ஸ்கோரை நீங்களே பார்த்தால் குறையுமா?"

short:
  scenes:
    - type: hook
      icon: target
      heading: "கடன் கொடுக்கும் முன்,\nவங்கி பார்க்கும் **ஒரு எண்**"
      say: "நீங்கள் கடன் கேட்கும்போது, வங்கி முதலில் பார்க்கும் ஒரு எண் இருக்கிறது. அதுதான் உங்கள் கிரெடிட் ஸ்கோர்."
    - type: define
      term: "கிரெடிட் ஸ்கோர்"
      term_en: "Credit Score (300 – 900)"
      text: "நீங்கள் கடனை **எவ்வளவு ஒழுங்காகத் திருப்பிக் கட்டுகிறீர்கள்** என்பதைக் காட்டும் மதிப்பெண்."
      say: "கடன்களையும் கிரெடிட் கார்டு பில்களையும் நீங்கள் எவ்வளவு ஒழுங்காகக் கட்டுகிறீர்கள் என்பதைக் காட்டும் மூன்று இலக்க மதிப்பெண் இது. முன்னூறு முதல் தொள்ளாயிரம் வரை இருக்கும்."
    - type: points
      heading: "ஸ்கோரை **உயர்த்தும்** பழக்கங்கள்"
      marker: check
      items:
        - {text: "EMI, கார்டு பில்லை **தேதிக்குள்** கட்டுங்கள்", say: "EMI, கிரெடிட் கார்டு பில்லை எப்போதும் கடைசித் தேதிக்குள் கட்டுங்கள். இதுதான் மிக முக்கியமானது."}
        - {text: "கார்டு வரம்பில் **குறைவாகப்** பயன்படுத்துங்கள்", say: "கிரெடிட் கார்டு வரம்பில், ஒரு சிறிய பகுதியை மட்டுமே பயன்படுத்துங்கள்."}
        - {text: "அடிக்கடி **புதுக் கடன்** கேட்காதீர்கள்", say: "குறுகிய காலத்தில் அடிக்கடி புதுக் கடனுக்கு விண்ணப்பிக்காதீர்கள்."}
    - type: takeaway
      text: "நல்ல ஸ்கோர் = கடன் **எளிதாக**, பெரும்பாலும் **குறைந்த வட்டியில்**."
      say: "நல்ல கிரெடிட் ஸ்கோர் இருந்தால், தேவைப்படும்போது கடன் எளிதாகக் கிடைக்கும், பெரும்பாலும் குறைந்த வட்டியிலும் கிடைக்கும்."

long:
  intro_say: "வணக்கம்! வீட்டுக் கடன், கார் கடன், கிரெடிட் கார்டு. எதற்கு விண்ணப்பித்தாலும், உங்களைப் பற்றி வங்கி பார்க்கும் ஒரு எண் உண்டு. இன்று அந்த கிரெடிட் ஸ்கோரைப் பற்றிப் பார்க்கலாம்."
  scenes:
    - type: hook
      chapter: "ஒரு எண், பல கதவுகள்"
      icon: target
      heading: "ஒரே சம்பளம், ஒரே கடன்.\n**வட்டி ஏன் வேறு வேறு?**"
      say:
        - "ஒரே சம்பளம் வாங்கும் இரண்டு பேர், ஒரே கடனுக்கு விண்ணப்பிக்கிறார்கள். ஒருவருக்கு எளிதாகக் கிடைக்கிறது. இன்னொருவருக்கு மறுக்கப்படுகிறது, அல்லது அதிக வட்டி."
        - "இந்த வித்தியாசத்துக்கு ஒரு முக்கியக் காரணம், கிரெடிட் ஸ்கோர்."
    - type: define
      chapter: "கிரெடிட் ஸ்கோர் என்றால் என்ன?"
      term: "கிரெடிட் ஸ்கோர்"
      term_en: "Credit Score"
      text: "உங்கள் கடன் வரலாற்றை வைத்து, **கடனைத் திருப்பிக் கட்டும் நம்பகத்தன்மையைக்** காட்டும் **300 முதல் 900** வரையிலான மதிப்பெண்."
      say:
        - "கிரெடிட் ஸ்கோர் என்பது, உங்கள் கடன் வரலாற்றை வைத்துக் கணக்கிடப்படும், முன்னூறு முதல் தொள்ளாயிரம் வரையிலான ஒரு மதிப்பெண்."
        - "நீங்கள் கடனைத் திருப்பிக் கட்டுவதில் எவ்வளவு நம்பகமானவர் என்பதை இது காட்டுகிறது."
    - type: flow
      chapter: "யார் கணக்கிடுகிறார்கள்?"
      heading: "ஸ்கோர் **எப்படி உருவாகிறது?**"
      nodes:
        - {text: "நீங்கள் கடன் / கார்டு பயன்படுத்துகிறீர்கள்", say: "நீங்கள் கடன் வாங்குகிறீர்கள், அல்லது கிரெடிட் கார்டு பயன்படுத்துகிறீர்கள்."}
        - {text: "வங்கி தகவல் அனுப்புகிறது", sub: "ஒவ்வொரு மாதமும்", say: "நீங்கள் எப்படிக் கட்டுகிறீர்கள் என்ற தகவலை, வங்கிகள் கிரெடிட் தகவல் நிறுவனங்களுக்கு அனுப்புகின்றன."}
        - {text: "கிரெடிட் தகவல் நிறுவனங்கள்", sub: "RBI அனுமதி பெற்றவை", say: "இந்த நிறுவனங்கள், ரிசர்வ் வங்கியின் அனுமதி பெற்றவை. பொதுவாகப் பலருக்குத் தெரிந்த பெயர் CIBIL. இதுபோல வேறு சில நிறுவனங்களும் உண்டு."}
        - {text: "கிரெடிட் ரிப்போர்ட் + ஸ்கோர்", say: "அவை உங்கள் கிரெடிட் ரிப்போர்ட்டையும் ஸ்கோரையும் உருவாக்குகின்றன."}
    - type: bars
      chapter: "எந்த ஸ்கோர் நல்லது?"
      heading: "300 முதல் 900: **எங்கே இருக்கிறீர்கள்?**"
      say: "பொதுவான ஒரு வழிகாட்டியாக, ஸ்கோரை இப்படிப் பார்க்கலாம். ஒவ்வொரு வங்கிக்கும் அளவுகோல் கொஞ்சம் மாறலாம்."
      bars:
        - {label: "650-க்குக் கீழ்", value: 40, display: "குறைவு", color: "#f87171", say: "அறுநூற்று ஐம்பதுக்குக் கீழே என்றால், கடன் கிடைப்பது கடினமாக இருக்கலாம்."}
        - {label: "650 – 749", value: 70, display: "பரவாயில்லை", color: "#fbbf24", say: "அறுநூற்று ஐம்பது முதல் எழுநூற்று நாற்பத்தொன்பது வரை, பரவாயில்லை. ஆனால் மேம்படுத்த இடம் உண்டு."}
        - {label: "750+", value: 100, display: "நல்லது", color: "#4ade80", say: "எழுநூற்று ஐம்பதுக்கு மேல், பொதுவாக நல்ல ஸ்கோராகக் கருதப்படுகிறது."}
    - type: points
      chapter: "ஸ்கோரைப் பாதிக்கும் காரணிகள்"
      heading: "ஸ்கோரைப் பாதிக்கும் **5 காரணிகள்**"
      items:
        - {text: "**சரியான நேரத்தில் கட்டுவது**", sub: "Payment history: மிக முக்கியமானது", say: "முதலாவது, மிக முக்கியமானது, சரியான நேரத்தில் கட்டுவது. ஒரு EMI தாமதம் கூட ஸ்கோரைப் பாதிக்கும்."}
        - {text: "**கார்டு வரம்பில் எவ்வளவு பயன்படுத்துகிறீர்கள்**", sub: "Credit utilization: பொதுவாக 30%-க்குள் நல்லது", say: "இரண்டாவது, கிரெடிட் கார்டு வரம்பில் எவ்வளவு பயன்படுத்துகிறீர்கள். பொதுவாக முப்பது சதவீதத்துக்குள் வைப்பது நல்லது என்று சொல்லப்படுகிறது."}
        - {text: "**கடன் வரலாற்றின் நீளம்**", sub: "Length of credit history", say: "மூன்றாவது, உங்கள் கடன் வரலாறு எவ்வளவு பழையது. அதனால் பழைய கார்டை அவசரப்பட்டு மூட வேண்டியதில்லை."}
        - {text: "**கடன் வகைகளின் கலவை**", sub: "Credit mix", say: "நான்காவது, பாதுகாப்புள்ள கடன், பாதுகாப்பற்ற கடன் என்று பல வகைகளை ஒழுங்காகக் கையாண்ட அனுபவம்."}
        - {text: "**அடிக்கடி புதுக் கடன் விண்ணப்பம்**", sub: "Hard enquiries", say: "ஐந்தாவது, குறுகிய காலத்தில் பல கடன்களுக்கு விண்ணப்பித்தால், ஒவ்வொரு விண்ணப்பமும் பதிவாகி, ஸ்கோரைப் பாதிக்கலாம்."}
    - type: points
      chapter: "பொதுவான சந்தேகங்கள்"
      heading: "பொதுவான **சந்தேகங்கள்**"
      marker: check
      items:
        - {text: "என் ஸ்கோரை நானே பார்த்தால் **குறையாது**", say: "உங்கள் ஸ்கோரை நீங்களே பார்ப்பதால் அது குறையாது. கடன் விண்ணப்பத்தின்போது வங்கி பார்ப்பதுதான் பதிவாகும்."}
        - {text: "ஆண்டுக்கு ஒருமுறை **இலவச ரிப்போர்ட்** பெறலாம்", say: "ஒவ்வொரு கிரெடிட் தகவல் நிறுவனத்திடமும், ஆண்டுக்கு ஒருமுறை இலவசமாக உங்கள் கிரெடிட் ரிப்போர்ட்டைப் பெறலாம்."}
        - {text: "ரிப்போர்ட்டில் தவறு இருந்தால் **திருத்தக் கோரலாம்**", say: "ரிப்போர்ட்டில் உங்களுக்குத் தெரியாத கடன் அல்லது தவறான தகவல் இருந்தால், அந்த நிறுவனத்திடம் திருத்தம் கோரலாம். இது மோசடியைக் கண்டுபிடிக்கவும் உதவும்."}
    - type: takeaway
      text: "கிரெடிட் ஸ்கோர் ஒரு நாளில் உருவாவதில்லை. **ஒழுங்காகக் கட்டும் பழக்கமே** சிறந்த வழி."
      say: "சுருக்கமாக, கிரெடிட் ஸ்கோர் ஒரு நாளில் உருவாவதில்லை, ஒரு நாளில் மாறுவதும் இல்லை. ஒவ்வொரு பில்லையும் தேதிக்குள் கட்டும் பழக்கம்தான், நல்ல ஸ்கோருக்கான சிறந்த வழி."
