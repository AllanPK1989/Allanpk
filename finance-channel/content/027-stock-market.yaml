id: "027"
category: stocks
title_ta: "பங்குச் சந்தை என்றால் என்ன?"
title_en: "What is the Stock Market?"
thumb_ta: "பங்குச் சந்தை = **பங்குகளின் சந்தை**"
icon: chart
keywords: [stock market tamil, பங்குச் சந்தை, NSE BSE, share market basics, how stock market works]
summary:
  - "பங்குச் சந்தை என்றால் என்ன?"
  - "NSE, BSE: இந்தியாவின் முக்கியப் பங்குப் பரிவர்த்தனை மையங்கள்"
  - "பங்கு விலை எப்படி முடிவாகிறது? தேவையும் விநியோகமும்"
  - "யார் யார் பங்கேற்கிறார்கள், SEBI-ன் பங்கு"

short:
  scenes:
    - type: hook
      icon: chart
      heading: "காய்கறிச் சந்தை தெரியும்.\n**பங்குச் சந்தை?**"
      say: "காய்கறிச் சந்தையில், வாங்குபவர்களும் விற்பவர்களும் சந்திக்கிறார்கள். பங்குச் சந்தையும் அப்படித்தான். ஆனால் இங்கே விற்கப்படுவது பங்குகள்."
    - type: flow
      heading: "யார் யாரை **இணைக்கிறார்கள்?**"
      nodes:
        - {text: "வாங்குபவர் / விற்பவர்", sub: "நீங்கள்", say: "நீங்கள், ஒரு பங்கை வாங்கவோ விற்கவோ நினைக்கிறீர்கள்."}
        - {text: "Broker (தரகர்)", sub: "SEBI பதிவு பெற்றவர்", say: "SEBI பதிவு பெற்ற ஒரு தரகர் மூலம், உங்கள் ஆர்டர் செல்கிறது."}
        - {text: "பங்குப் பரிவர்த்தனை மையம்", sub: "NSE / BSE", say: "அது NSE அல்லது BSE என்ற பங்குப் பரிவர்த்தனை மையத்தை அடைகிறது. அங்கே, வாங்குபவரும் விற்பவரும் பொருத்தப்படுகிறார்கள்."}
    - type: takeaway
      text: "பங்கு விலை = **வாங்குபவர்களும் விற்பவர்களும்** ஒப்புக்கொள்ளும் விலை. அது **நிமிடத்துக்கு நிமிடம்** மாறும்."
      say: "ஒரு பங்கின் விலை, வாங்குபவர்களும் விற்பவர்களும் ஒப்புக்கொள்ளும் விலை. தேவையும் விநியோகமும் மாறும்போது, அது நிமிடத்துக்கு நிமிடம் மாறும்."

long:
  intro_say: "வணக்கம்! கடந்த வீடியோவில், பங்கு என்றால் என்ன என்று பார்த்தோம். இன்று, அந்தப் பங்குகள் வாங்கி விற்கப்படும் இடத்தைப் பார்க்கலாம். பங்குச் சந்தை."
  scenes:
    - type: define
      chapter: "பங்குச் சந்தை என்றால் என்ன?"
      term: "பங்குச் சந்தை"
      term_en: "Stock Market"
      text: "பங்குகளை **வாங்குபவர்களும் விற்பவர்களும் சந்திக்கும்**, ஒழுங்குபடுத்தப்பட்ட சந்தை. இன்று இது முழுவதும் **மின்னணு முறையில்** நடக்கிறது."
      say:
        - "பங்குச் சந்தை என்பது, பங்குகளை வாங்குபவர்களும் விற்பவர்களும் சந்திக்கும், ஒழுங்குபடுத்தப்பட்ட ஒரு சந்தை."
        - "முன்பு, ஒரு பெரிய அரங்கில் ஆட்கள் கூச்சலிட்டு வியாபாரம் செய்தார்கள். இன்று, இது முழுவதும் கணினிகள் மூலம், மின்னணு முறையில் நடக்கிறது."
    - type: compare
      chapter: "NSE மற்றும் BSE"
      heading: "இந்தியாவின் **இரண்டு முக்கிய** மையங்கள்"
      left: {title: "BSE"}
      right: {title: "NSE"}
      rows:
        - {left: "Bombay Stock Exchange", right: "National Stock Exchange", say: "இந்தியாவில், இரண்டு முக்கியப் பங்குப் பரிவர்த்தனை மையங்கள் உள்ளன. BSE, அதாவது Bombay Stock Exchange. மற்றும் NSE, அதாவது National Stock Exchange."}
        - {left: "ஆசியாவின் மிகப் பழைய மையங்களில் ஒன்று", right: "முழு மின்னணு வர்த்தகத்தை முன்னெடுத்தது", say: "BSE, ஆசியாவின் மிகப் பழமையான பங்குச் சந்தைகளில் ஒன்று. NSE, தொண்ணூறுகளில் தொடங்கி, முழு மின்னணு வர்த்தகத்தை முன்னெடுத்தது."}
        - {left: "முக்கியக் குறியீடு: **Sensex**", right: "முக்கியக் குறியீடு: **Nifty 50**", say: "BSE-ன் முக்கியக் குறியீடு Sensex. NSE-ன் முக்கியக் குறியீடு Nifty ஐம்பது. இவற்றைப் பற்றி அடுத்த வீடியோவில் பார்க்கலாம்."}
    - type: flow
      chapter: "ஒரு வர்த்தகம் எப்படி நடக்கிறது?"
      heading: "ஒரு வர்த்தகம் **எப்படி நடக்கிறது?**"
      nodes:
        - {text: "நீங்கள் ஆர்டர் போடுகிறீர்கள்", sub: "Broker ஆப் / இணையதளம்", say: "நீங்கள், உங்கள் தரகரின் ஆப் அல்லது இணையதளம் மூலம், ஒரு ஆர்டர் போடுகிறீர்கள்."}
        - {text: "பரிவர்த்தனை மையம் பொருத்துகிறது", sub: "வாங்குபவர் ↔ விற்பவர்", say: "பரிவர்த்தனை மையத்தின் கணினி, உங்கள் ஆர்டரை எதிர்ப்பக்க ஆர்டருடன் பொருத்துகிறது."}
        - {text: "Clearing & Settlement", sub: "பணமும் பங்குகளும் கை மாறும்", say: "பிறகு, பணமும் பங்குகளும் முறையாகக் கை மாறுவதை, clearing அமைப்புகள் உறுதி செய்கின்றன."}
        - {text: "பங்குகள் உங்கள் Demat கணக்கில்", say: "வாங்கிய பங்குகள், உங்கள் Demat கணக்குக்கு வந்து சேரும். இந்த முழுச் செயல்முறையையும் ஒரு தனி வீடியோவில் விரிவாகப் பார்க்கலாம்."}
    - type: points
      chapter: "விலை எப்படி முடிவாகிறது?"
      heading: "பங்கு விலை **எப்படி முடிவாகிறது?**"
      items:
        - {text: "**வாங்க விரும்புவோர் அதிகம்** → விலை ஏறும்", say: "ஒரு பங்கை வாங்க விரும்புவோர், விற்க விரும்புவோரை விட அதிகம் என்றால், விலை ஏறும்."}
        - {text: "**விற்க விரும்புவோர் அதிகம்** → விலை இறங்கும்", say: "விற்க விரும்புவோர் அதிகம் என்றால், விலை இறங்கும்."}
        - {text: "தேவையைப் பாதிப்பவை: **செய்திகள், லாபம், பொருளாதாரம், மனநிலை**", say: "இந்தத் தேவையைப் பல விஷயங்கள் பாதிக்கின்றன. நிறுவனத்தின் லாபம், செய்திகள், பொருளாதார நிலை, முதலீட்டாளர்களின் மனநிலை. அதனால்தான், குறுகிய காலத்தில் விலைகள் கணிக்க முடியாதபடி நகர்கின்றன."}
    - type: points
      chapter: "பங்கேற்பாளர்களும் SEBI-யும்"
      heading: "யார் யார் **பங்கேற்கிறார்கள்?**"
      marker: dot
      items:
        - {text: "**சில்லறை முதலீட்டாளர்கள்**: உங்களைப் போன்றவர்கள்", say: "உங்களைப் போன்ற சில்லறை முதலீட்டாளர்கள்."}
        - {text: "**நிறுவன முதலீட்டாளர்கள்**: மியூச்சுவல் ஃபண்ட், காப்பீட்டு நிறுவனங்கள், வெளிநாட்டு நிறுவனங்கள்", say: "மியூச்சுவல் ஃபண்டுகள், காப்பீட்டு நிறுவனங்கள், வெளிநாட்டு முதலீட்டு நிறுவனங்கள் போன்ற பெரிய நிறுவன முதலீட்டாளர்கள்."}
        - {text: "**SEBI**: விதிகளை உருவாக்கி, கண்காணிக்கும் அமைப்பு", say: "இவை எல்லாவற்றையும், SEBI என்ற ஒழுங்குமுறை அமைப்பு கண்காணிக்கிறது. நியாயமான, வெளிப்படையான சந்தையை உறுதி செய்வது அதன் வேலை."}
      after: "வழக்கமான வர்த்தக நேரம், வார நாட்களில், காலை ஒன்பது பதினைந்து முதல் மாலை மூன்று முப்பது வரை."
    - type: takeaway
      text: "பங்குச் சந்தை = **வணிகங்களின் உரிமை கை மாறும் இடம்**. குறுகிய கால விலை நகர்வுகள் **கணிக்க முடியாதவை**."
      say: "சுருக்கமாக, பங்குச் சந்தை என்பது, வணிகங்களின் உரிமை கை மாறும் ஒழுங்குபடுத்தப்பட்ட இடம். குறுகிய காலத்தில் விலைகள் கணிக்க முடியாதபடி நகரும். நீண்டகாலத்தில், வணிகங்களின் செயல்பாடே முக்கியம்."
