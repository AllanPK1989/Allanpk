id: "014"
category: insurance
title_ta: "டேர்ம் இன்சூரன்ஸ்"
title_en: "Term Insurance"
thumb_ta: "**குறைந்த பிரீமியம், பெரிய பாதுகாப்பு**"
icon: shield
keywords: [term insurance tamil, டேர்ம் இன்சூரன்ஸ், life insurance, term plan, sum assured]
summary:
  - "டேர்ம் இன்சூரன்ஸ் என்றால் என்ன?"
  - "ஏன் பிரீமியம் குறைவு, cover பெரியது?"
  - "யாருக்குத் தேவை, யாருக்குத் தேவையில்லை?"
  - "வாங்கும்போது கவனிக்க வேண்டியவை"

short:
  scenes:
    - type: hook
      icon: users
      heading: "நீங்கள் இல்லையென்றால்,\n**குடும்பம் எப்படிச் சமாளிக்கும்?**"
      say: "உங்கள் வருமானத்தை நம்பி ஒரு குடும்பம் இருக்கிறது. நாளை நீங்கள் இல்லையென்றால், அவர்கள் எப்படிச் சமாளிப்பார்கள்?"
    - type: define
      term: "டேர்ம் இன்சூரன்ஸ்"
      term_en: "Term Insurance"
      text: "ஒரு குறிப்பிட்ட காலத்துக்குள் (term) பாலிசிதாரர் இறந்தால், **நாமினிக்கு பெரிய தொகை**. **தூய பாதுகாப்பு**, முதலீடு இல்லை."
      say: "டேர்ம் இன்சூரன்ஸ் என்பது, குறிப்பிட்ட காலத்துக்குள் பாலிசிதாரர் இறந்துவிட்டால், நாமினிக்கு ஒரு பெரிய தொகை தரும் தூய பாதுகாப்புத் திட்டம்."
    - type: points
      heading: "முக்கிய **அம்சங்கள்**"
      marker: check
      items:
        - {text: "**குறைந்த** பிரீமியத்தில் **பெரிய** cover", say: "மற்ற உயிர் காப்பீடுகளை விட, குறைந்த பிரீமியத்தில் பெரிய cover கிடைக்கும்."}
        - {text: "காலம் முடிந்து உயிருடன் இருந்தால் **பணம் திரும்ப வராது**", say: "காலம் முடிந்து நீங்கள் நலமாக இருந்தால், பணம் திரும்ப வராது. அதனால்தான் பிரீமியம் குறைவு."}
        - {text: "**இளம் வயதில்** வாங்கினால் பிரீமியம் குறைவு", say: "இளம் வயதில், நல்ல ஆரோக்கியத்துடன் வாங்கினால், பிரீமியம் இன்னும் குறைவு."}
    - type: takeaway
      text: "உங்களை நம்பி **குடும்பம்** இருந்தால், டேர்ம் இன்சூரன்ஸ் பற்றி **முதலில்** யோசியுங்கள்."
      say: "உங்கள் வருமானத்தை நம்பி குடும்பம் இருந்தால், நிதித் திட்டமிடலில் முதலில் யோசிக்க வேண்டியவற்றில் இதுவும் ஒன்று."

long:
  intro_say: "வணக்கம்! கடந்த வீடியோவில், காப்பீடு என்றால் என்ன என்று பார்த்தோம். இன்று, உயிர் காப்பீட்டின் எளிமையான, தூய வடிவத்தைப் பார்க்கலாம். டேர்ம் இன்சூரன்ஸ்."
  scenes:
    - type: hook
      chapter: "ஏன் தேவை?"
      icon: users
      heading: "உங்கள் வருமானம் நின்றால்,\n**யார் பாதிக்கப்படுவார்கள்?**"
      say:
        - "வீட்டு வாடகை, குழந்தைகளின் படிப்பு, வீட்டுக் கடன் EMI, பெற்றோரின் மருத்துவச் செலவு. இவை எல்லாம் உங்கள் வருமானத்தை நம்பி இருக்கலாம்."
        - "நீங்கள் திடீரென இல்லாமல் போனால், அந்த வருமானம் நின்றுவிடும். செலவுகள் நிற்காது. அந்த இடைவெளியை நிரப்புவதுதான் டேர்ம் இன்சூரன்ஸின் வேலை."
    - type: define
      chapter: "டேர்ம் இன்சூரன்ஸ் என்றால் என்ன?"
      term: "டேர்ம் இன்சூரன்ஸ்"
      term_en: "Term Insurance"
      text: "குறிப்பிட்ட காலத்துக்குள் (உதா: 60 வயது வரை) பாலிசிதாரர் இறந்தால், **நாமினிக்கு Sum Assured** முழுவதும் கிடைக்கும். காலம் முடிந்தால் **எதுவும் திரும்ப வராது**."
      say:
        - "டேர்ம் இன்சூரன்ஸில், நீங்கள் ஒரு காலத்தைத் தேர்ந்தெடுக்கிறீர்கள். உதாரணமாக, அறுபது வயது வரை."
        - "அந்தக் காலத்துக்குள் நீங்கள் இறந்துவிட்டால், நீங்கள் குறிப்பிட்ட நாமினிக்கு Sum Assured முழுவதும் கிடைக்கும்."
        - "காலம் முடிந்து நீங்கள் நலமாக இருந்தால், எந்தத் தொகையும் திரும்ப வராது. இது தூய பாதுகாப்பு."
    - type: compare
      chapter: "ஏன் பிரீமியம் குறைவு?"
      heading: "ஏன் **பிரீமியம் குறைவு?**"
      left: {title: "டேர்ம் இன்சூரன்ஸ்"}
      right: {title: "சேமிப்பு + காப்பீடு திட்டங்கள்"}
      say: "டேர்ம் இன்சூரன்ஸில் பிரீமியம் ஏன் இவ்வளவு குறைவு?"
      rows:
        - {left: "பிரீமியம் முழுவதும் **பாதுகாப்புக்கு**", right: "பிரீமியத்தின் பெரும்பகுதி **சேமிப்புப் பகுதிக்கு**", say: "டேர்ம் இன்சூரன்ஸில், பிரீமியம் முழுவதும் பாதுகாப்புக்கே போகிறது. சேமிப்பும் காப்பீடும் கலந்த திட்டங்களில், பிரீமியத்தின் பெரும்பகுதி சேமிப்புப் பகுதிக்குப் போகிறது."}
        - {left: "உயிருடன் இருந்தால் **எதுவும் திரும்பாது**", right: "முதிர்வுத் தொகை உண்டு", say: "டேர்ம் இன்சூரன்ஸில், காலம் முடிந்தால் எதுவும் திரும்ப வராது. மற்ற திட்டங்களில் முதிர்வுத் தொகை உண்டு, அதனால் பிரீமியம் அதிகம்."}
        - {left: "**பெரிய** cover, **சிறிய** பிரீமியம்", right: "**சிறிய** cover, **பெரிய** பிரீமியம்", say: "விளைவு, டேர்ம் இன்சூரன்ஸில் சிறிய பிரீமியத்துக்குப் பெரிய cover. மற்றவற்றில் பெரும்பாலும் பெரிய பிரீமியத்துக்குச் சிறிய cover. இதைப் பற்றி ஒரு தனி வீடியோவில் விரிவாகப் பார்க்கலாம்."}
    - type: points
      chapter: "யாருக்குத் தேவை?"
      heading: "யாருக்கு **முக்கியம்?**"
      marker: check
      items:
        - {text: "**குடும்பம் உங்கள் வருமானத்தை நம்பி** இருந்தால்", say: "துணைவர், குழந்தைகள், பெற்றோர் என்று யாராவது உங்கள் வருமானத்தை நம்பி இருந்தால்."}
        - {text: "**பெரிய கடன்** இருந்தால் (உதா: வீட்டுக் கடன்)", say: "வீட்டுக் கடன் போன்ற பெரிய கடன் இருந்தால். நீங்கள் இல்லாதபோது, அந்தச் சுமை குடும்பத்தின் மேல் விழக் கூடாது."}
      after: "யாரும் உங்கள் வருமானத்தை நம்பி இல்லை, கடனும் இல்லை என்றால், உதாரணமாக தனியாக வாழும் மாணவர் என்றால், உடனடித் தேவை குறைவாக இருக்கலாம்."
    - type: points
      chapter: "வாங்கும்போது கவனிக்க வேண்டியவை"
      heading: "வாங்கும்போது **கவனியுங்கள்**"
      items:
        - {text: "**போதுமான cover**: வருமானம், கடன், இலக்குகள்", say: "முதலாவது, போதுமான cover. எவ்வளவு தேவை என்று கணக்கிடுவதை, ஒரு தனி வீடியோவில் பார்க்கலாம்."}
        - {text: "**காலம்**: சம்பாதிக்கும் வயது முடியும் வரை", say: "இரண்டாவது, காலம். பொதுவாக, நீங்கள் சம்பாதிக்கும் வயது முடியும் வரை, அல்லது பொறுப்புகள் முடியும் வரை."}
        - {text: "**உண்மையான தகவல்**: உடல்நலம், பழக்கங்கள்", say: "மூன்றாவது, மிக முக்கியம். உடல்நலம், புகைப்பழக்கம் போன்ற தகவல்களை உண்மையாகச் சொல்லுங்கள். மறைத்தால், பின்னால் claim நிராகரிக்கப்படலாம்."}
        - {text: "**நாமினி** விவரங்களைக் குடும்பத்துக்குச் சொல்லுங்கள்", say: "நான்காவது, நாமினி விவரங்களைச் சரியாகக் கொடுத்து, பாலிசி இருப்பதைக் குடும்பத்துக்கும் தெரியப்படுத்துங்கள்."}
    - type: takeaway
      text: "டேர்ம் இன்சூரன்ஸ் = **குடும்பத்துக்கான வருமானப் பாதுகாப்பு**. எளிமையானது, மலிவானது, சக்தி வாய்ந்தது."
      say: "சுருக்கமாக, டேர்ம் இன்சூரன்ஸ் என்பது, நீங்கள் இல்லாதபோது உங்கள் குடும்பத்தின் வருமானத்தைக் காக்கும் எளிமையான, மலிவான பாதுகாப்பு. எந்த ஒரு குறிப்பிட்ட பாலிசியையும் தேர்ந்தெடுக்கும் முன், விதிமுறைகளை முழுமையாகப் படித்து, ஒப்பிட்டுப் பாருங்கள்."
