id: "001"
category: basics
title_ta: "பணவீக்கம் என்றால் என்ன?"
title_en: "What is Inflation?"
thumb_ta: "உங்கள் **₹100** ஏன் சுருங்குகிறது?"
icon: flame
keywords: [inflation, பணவீக்கம், inflation in tamil, purchasing power, CPI, real return]
summary:
  - "பணவீக்கம் (Inflation) என்றால் என்ன?"
  - "விலைகள் ஏன் உயர்கின்றன — மூன்று முக்கிய காரணங்கள்"
  - "CPI மூலம் பணவீக்கம் எப்படி அளக்கப்படுகிறது"
  - "6% பணவீக்கத்தில் உங்கள் ₹100-க்கு என்ன ஆகும் (உதாரணக் கணக்கு)"
  - "உண்மையான வருமானம் (Real Return) என்றால் என்ன?"

short:
  scenes:
    - type: hook
      icon: flame
      heading: "இன்று **₹100**-க்கு வாங்கும் பொருள்,\n10 வருடம் கழித்து எவ்வளவு?"
      say: "இன்று நூறு ரூபாய்க்கு வாங்கும் ஒரு பொருளை, பத்து வருடம் கழித்து அதே நூறு ரூபாய்க்கு வாங்க முடியுமா?"
    - type: define
      term: "பணவீக்கம்"
      term_en: "Inflation"
      text: "பொருட்கள் மற்றும் சேவைகளின் விலை, காலப்போக்கில் **பொதுவாக உயர்வது**."
      say: "பொருட்கள் மற்றும் சேவைகளின் விலை, காலப்போக்கில் பொதுவாக உயர்வதைத்தான் பணவீக்கம், அதாவது Inflation என்கிறோம்."
    - type: stat
      label: "ஆண்டுக்கு 6% பணவீக்கம் என்றால்"
      value: "₹100"
      to: "₹179"
      caption: "10 வருடம் கழித்து அதே பொருளின் விலை"
      say: "உதாரணமாக, பணவீக்கம் ஆண்டுக்கு ஆறு சதவீதம் என்று வைத்துக்கொள்வோம்."
      to_say: "அப்படியென்றால், இன்று நூறு ரூபாய் விலையுள்ள பொருள், பத்து வருடம் கழித்து சுமார் நூற்று எழுபத்தொன்பது ரூபாய் ஆகும்."
    - type: takeaway
      text: "உங்கள் பணம் **பணவீக்கத்தை விட வேகமாக** வளர வேண்டும். இல்லையென்றால் அதன் மதிப்பு குறையும்."
      say: "அதனால், சேமிக்கும் பணம் பணவீக்கத்தை விட வேகமாக வளரவில்லை என்றால், அதன் உண்மையான மதிப்பு குறைந்துகொண்டே போகும்."

long:
  intro_say: "வணக்கம்! இன்றைக்கு, உங்கள் பணத்தை அமைதியாகக் கரைக்கும் ஒரு விஷயத்தைப் பார்க்கலாம். அதுதான் பணவீக்கம்."
  scenes:
    - type: hook
      chapter: "ஒரு கேள்வி"
      icon: question
      heading: "உங்கள் அப்பா காலத்தில் ஒரு **டீ** விலை எவ்வளவு?"
      sub: "இன்று அதே டீ எவ்வளவு?"
      say:
        - "உங்கள் அப்பா இளமையாக இருந்தபோது, ஒரு டீ என்ன விலை இருந்தது என்று கேட்டுப் பாருங்கள்."
        - "இன்று அதே டீ பல மடங்கு விலை. இந்த விலை உயர்வுக்குப் பின்னால் இருப்பதுதான் பணவீக்கம்."
    - type: define
      chapter: "பணவீக்கம் என்றால் என்ன?"
      term: "பணவீக்கம்"
      term_en: "Inflation"
      text: "பொருட்கள் மற்றும் சேவைகளின் விலை, காலப்போக்கில் **பொதுவாக உயர்வது**. அதனால் அதே ரூபாய்க்கு **குறைவான பொருள்** கிடைக்கும்."
      say:
        - "பொருட்கள் மற்றும் சேவைகளின் விலை, காலப்போக்கில் பொதுவாக உயர்வதைத்தான் பணவீக்கம் என்கிறோம்."
        - "விலை உயரும்போது, அதே ஒரு ரூபாய்க்கு முன்பைவிடக் குறைவான பொருள்தான் கிடைக்கும். இதை, பணத்தின் வாங்கும் சக்தி குறைவது என்று சொல்வோம்."
    - type: points
      chapter: "விலை ஏன் உயர்கிறது?"
      heading: "விலை ஏன் உயர்கிறது?"
      say: "விலைகள் உயர முக்கியமாக மூன்று காரணங்கள் உண்டு."
      items:
        - text: "**தேவை அதிகம்**, பொருள் குறைவு"
          sub: "Demand-pull inflation"
          say: "முதலாவது, ஒரு பொருளை வாங்க நினைப்பவர்கள் அதிகம், ஆனால் சந்தையில் அந்தப் பொருள் குறைவு என்றால், விலை உயரும்."
        - text: "**உற்பத்திச் செலவு** உயர்வு"
          sub: "Cost-push inflation"
          say: "இரண்டாவது, எரிபொருள், மூலப்பொருள், கூலி போன்ற உற்பத்திச் செலவுகள் உயர்ந்தால், அந்தச் சுமை விலையில் வந்து சேரும்."
        - text: "புழக்கத்தில் **அதிக பணம்**"
          sub: "Money supply"
          say: "மூன்றாவது, பொருளாதாரத்தில் புழங்கும் பணம், பொருட்களின் அளவை விட வேகமாக அதிகரித்தால், விலைகளும் உயரலாம்."
    - type: define
      chapter: "எப்படி அளக்கிறார்கள்?"
      label: "அளவீடு"
      term: "நுகர்வோர் விலைக் குறியீடு"
      term_en: "CPI — Consumer Price Index"
      text: "உணவு, உடை, வாடகை, போக்குவரத்து போன்ற ஒரு **பொருட்களின் கூடையின்** விலை, ஒரு வருடத்தில் எவ்வளவு மாறியது என்று காட்டும் குறியீடு."
      say:
        - "இந்தியாவில் பணவீக்கத்தை அளக்க முக்கியமாகப் பயன்படுவது, நுகர்வோர் விலைக் குறியீடு, அதாவது CPI."
        - "ஒரு சாதாரண குடும்பம் வாங்கும் உணவு, உடை, வாடகை, போக்குவரத்து போன்றவற்றின் ஒரு கூடையை எடுத்து, அதன் விலை ஒரு வருடத்தில் எவ்வளவு மாறியது என்று பார்க்கிறார்கள்."
        - "இந்திய ரிசர்வ் வங்கிக்கு, CPI பணவீக்கத்தை சுமார் நான்கு சதவீதத்தில் வைத்திருக்க வேண்டும் என்ற இலக்கு உள்ளது."
    - type: bars
      chapter: "உங்கள் ₹100-க்கு என்ன ஆகும்?"
      heading: "6% பணவீக்கத்தில் **₹100**-இன் வாங்கும் சக்தி"
      say: "இப்போது ஒரு கணக்கு பார்க்கலாம். பணவீக்கம் ஆண்டுக்கு ஆறு சதவீதம் என்று வைத்துக்கொள்வோம்."
      bars:
        - {label: "இன்று", value: 100, display: "₹100", say: "இன்று உங்கள் நூறு ரூபாய்க்கு, முழுதாக நூறு ரூபாய் மதிப்புள்ள பொருள் கிடைக்கும்."}
        - {label: "5 வருடம்", value: 75, display: "₹75", say: "ஐந்து வருடம் கழித்து, அதே நூறு ரூபாய்க்கு, இன்றைய விலையில் சுமார் எழுபத்தைந்து ரூபாய் மதிப்புள்ள பொருள்தான் கிடைக்கும்."}
        - {label: "10 வருடம்", value: 56, display: "₹56", say: "பத்து வருடத்தில், அது சுமார் ஐம்பத்தாறு ரூபாய்."}
        - {label: "20 வருடம்", value: 31, display: "₹31", say: "இருபது வருடத்தில், சுமார் முப்பத்தொரு ரூபாய் மட்டுமே. அதாவது, மதிப்பில் மூன்றில் இரண்டு பங்கு காணாமல் போகிறது."}
    - type: steps
      chapter: "உண்மையான வருமானம்"
      heading: "உண்மையான வருமானம் (Real Return)"
      say: "அடுத்து, மிக முக்கியமான ஒரு கருத்து. உண்மையான வருமானம்."
      lines:
        - {text: "சேமிப்புக் கணக்கு வட்டி: **3%**", say: "உங்கள் சேமிப்புக் கணக்கில் ஆண்டுக்கு மூன்று சதவீதம் வட்டி கிடைக்கிறது என்று வைத்துக்கொள்வோம்."}
        - {text: "பணவீக்கம்: **6%**", say: "அதே நேரத்தில் பணவீக்கம் ஆறு சதவீதம்."}
        - {text: "3% − 6% ≈ **−3%**", say: "அப்படியென்றால், கணக்கில் தொகை கூடுவது போலத் தெரிந்தாலும், அதன் வாங்கும் சக்தி ஆண்டுக்கு சுமார் மூன்று சதவீதம் குறைகிறது."}
      result: {text: "தொகை கூடுகிறது, ஆனால் மதிப்பு குறைகிறது!", say: "தொகை கூடுகிறது, ஆனால் மதிப்பு குறைகிறது. இதுதான் பணவீக்கத்தின் மறைமுக விளைவு."}
    - type: points
      chapter: "நினைவில் கொள்ள வேண்டியவை"
      heading: "நினைவில் கொள்ளுங்கள்"
      marker: check
      items:
        - {text: "இலக்குகளுக்கு **எதிர்கால விலையை** கணக்கிடுங்கள்", say: "முதலாவது, குழந்தைகளின் படிப்பு, ஓய்வுக்காலம் போன்ற நீண்டகால இலக்குகளைத் திட்டமிடும்போது, இன்றைய விலையை அல்ல, எதிர்கால விலையைக் கணக்கிட வேண்டும்."}
        - {text: "வருமானத்தை **பணவீக்கத்துடன் ஒப்பிடுங்கள்**", say: "இரண்டாவது, எந்தச் சேமிப்பு அல்லது முதலீட்டின் வருமானத்தையும், பணவீக்கத்துடன் ஒப்பிட்டுப் பாருங்கள்."}
        - {text: "அதிக வருமானம் என்றால் பொதுவாக **அதிக அபாயம்**", say: "மூன்றாவது, பணவீக்கத்தை மிஞ்சும் வருமானம் தரும் வழிகளில், பொதுவாக அபாயமும் அதிகம். அதை அடுத்தடுத்த வீடியோக்களில் விரிவாகப் பார்க்கலாம்."}
    - type: takeaway
      text: "பணத்தைச் **சேமித்தால் மட்டும் போதாது**. அது பணவீக்கத்தை விட வேகமாக வளர வேண்டும்."
      say: "சுருக்கமாக, பணத்தைச் சேமித்தால் மட்டும் போதாது. அதன் உண்மையான மதிப்பு காக்கப்பட வேண்டும் என்றால், அது பணவீக்கத்தை விட வேகமாக வளர வேண்டும்."
