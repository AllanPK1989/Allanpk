id: "030"
category: insurance
title_ta: "இன்சூரன்ஸையும் முதலீட்டையும் ஏன் கலக்கக் கூடாது?"
title_en: "Why Mixing Insurance and Investment Costs You"
thumb_ta: "இன்சூரன்ஸ் + முதலீடு = **இரண்டிலும் குறைவு?**"
icon: swap
keywords: [insurance vs investment, term plus invest, endowment plan, buy term invest the rest, insurance tamil]
summary:
  - "சேமிப்பு + காப்பீடு கலந்த திட்டங்கள் எப்படி வேலை செய்கின்றன?"
  - "ஒரு கற்பனை ஒப்பீடு: கலந்த திட்டம் vs டேர்ம் + தனி முதலீடு"
  - "எதை ஒப்பிட வேண்டும்: Cover, வருமானம், நெகிழ்வு"
  - "இரு பக்கமும்: யாருக்கு எது பொருந்தலாம்"

short:
  scenes:
    - type: hook
      icon: swap
      heading: "காப்பீடும் முதலீடும் ஒன்றாக:\n**இரண்டிலும் குறைவா?**"
      say: "காப்பீடும் முதலீடும் ஒரே திட்டத்தில். கேட்க வசதியாக இருக்கிறது. ஆனால் இரண்டிலும் குறைவாகக் கிடைக்கிறதா?"
    - type: compare
      heading: "ஆண்டுக்கு ₹50,000 (கற்பனை உதாரணம்)"
      left: {title: "கலந்த திட்டம்"}
      right: {title: "டேர்ம் + தனி முதலீடு"}
      rows:
        - {left: "Cover: **₹10 லட்சம்**", right: "Cover: **₹1 கோடி** (டேர்ம்)", say: "ஆண்டுக்கு ஐம்பதாயிரம் ரூபாய். ஒரு கலந்த திட்டத்தில், cover பத்து லட்சம் என்று வைத்துக்கொள்வோம். அதே பணத்தில், பெரும்பாலும் ஒரு கோடி டேர்ம் cover-ம் வாங்கி, மீதியை முதலீடு செய்யலாம்."}
        - {left: "முதிர்வுத் தொகை உண்டு", right: "மீதிப் பணம் **தனியாக வளரும்**", say: "கலந்த திட்டத்தில் முதிர்வுத் தொகை உண்டு. இரண்டாவது வழியில், மீதிப் பணம் தனியாக முதலீடாக வளரும். அதற்கு உத்தரவாதம் இல்லை, ஒழுங்கும் தேவை."}
    - type: takeaway
      text: "ஒப்பிடும்போது **cover-ஐயும், உண்மையான வருமானத்தையும்** தனித்தனியாகப் பாருங்கள்."
      say: "எந்தத் திட்டத்தையும் ஒப்பிடும்போது, cover எவ்வளவு, உண்மையான வருமானம் எவ்வளவு என்று தனித்தனியாகப் பாருங்கள்."

long:
  intro_say: "வணக்கம்! காப்பீடும் கிடைக்கும், பணமும் திரும்பக் கிடைக்கும். இப்படிப்பட்ட திட்டங்கள் நம் ஊரில் மிகப் பிரபலம். இன்று அவற்றைப் புரிந்துகொண்டு, எப்படி ஒப்பிடுவது என்று பார்க்கலாம்."
  scenes:
    - type: hook
      chapter: "ஏன் பிரபலம்?"
      icon: swap
      heading: "'பணம் **வீணாகாது**,\nகடைசியில் **திரும்பக் கிடைக்கும்**'"
      say:
        - "டேர்ம் இன்சூரன்ஸில், எதுவும் நடக்கவில்லை என்றால் பணம் திரும்ப வராது. அது வீண் என்று பலர் உணர்கிறார்கள்."
        - "அதனால், பணம் கடைசியில் திரும்பக் கிடைக்கும் திட்டங்கள் கவர்ச்சியாகத் தெரிகின்றன. ஆனால் அதற்கு என்ன விலை கொடுக்கிறோம்?"
    - type: define
      chapter: "கலந்த திட்டங்கள்"
      term: "சேமிப்பு + காப்பீடு திட்டங்கள்"
      term_en: "Endowment / Money-back / ULIP போன்றவை"
      text: "பிரீமியத்தின் ஒரு பகுதி **காப்பீட்டுக்கு**, பெரும்பகுதி **சேமிப்பு / முதலீட்டுக்கு**. முதிர்வில் ஒரு தொகை கிடைக்கும்."
      say:
        - "இந்தத் திட்டங்களில், நீங்கள் கட்டும் பிரீமியத்தின் ஒரு பகுதி காப்பீட்டுக்குப் போகிறது. பெரும்பகுதி, சேமிப்பு அல்லது முதலீட்டுப் பகுதிக்குப் போகிறது."
        - "முதிர்வில், ஒரு தொகை கிடைக்கும். இந்த வகைகளில் பல வடிவங்கள் உண்டு. ஒவ்வொன்றின் விதிமுறைகளும் வேறுபடும்."
    - type: compare
      chapter: "ஒரு கற்பனை ஒப்பீடு"
      heading: "ஆண்டுக்கு ₹50,000, 20 வருடம் (கற்பனை)"
      left: {title: "A: கலந்த திட்டம்"}
      right: {title: "B: டேர்ம் + தனி முதலீடு"}
      say: "ஒரு கற்பனை ஒப்பீடு. எல்லா எண்களும் விளக்கத்துக்காக மட்டுமே. உண்மையான திட்டங்களின் எண்கள் மாறுபடும்."
      rows:
        - {left: "பிரீமியம்: ₹50,000/ஆண்டு", right: "டேர்ம் ₹10,000 + முதலீடு ₹40,000", say: "இருவரும் ஆண்டுக்கு ஐம்பதாயிரம் செலவு செய்கிறார்கள். A, ஒரு கலந்த திட்டத்தில். B, பத்தாயிரம் டேர்ம் பிரீமியம், நாற்பதாயிரம் தனி முதலீடு."}
        - {left: "Cover: **₹10 லட்சம்**", right: "Cover: **₹1 கோடி**", say: "A-வின் cover, பத்து லட்சம் என்று வைத்துக்கொள்வோம். B-யின் டேர்ம் cover, ஒரு கோடி. குடும்பத்தின் பாதுகாப்பில், பத்து மடங்கு வித்தியாசம்."}
        - {left: "20 வருடம் கழித்து: முதிர்வுத் தொகை", right: "₹40,000 × 20 வருடம் @ 8% (கற்பனை) ≈ **₹19.8 லட்சம்**", say: "இருபது வருடம் கழித்து, A-க்கு திட்டத்தின்படி ஒரு முதிர்வுத் தொகை. B-யின் முதலீடு, ஆண்டுக்கு எட்டு சதவீதம் என்ற கற்பனை வளர்ச்சியில், சுமார் பத்தொன்பது புள்ளி எட்டு லட்சம்."}
      after: "எந்த வழி அதிகம் தரும் என்பது, உண்மையான திட்டத்தின் வருமானத்தைப் பொறுத்தது. அதனால்தான், ஒப்பிடுவது எப்படி என்று தெரிய வேண்டும்."
    - type: points
      chapter: "எதை ஒப்பிட வேண்டும்?"
      heading: "எதை **ஒப்பிட வேண்டும்?**"
      items:
        - {text: "**Cover போதுமா?** குடும்பத்தின் தேவையுடன் ஒப்பிடுங்கள்", say: "முதலாவது, cover போதுமா? கடந்த வீடியோவில் பார்த்த கணக்கின்படி, குடும்பத்தின் தேவையுடன் ஒப்பிடுங்கள்."}
        - {text: "**உண்மையான ஆண்டு வருமானம்** (IRR) எவ்வளவு?", say: "இரண்டாவது, கட்டும் பிரீமியங்களுக்கும் கிடைக்கும் தொகைக்கும் இடையே, உண்மையான ஆண்டு வருமான விகிதம் எவ்வளவு? இதை IRR என்பார்கள். அதைப் பணவீக்கத்துடன் ஒப்பிடுங்கள்."}
        - {text: "**நெகிழ்வு**: இடையில் நிறுத்தினால் என்ன ஆகும்?", say: "மூன்றாவது, இடையில் நிறுத்த வேண்டி வந்தால் என்ன ஆகும்? பல கலந்த திட்டங்களில், ஆரம்ப வருடங்களில் நிறுத்தினால் கணிசமான இழப்பு உண்டு."}
        - {text: "**கட்டணங்கள்**: எவ்வளவு, எங்கே?", say: "நான்காவது, கட்டணங்கள் எவ்வளவு, எங்கெல்லாம் பிடிக்கப்படுகின்றன?"}
    - type: compare
      chapter: "இரு பக்கமும்"
      heading: "நியாயமாக, **இரு பக்கமும்**"
      left: {title: "டேர்ம் + தனி முதலீடு"}
      right: {title: "கலந்த திட்டம்"}
      rows:
        - {left: "பொதுவாக **பெரிய cover**, வெளிப்படைத்தன்மை", right: "**கட்டாய ஒழுங்கு**: பிரீமியம் கட்டியே ஆக வேண்டும்", say: "டேர்ம் மற்றும் தனி முதலீட்டில், பொதுவாகப் பெரிய cover, அதிக வெளிப்படைத்தன்மை. கலந்த திட்டத்தில், பிரீமியம் கட்டியே ஆக வேண்டும் என்ற கட்டாய ஒழுங்கு சிலருக்கு உதவலாம்."}
        - {left: "**சுய ஒழுங்கு** தேவை: முதலீட்டைத் தொடர வேண்டும்", right: "பொதுவாக **cover குறைவு**, வருமானம் மிதமானது", say: "ஆனால் டேர்ம் வழியில், மீதிப் பணத்தை உண்மையில் முதலீடு செய்யும் சுய ஒழுங்கு தேவை. செலவு செய்துவிட்டால், பலன் இல்லை. கலந்த திட்டங்களில், பொதுவாக cover குறைவு."}
    - type: takeaway
      text: "முதலில் **போதுமான பாதுகாப்பு**. பிறகு **முதலீடு**. இரண்டையும் **தனித்தனியாக** மதிப்பிடுங்கள்."
      say: "சுருக்கமாக, முதலில் குடும்பத்துக்குப் போதுமான பாதுகாப்பு. பிறகு முதலீடு. எந்தத் திட்டத்தைப் பார்த்தாலும், பாதுகாப்பையும் வருமானத்தையும் தனித்தனியாக மதிப்பிடுங்கள். பாலிசி ஆவணங்களை முழுமையாகப் படித்து, தேவைப்பட்டால் தகுதியான ஆலோசகரின் கருத்தைப் பெறுங்கள்."
