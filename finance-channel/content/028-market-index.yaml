id: "028"
category: stocks
title_ta: "சந்தைக் குறியீடு (Index) என்றால் என்ன?"
title_en: "What is a Market Index?"
thumb_ta: "'**சந்தை ஏறியது**' என்றால் என்ன அர்த்தம்?"
icon: chart
keywords: [market index tamil, Nifty 50, Sensex, சந்தைக் குறியீடு, index basics, free float market cap]
summary:
  - "சந்தைக் குறியீடு (Index) என்றால் என்ன?"
  - "Nifty 50, Sensex: எவை, எத்தனை நிறுவனங்கள்?"
  - "குறியீடு எப்படிக் கணக்கிடப்படுகிறது (எளிமையாக)"
  - "'சந்தை 1% ஏறியது' என்றால் என்ன அர்த்தம்?"

short:
  scenes:
    - type: hook
      icon: chart
      heading: "'**இன்று சந்தை ஏறியது**'\nஎன்றால் என்ன அர்த்தம்?"
      say: "செய்திகளில், இன்று சந்தை ஏறியது என்று கேட்கிறோம். ஆயிரக்கணக்கான பங்குகள் இருக்கும்போது, சந்தை ஏறியது என்றால் என்ன அர்த்தம்?"
    - type: define
      term: "சந்தைக் குறியீடு"
      term_en: "Market Index"
      text: "முக்கியமான பங்குகளின் ஒரு **கூடை**. அந்தக் கூடையின் மொத்த மதிப்பு எப்படி மாறுகிறது என்பதைக் காட்டும் **ஒரு எண்**."
      say: "சந்தைக் குறியீடு என்பது, முக்கியமான பங்குகளின் ஒரு கூடை. அந்தக் கூடையின் மொத்த மதிப்பு எப்படி மாறுகிறது என்பதை, அது ஒரே எண்ணில் காட்டுகிறது."
    - type: compare
      heading: "இந்தியாவின் **இரண்டு முக்கிய** குறியீடுகள்"
      left: {title: "Nifty 50"}
      right: {title: "Sensex"}
      rows:
        - {left: "NSE-ல்", right: "BSE-ல்", say: "Nifty ஐம்பது, NSE-ன் குறியீடு. Sensex, BSE-ன் குறியீடு."}
        - {left: "**50** பெரிய நிறுவனங்கள்", right: "**30** பெரிய நிறுவனங்கள்", say: "Nifty-ல் ஐம்பது பெரிய நிறுவனங்கள். Sensex-ல் முப்பது பெரிய நிறுவனங்கள்."}
    - type: takeaway
      text: "குறியீடு = சந்தையின் **வெப்பமானி**. அது **ஒட்டுமொத்த திசையைக்** காட்டும், ஒவ்வொரு பங்கையும் அல்ல."
      say: "குறியீடு, சந்தையின் வெப்பமானி போல. அது ஒட்டுமொத்தத் திசையைக் காட்டுகிறது. ஒவ்வொரு தனிப் பங்கின் நிலையையும் அல்ல."

long:
  intro_say: "வணக்கம்! Nifty, Sensex என்ற வார்த்தைகளைச் செய்திகளில் தினமும் கேட்கிறோம். அவை என்ன? சந்தை ஏறியது, இறங்கியது என்றால் என்ன அர்த்தம்? இன்று பார்க்கலாம்."
  scenes:
    - type: hook
      chapter: "ஒரு எண், ஆயிரம் பங்குகள்"
      icon: question
      heading: "ஆயிரக்கணக்கான பங்குகள்.\n**ஒரே எண்ணில்** சொல்வது எப்படி?"
      say:
        - "இந்தியப் பங்குச் சந்தையில், ஆயிரக்கணக்கான நிறுவனங்களின் பங்குகள் வர்த்தகமாகின்றன. ஒரே நாளில், சில ஏறும், சில இறங்கும்."
        - "அப்படியிருக்க, இன்று சந்தை எப்படி இருந்தது என்று ஒரே எண்ணில் சொல்வது எப்படி? அதற்குத்தான் குறியீடு."
    - type: define
      chapter: "Index என்றால் என்ன?"
      term: "சந்தைக் குறியீடு"
      term_en: "Market Index"
      text: "குறிப்பிட்ட விதிகளின்படி தேர்ந்தெடுக்கப்பட்ட பங்குகளின் ஒரு **கூடை**. அதன் மதிப்பு மாற்றத்தை **ஒரே எண்ணாகக்** காட்டுவது."
      say:
        - "சந்தைக் குறியீடு என்பது, குறிப்பிட்ட விதிகளின்படி தேர்ந்தெடுக்கப்பட்ட பங்குகளின் ஒரு கூடை."
        - "அந்தக் கூடையின் மொத்த மதிப்பு எப்படி மாறுகிறது என்பதை, அது ஒரே எண்ணாகக் காட்டுகிறது. தங்கத்தின் விலை போல, இதுவும் தினமும் மாறும்."
    - type: compare
      chapter: "Nifty 50 மற்றும் Sensex"
      heading: "இந்தியாவின் **இரண்டு முக்கிய** குறியீடுகள்"
      left: {title: "Nifty 50"}
      right: {title: "Sensex"}
      rows:
        - {left: "NSE-ன் குறியீடு", right: "BSE-ன் குறியீடு", say: "Nifty ஐம்பது, National Stock Exchange-ன் முக்கியக் குறியீடு. Sensex, Bombay Stock Exchange-ன் முக்கியக் குறியீடு."}
        - {left: "**50** பெரிய நிறுவனங்கள்", right: "**30** பெரிய நிறுவனங்கள்", say: "Nifty-ல், பல துறைகளைச் சேர்ந்த ஐம்பது பெரிய நிறுவனங்கள். Sensex-ல், முப்பது பெரிய நிறுவனங்கள்."}
        - {left: "அவ்வப்போது **மாற்றியமைக்கப்படும்**", right: "அவ்வப்போது **மாற்றியமைக்கப்படும்**", say: "இரண்டிலும், எந்த நிறுவனங்கள் இருக்கின்றன என்பது, விதிகளின்படி அவ்வப்போது மாற்றியமைக்கப்படுகிறது. அதனால் இன்றைய பட்டியல், பத்து வருடம் கழித்து வேறாக இருக்கலாம்."}
    - type: donut
      chapter: "எப்படிக் கணக்கிடப்படுகிறது?"
      heading: "பெரிய நிறுவனம் = **அதிக எடை**"
      center: "Index"
      say: "குறியீட்டில், எல்லா நிறுவனங்களுக்கும் ஒரே எடை இல்லை. ஒரு கற்பனை உதாரணம் பார்ப்போம்."
      slices:
        - {label: "Company A (மிகப் பெரியது)", value: 40, say: "Company A, கூடையில் மிகப் பெரிய நிறுவனம். அதனால் அதற்கு அதிக எடை."}
        - {label: "Company B", value: 25, say: "Company B, அடுத்த பெரியது."}
        - {label: "Company C", value: 20, say: "Company C."}
        - {label: "மற்றவை", value: 15, say: "மற்றவை, சிறிய எடைகள்."}
      after: "இந்தியக் குறியீடுகள், பொதுவாக free-float market capitalisation முறையில் கணக்கிடப்படுகின்றன. அதாவது, சந்தையில் வர்த்தகத்துக்குக் கிடைக்கும் பங்குகளின் மதிப்பைப் பொறுத்து எடை. அதனால், பெரிய நிறுவனங்களின் விலை மாற்றம், குறியீட்டை அதிகம் நகர்த்துகிறது."
    - type: points
      chapter: "குறியீடுகள் எதற்குப் பயன்?"
      heading: "குறியீடுகள் **எதற்குப் பயன்?**"
      marker: check
      items:
        - {text: "சந்தையின் **ஒட்டுமொத்த மனநிலையை** அறிய", say: "முதலாவது, சந்தையின் ஒட்டுமொத்த மனநிலையை அறிய."}
        - {text: "ஃபண்டுகளின் செயல்பாட்டை **ஒப்பிட** (Benchmark)", say: "இரண்டாவது, மியூச்சுவல் ஃபண்டுகள் எப்படிச் செயல்படுகின்றன என்று ஒப்பிட. இதை benchmark என்பார்கள்."}
        - {text: "**Index fund, ETF**: குறியீட்டையே பின்பற்றும் முதலீடுகள்", say: "மூன்றாவது, குறியீட்டை அப்படியே பின்பற்றும் index fund, ETF போன்ற முதலீடுகளுக்கு அடிப்படை. இவற்றைப் பற்றித் தனி வீடியோக்கள் வருகின்றன."}
    - type: points
      chapter: "நினைவில் கொள்ள வேண்டியவை"
      heading: "நினைவில் **கொள்ளுங்கள்**"
      marker: dot
      items:
        - {text: "குறியீடு ஏறினாலும், **சில பங்குகள் இறங்கலாம்**", say: "குறியீடு ஏறிய நாளிலும், பல பங்குகள் இறங்கியிருக்கலாம். குறியீடு ஒரு சராசரிப் படம் மட்டுமே."}
        - {text: "குறியீட்டின் **எண் மதிப்பு** முக்கியமல்ல, **சதவீத மாற்றம்** முக்கியம்", say: "குறியீடு நூறு புள்ளிகள் ஏறியது என்பதை விட, எத்தனை சதவீதம் ஏறியது என்பதுதான் அர்த்தமுள்ளது."}
    - type: takeaway
      text: "Index = சந்தையின் **வெப்பமானி**. Nifty 50, Sensex: **பெரிய நிறுவனங்களின் கூடைகள்**."
      say: "சுருக்கமாக, குறியீடு என்பது, சந்தையின் வெப்பமானி போல. Nifty ஐம்பதும் Sensex-ம், இந்தியாவின் பெரிய நிறுவனங்களின் கூடைகள். அவை ஒட்டுமொத்தத் திசையைக் காட்டுகின்றன."
