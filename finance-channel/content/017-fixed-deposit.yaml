id: "017"
category: savings
title_ta: "ஃபிக்ஸட் டெபாசிட் (FD) எப்படி வேலை செய்கிறது?"
title_en: "How a Fixed Deposit Works"
thumb_ta: "FD: **பாதுகாப்பு, ஆனால்...**"
icon: bank
keywords: [fixed deposit tamil, FD, ஃபிக்ஸட் டெபாசிட், FD interest, TDS on FD, premature withdrawal]
summary:
  - "FD என்றால் என்ன, எப்படி வேலை செய்கிறது?"
  - "Cumulative vs Non-cumulative FD"
  - "FD வட்டிக்கு வரி: பலர் மறக்கும் விஷயம்"
  - "முன்கூட்டியே எடுத்தால் அபராதம், டெபாசிட் காப்பீடு"

short:
  scenes:
    - type: hook
      icon: bank
      heading: "FD: இந்தியாவின்\n**மிகப் பிடித்த சேமிப்பு**"
      say: "பல இந்தியக் குடும்பங்களுக்கு, சேமிப்பு என்றாலே ஃபிக்ஸட் டெபாசிட்தான். அது எப்படி வேலை செய்கிறது?"
    - type: define
      term: "ஃபிக்ஸட் டெபாசிட்"
      term_en: "Fixed Deposit (FD)"
      text: "ஒரு தொகையை, **குறிப்பிட்ட காலத்துக்கு**, **முன்பே தெரிந்த வட்டி விகிதத்தில்** வங்கியில் வைப்பது."
      say: "ஒரு தொகையை, குறிப்பிட்ட காலத்துக்கு, முன்பே நிர்ணயிக்கப்பட்ட வட்டி விகிதத்தில் வங்கியில் வைப்பதுதான் FD."
    - type: points
      heading: "தெரிந்துகொள்ள வேண்டியவை"
      marker: dot
      items:
        - {text: "வட்டி விகிதம் **தொடக்கத்திலேயே நிர்ணயம்**", say: "FD தொடங்கும்போதே வட்டி விகிதம் நிர்ணயமாகிவிடும். சந்தை ஏற்ற இறக்கம் பாதிக்காது."}
        - {text: "FD வட்டிக்கு **வருமான வரி** உண்டு", say: "ஆனால் FD வட்டி, உங்கள் வருமானத்துடன் சேர்த்து வரிக்கு உட்பட்டது. இதைப் பலர் மறந்துவிடுகிறார்கள்."}
        - {text: "முன்கூட்டியே எடுத்தால் **அபராதம்** இருக்கலாம்", say: "காலம் முடியும் முன் எடுத்தால், பெரும்பாலும் வட்டியில் ஒரு சிறிய அபராதம் உண்டு."}
    - type: takeaway
      text: "FD = **நிலைத்தன்மை**. ஆனால் வரிக்குப் பிறகு, **பணவீக்கத்தை** மிஞ்சுகிறதா என்று பாருங்கள்."
      say: "FD நிலைத்தன்மை தருகிறது. ஆனால் வரி கழித்த பிறகு, அது பணவீக்கத்தை மிஞ்சுகிறதா என்றும் பாருங்கள்."

long:
  intro_say: "வணக்கம்! இந்தியர்களின் மிகப் பிடித்த சேமிப்பு வழி, ஃபிக்ஸட் டெபாசிட். இன்று அதன் நன்மைகள், வரம்புகள், பலர் கவனிக்காத விஷயங்கள் எல்லாவற்றையும் பார்க்கலாம்."
  scenes:
    - type: define
      chapter: "FD என்றால் என்ன?"
      term: "ஃபிக்ஸட் டெபாசிட்"
      term_en: "Fixed Deposit (FD)"
      text: "ஒரு தொகையை, **குறிப்பிட்ட காலத்துக்கு** (சில நாட்கள் முதல் பல வருடங்கள் வரை), **நிர்ணயிக்கப்பட்ட வட்டியில்** வங்கி அல்லது நிதி நிறுவனத்தில் வைப்பது."
      say:
        - "ஃபிக்ஸட் டெபாசிட் என்பது, ஒரு தொகையை ஒரு குறிப்பிட்ட காலத்துக்கு, நிர்ணயிக்கப்பட்ட வட்டி விகிதத்தில் வைப்பது."
        - "காலம், சில நாட்கள் முதல் பல வருடங்கள் வரை இருக்கலாம். தொடக்கத்திலேயே வட்டி விகிதம் நிர்ணயமாவதால், முதிர்வில் எவ்வளவு கிடைக்கும் என்று முன்பே தெரியும்."
    - type: compare
      chapter: "இரண்டு வகை FD"
      heading: "Cumulative vs Non-cumulative"
      left: {title: "Cumulative"}
      right: {title: "Non-cumulative"}
      rows:
        - {left: "வட்டி **மீண்டும் முதலீடு** (கூட்டு வட்டி)", right: "வட்டி **மாதம்/காலாண்டு** தோறும் கைக்கு", say: "Cumulative FD-ல், வட்டி மீண்டும் FD-யிலேயே சேர்ந்து, கூட்டு வட்டியாக வளரும். Non-cumulative FD-ல், வட்டி மாதம் அல்லது காலாண்டுக்கு ஒருமுறை உங்கள் கணக்குக்கு வரும்."}
        - {left: "முதிர்வில் **மொத்தமாக**", right: "**தொடர் வருமானம்**", say: "முதல் வகை, முதிர்வில் மொத்தமாகப் பணம் தேவைப்படுபவர்களுக்கு. இரண்டாவது, ஓய்வு பெற்றவர்கள் போல, தொடர் வருமானம் தேவைப்படுபவர்களுக்கு."}
    - type: steps
      chapter: "வரி: மறக்கக் கூடாத விஷயம்"
      heading: "வரிக்குப் பிறகு **உண்மையான வருமானம்**"
      say: "இப்போது, பலர் மறக்கும் ஒரு விஷயம். வரி."
      lines:
        - {text: "FD வட்டி: ஆண்டுக்கு **7%**", say: "உதாரணமாக, FD வட்டி ஆண்டுக்கு ஏழு சதவீதம்."}
        - {text: "30% வரி அடுக்கில் இருந்தால்: 7% × 0.7 = **4.9%**", say: "நீங்கள் முப்பது சதவீத வரி அடுக்கில் இருந்தால், வரிக்குப் பிறகு கையில் கிடைப்பது சுமார் நான்கு புள்ளி ஒன்பது சதவீதம்."}
        - {text: "பணவீக்கம் **6%** என்றால்: 4.9% − 6% ≈ **−1.1%**", say: "பணவீக்கம் ஆறு சதவீதம் என்றால், உண்மையான வருமானம் கிட்டத்தட்ட மைனஸ் ஒன்று சதவீதம்."}
      result: {text: "FD = பாதுகாப்பு. ஆனால் **நீண்டகால வளர்ச்சிக்கு** மட்டும் போதாமல் போகலாம்", say: "அதனால், FD பாதுகாப்பானதுதான். ஆனால் நீண்டகால இலக்குகளுக்கு, அது மட்டும் போதாமல் போகலாம். வரி விதிமுறைகள் மாறலாம், உங்கள் நிலைக்கு ஏற்ப சரிபாருங்கள்."}
    - type: points
      chapter: "TDS, 15G/15H"
      heading: "TDS பற்றி **தெரிந்துகொள்ளுங்கள்**"
      marker: dot
      items:
        - {text: "வட்டி ஒரு வரம்பைத் தாண்டினால் வங்கி **TDS பிடிக்கும்**", say: "ஒரு நிதியாண்டில் FD வட்டி ஒரு குறிப்பிட்ட வரம்பைத் தாண்டினால், வங்கி வரியின் ஒரு பகுதியை முன்கூட்டியே பிடிக்கும். இதுதான் TDS."}
        - {text: "TDS பிடித்தாலும், **உங்கள் வரி அடுக்கின்படி** வரி கணக்கிடப்படும்", say: "TDS பிடித்தாலும், இறுதி வரி உங்கள் வரி அடுக்கைப் பொறுத்தது. வருமான வரி தாக்கலின்போது இதைச் சரிசெய்ய வேண்டும்."}
        - {text: "வரி வராதவர்கள் **Form 15G / 15H** கொடுக்கலாம்", say: "மொத்த வருமானம் வரி வரம்புக்குக் கீழ் இருப்பவர்கள், விதிகளின்படி Form பதினைந்து G அல்லது மூத்த குடிமக்கள் பதினைந்து H கொடுத்து, TDS-ஐத் தவிர்க்கலாம்."}
    - type: points
      chapter: "முன்கூட்டியே எடுப்பது, பாதுகாப்பு"
      heading: "மேலும் **சில முக்கியமானவை**"
      marker: check
      items:
        - {text: "முன்கூட்டியே எடுத்தால் **வட்டியில் அபராதம்**", say: "காலம் முடியும் முன் FD-யை உடைத்தால், பெரும்பாலும் வட்டியில் ஒரு சிறிய அபராதம் உண்டு."}
        - {text: "டெபாசிட் காப்பீடு: **ஒரு வரம்பு வரை** பாதுகாப்பு", say: "வங்கி டெபாசிட்டுகளுக்கு, ஒரு வங்கியில் ஒருவருக்கு ஒரு குறிப்பிட்ட வரம்பு வரை, DICGC மூலம் காப்பீடு உண்டு. தற்போதைய வரம்பை அதன் இணையதளத்தில் சரிபாருங்கள்."}
        - {text: "**மூத்த குடிமக்களுக்கு** பெரும்பாலும் கூடுதல் வட்டி", say: "மூத்த குடிமக்களுக்கு, பல வங்கிகள் கொஞ்சம் கூடுதல் வட்டி தருகின்றன."}
        - {text: "**பல FD-களாகப் பிரிப்பது** (laddering)", say: "ஒரே பெரிய FD-க்குப் பதிலாக, வெவ்வேறு காலங்களில் முதிரும் பல சிறிய FD-களாகப் பிரித்தால், தேவைப்படும்போது ஒன்றை மட்டும் உடைக்கலாம்."}
    - type: takeaway
      text: "FD = **நிலைத்தன்மை, எளிமை**. அவசர நிதிக்கும் குறுகிய கால இலக்குகளுக்கும் ஏற்றது. **வரிக்குப் பிறகு** வருமானத்தைக் கணக்கிடுங்கள்."
      say: "சுருக்கமாக, FD நிலைத்தன்மையும் எளிமையும் தருகிறது. அவசர நிதிக்கும், குறுகிய கால இலக்குகளுக்கும் இது பொருத்தமாக இருக்கலாம். ஆனால் எப்போதும், வரிக்குப் பிறகு உண்மையான வருமானம் எவ்வளவு என்று கணக்கிடுங்கள்."
