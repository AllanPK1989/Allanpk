id: "021"
category: investing
title_ta: "பல்வகைப்படுத்தல் (Diversification)"
title_en: "Diversification"
thumb_ta: "எல்லா முட்டைகளையும் **ஒரே கூடையில்?**"
icon: layers
keywords: [diversification tamil, portfolio diversification, பல்வகைப்படுத்தல், asset allocation, investment risk]
summary:
  - "Diversification என்றால் என்ன?"
  - "ஒரு எளிய கணக்கு: ஒரு முதலீடு 50% இறங்கினால்?"
  - "மூன்று நிலைகள்: சொத்து வகை, ஒரே வகைக்குள், காலம்"
  - "Diversification செய்ய முடியாதது எது?"

short:
  scenes:
    - type: hook
      icon: layers
      heading: "எல்லா முட்டைகளையும்\n**ஒரே கூடையில்** வைக்கலாமா?"
      say: "எல்லா முட்டைகளையும் ஒரே கூடையில் வைத்தால், அந்தக் கூடை விழுந்தால் என்ன ஆகும்?"
    - type: compare
      heading: "₹1 லட்சம், ஒரு முதலீடு **50% இறங்கினால்**"
      left: {title: "ஒரே முதலீட்டில்", color: "#f87171"}
      right: {title: "10 முதலீடுகளில்", color: "#4ade80"}
      rows:
        - {left: "₹1,00,000 முழுவதும் ஒன்றில்", right: "தலா ₹10,000 × 10", say: "ஒரு லட்சம் ரூபாய். ஒருவர் முழுவதையும் ஒரே முதலீட்டில் போடுகிறார். இன்னொருவர், பத்து வெவ்வேறு முதலீடுகளில் தலா பத்தாயிரம்."}
        - {left: "நஷ்டம்: **₹50,000** (50%)", right: "நஷ்டம்: **₹5,000** (5%)", say: "அதில் ஒரு முதலீடு பாதியாக இறங்கினால், முதலாமவருக்கு ஐம்பதாயிரம் நஷ்டம். இரண்டாமவருக்கு ஐந்தாயிரம் மட்டுமே."}
    - type: takeaway
      text: "Diversification = **ஒரு தவறு உங்களை வீழ்த்தாமல்** பார்த்துக்கொள்வது."
      say: "பல்வகைப்படுத்தல் என்பது, ஒரு தவறான முடிவு உங்களை முழுமையாக வீழ்த்தாமல் பார்த்துக்கொள்வது."

long:
  intro_say: "வணக்கம்! நம் பாட்டிகள் சொன்ன ஒரு பழமொழி, முதலீட்டு உலகின் மிக முக்கியமான விதியாக இருக்கிறது. எல்லா முட்டைகளையும் ஒரே கூடையில் வைக்காதே. இன்று அதைப் பார்க்கலாம்."
  scenes:
    - type: define
      chapter: "Diversification என்றால் என்ன?"
      term: "பல்வகைப்படுத்தல்"
      term_en: "Diversification"
      text: "பணத்தை **பல வகை முதலீடுகளில் பிரித்து** வைப்பதன் மூலம், **ஒரே ஒரு இழப்பின் தாக்கத்தைக்** குறைப்பது."
      say:
        - "பல்வகைப்படுத்தல் என்றால், பணத்தை ஒரே இடத்தில் வைக்காமல், பல வகை முதலீடுகளில் பிரித்து வைப்பது."
        - "இதன் நோக்கம், ஏதாவது ஒரு முதலீடு மோசமாகப் போனால், அதன் தாக்கத்தைக் குறைப்பது."
    - type: compare
      chapter: "ஒரு எளிய கணக்கு"
      heading: "₹1 லட்சம், ஒரு முதலீடு **50% இறங்கினால்**"
      left: {title: "ஒரே முதலீட்டில்", color: "#f87171"}
      right: {title: "10 முதலீடுகளில்", color: "#4ade80"}
      say: "ஒரு எளிய கணக்கு. இது கற்பனை உதாரணம் மட்டுமே."
      rows:
        - {left: "₹1,00,000 முழுவதும் ஒன்றில்", right: "தலா ₹10,000 × 10", say: "இருவரிடம் தலா ஒரு லட்சம். முதலாமவர் முழுவதையும் ஒரே முதலீட்டில் போடுகிறார். இரண்டாமவர், பத்து வெவ்வேறு முதலீடுகளில் தலா பத்தாயிரம்."}
        - {left: "நஷ்டம்: **₹50,000**", right: "நஷ்டம்: **₹5,000**", say: "ஒரு முதலீடு பாதியாக இறங்கினால், முதலாமவர் ஐம்பதாயிரம் இழக்கிறார். இரண்டாமவர் ஐந்தாயிரம் மட்டுமே."}
        - {left: "மீள **100% வளர்ச்சி** தேவை", right: "மீள சுமார் **5% வளர்ச்சி** போதும்", say: "இன்னொரு உண்மை. ஐம்பது சதவீதம் இழந்தால், மீண்டும் பழைய நிலைக்கு வர, நூறு சதவீத வளர்ச்சி தேவை. இரண்டாமவருக்கு, சுமார் ஐந்து சதவீதம் போதும்."}
    - type: points
      chapter: "மூன்று நிலைகள்"
      heading: "பல்வகைப்படுத்தலின் **மூன்று நிலைகள்**"
      items:
        - {text: "**சொத்து வகைகளுக்கு இடையே**", sub: "பங்குகள், கடன் பத்திரங்கள், தங்கம், ரொக்கம்", say: "முதல் நிலை, சொத்து வகைகளுக்கு இடையே. பங்குகள், கடன் பத்திரங்கள், தங்கம், ரொக்கம். இவை எல்லாம் ஒரே நேரத்தில், ஒரே மாதிரி நகர்வதில்லை."}
        - {text: "**ஒரே வகைக்குள்**", sub: "பல நிறுவனங்கள், பல துறைகள்", say: "இரண்டாம் நிலை, ஒரே வகைக்குள். பங்குகள் என்றால், ஒரே நிறுவனமோ ஒரே துறையோ இல்லாமல், பல நிறுவனங்கள், பல துறைகள்."}
        - {text: "**காலத்தின் அடிப்படையில்**", sub: "ஒரே நாளில் இல்லாமல், படிப்படியாக", say: "மூன்றாம் நிலை, காலம். எல்லாப் பணத்தையும் ஒரே நாளில் போடாமல், படிப்படியாகப் போடுவது. SIP பற்றிப் பேசும்போது இதைப் பார்க்கலாம்."}
    - type: points
      chapter: "Diversification செய்ய முடியாதது"
      heading: "இதனால் **தவிர்க்க முடியாதது**"
      marker: cross
      items:
        - {text: "**முழுச் சந்தையும்** இறங்கும் அபாயம்", say: "ஒரு எச்சரிக்கை. பல்வகைப்படுத்தல், ஒரு தனி நிறுவனத்தின் அபாயத்தைக் குறைக்கும். ஆனால் முழுச் சந்தையும் ஒரே நேரத்தில் இறங்கும் அபாயத்தை முழுமையாகத் தவிர்க்க முடியாது."}
        - {text: "**நஷ்டம் வராது** என்ற உத்தரவாதம்", say: "அதனால், பல்வகைப்படுத்தல் நஷ்டமே வராது என்ற உத்தரவாதம் அல்ல. அது அபாயத்தைக் குறைக்கும் ஒரு கருவி மட்டுமே."}
    - type: points
      chapter: "அளவுக்கு மீறினால்"
      heading: "அதிகமாகப் பிரித்தாலும் **சிக்கல்**"
      marker: dot
      items:
        - {text: "**கண்காணிக்க முடியாத** அளவு முதலீடுகள்", say: "மறுபக்கம், அளவுக்கு மீறிப் பிரித்தாலும் சிக்கல். இருபது, முப்பது முதலீடுகள் என்றால், கண்காணிக்கவே முடியாது."}
        - {text: "**ஒரே மாதிரியானவை** பல இருந்தால், உண்மையான பிரிப்பு இல்லை", say: "ஒரே மாதிரியான பல முதலீடுகள் வைத்திருந்தால், அது உண்மையான பல்வகைப்படுத்தல் அல்ல. எண்ணிக்கை அல்ல, வகைதான் முக்கியம்."}
    - type: takeaway
      text: "**ஒரே கூடையில் எல்லாம் வேண்டாம்**. ஆனால் கூடைகள் **வேறு வேறு வகையாக** இருக்க வேண்டும்."
      say: "சுருக்கமாக, எல்லா முட்டைகளையும் ஒரே கூடையில் வைக்காதீர்கள். ஆனால் கூடைகளின் எண்ணிக்கையை விட, அவை வேறு வேறு வகையாக இருப்பதுதான் முக்கியம்."
