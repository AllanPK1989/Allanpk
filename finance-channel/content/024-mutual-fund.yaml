id: "024"
category: investing
title_ta: "மியூச்சுவல் ஃபண்ட் என்றால் என்ன?"
title_en: "What is a Mutual Fund?"
thumb_ta: "பலரின் பணம், **ஒரு நிபுணர் நிர்வாகம்**"
icon: users
keywords: [mutual fund tamil, மியூச்சுவல் ஃபண்ட், what is mutual fund, NAV, fund manager, SEBI]
summary:
  - "மியூச்சுவல் ஃபண்ட் எப்படி வேலை செய்கிறது?"
  - "Units, NAV, Fund manager — அடிப்படைச் சொற்கள்"
  - "உங்கள் பணத்தை யார் பாதுகாக்கிறார்கள்? SEBI, Trustee, Custodian"
  - "நன்மைகளும், அபாயங்களும்"

short:
  scenes:
    - type: hook
      icon: users
      heading: "₹500-ல் **பல நிறுவனங்களில்**\nமுதலீடு செய்ய முடியுமா?"
      say: "வெறும் ஐநூறு ரூபாயில், பல நிறுவனங்களில் ஒரே நேரத்தில் முதலீடு செய்ய முடியுமா? மியூச்சுவல் ஃபண்ட் மூலம் முடியும்."
    - type: flow
      heading: "எப்படி வேலை செய்கிறது?"
      nodes:
        - {text: "ஆயிரக்கணக்கானோர் பணம் போடுகிறார்கள்", say: "ஆயிரக்கணக்கான முதலீட்டாளர்கள் பணம் போடுகிறார்கள்."}
        - {text: "ஒரு பெரிய பொது நிதி", sub: "Fund manager நிர்வகிக்கிறார்", say: "அது ஒரு பெரிய பொது நிதியாகிறது. அதை ஒரு fund manager நிர்வகிக்கிறார்."}
        - {text: "பங்குகள், பத்திரங்களில் முதலீடு", say: "அவர், ஃபண்டின் நோக்கத்தின்படி, பங்குகள், பத்திரங்கள் போன்றவற்றில் முதலீடு செய்கிறார்."}
        - {text: "லாப நஷ்டம் **எல்லோருக்கும் பகிர்வு**", say: "லாபமும் நஷ்டமும், போட்ட பணத்தின் விகிதத்தில் எல்லோருக்கும் பகிரப்படுகிறது."}
    - type: takeaway
      text: "மியூச்சுவல் ஃபண்ட் முதலீடுகள் **சந்தை அபாயங்களுக்கு உட்பட்டவை**. திட்ட ஆவணங்களைக் கவனமாகப் படியுங்கள்."
      say: "நினைவில் வையுங்கள். மியூச்சுவல் ஃபண்ட் முதலீடுகள் சந்தை அபாயங்களுக்கு உட்பட்டவை. முதலீடு செய்யும் முன், திட்டம் தொடர்பான எல்லா ஆவணங்களையும் கவனமாகப் படியுங்கள்."

long:
  intro_say: "வணக்கம்! மியூச்சுவல் ஃபண்ட் என்ற வார்த்தையை அடிக்கடி கேட்கிறோம். ஆனால் அது உண்மையில் என்ன, எப்படி வேலை செய்கிறது? இன்று அடிப்படையிலிருந்து பார்க்கலாம்."
  scenes:
    - type: hook
      chapter: "ஒரு எளிய உதாரணம்"
      icon: users
      heading: "நண்பர்கள் சேர்ந்து\n**ஒரு பெரிய பிரியாணி அண்டா**"
      say:
        - "பத்து நண்பர்கள், ஆளுக்கு கொஞ்சம் பணம் போட்டு, ஒரு நல்ல சமையல்காரரை வைத்து, ஒரு பெரிய அண்டா பிரியாணி செய்கிறார்கள்."
        - "ஒவ்வொருவருக்கும், போட்ட பணத்துக்கு ஏற்ப பங்கு கிடைக்கிறது. மியூச்சுவல் ஃபண்டும் கிட்டத்தட்ட இப்படித்தான்."
    - type: define
      chapter: "மியூச்சுவல் ஃபண்ட் என்றால் என்ன?"
      term: "மியூச்சுவல் ஃபண்ட்"
      term_en: "Mutual Fund"
      text: "பல முதலீட்டாளர்களின் பணத்தை **ஒன்றாகச் சேர்த்து**, ஒரு **நிபுணர் (Fund manager)** பங்குகள், பத்திரங்கள் போன்றவற்றில் முதலீடு செய்யும் அமைப்பு."
      say:
        - "மியூச்சுவல் ஃபண்ட் என்பது, பல முதலீட்டாளர்களின் பணத்தை ஒன்றாகச் சேர்த்து, ஒரு நிபுணர் நிர்வகிக்கும் அமைப்பு."
        - "அந்த நிபுணரை fund manager என்பார்கள். அவர், ஃபண்டின் அறிவிக்கப்பட்ட நோக்கத்தின்படி, பங்குகள், கடன் பத்திரங்கள் போன்றவற்றில் முதலீடு செய்கிறார்."
    - type: points
      chapter: "அடிப்படைச் சொற்கள்"
      heading: "தெரிந்துகொள்ள வேண்டிய **சொற்கள்**"
      items:
        - {text: "**AMC**: ஃபண்டை நடத்தும் நிறுவனம்", sub: "Asset Management Company", say: "AMC. மியூச்சுவல் ஃபண்ட் திட்டங்களை நடத்தும் நிறுவனம்."}
        - {text: "**Units**: நீங்கள் வாங்கும் பங்கு அலகுகள்", say: "Units. நீங்கள் பணம் போடும்போது, ஃபண்டின் யூனிட்டுகள் உங்களுக்கு ஒதுக்கப்படும்."}
        - {text: "**NAV**: ஒரு யூனிட்டின் மதிப்பு", sub: "ஒவ்வொரு வணிக நாளும் கணக்கிடப்படும்", say: "NAV. ஒரு யூனிட்டின் மதிப்பு. ஃபண்ட் வைத்திருக்கும் முதலீடுகளின் மதிப்பைப் பொறுத்து, ஒவ்வொரு வணிக நாளும் மாறும். இதைப் பற்றி ஒரு தனி வீடியோ வருகிறது."}
        - {text: "**Expense ratio**: நிர்வாகக் கட்டணம்", sub: "ஆண்டுதோறும் ஃபண்டிலிருந்து எடுக்கப்படும்", say: "Expense ratio. ஃபண்டை நிர்வகிக்க, ஆண்டுதோறும் எடுக்கப்படும் கட்டணம்."}
    - type: flow
      chapter: "உங்கள் பணத்தை யார் பாதுகாக்கிறார்கள்?"
      heading: "உங்கள் பணத்தை **யார் கண்காணிக்கிறார்கள்?**"
      nodes:
        - {text: "SEBI", sub: "ஒழுங்குமுறை அமைப்பு", say: "மியூச்சுவல் ஃபண்டுகளை, பங்குச் சந்தை ஒழுங்குமுறை அமைப்பான SEBI ஒழுங்குபடுத்துகிறது."}
        - {text: "Trustees", sub: "முதலீட்டாளர் நலனைக் கண்காணிப்பவர்கள்", say: "ஒவ்வொரு ஃபண்டுக்கும் trustees இருக்கிறார்கள். அவர்கள் முதலீட்டாளர்களின் நலனைக் கண்காணிக்கிறார்கள்."}
        - {text: "Custodian", sub: "முதலீடுகளைப் பாதுகாப்பாக வைப்பவர்", say: "ஃபண்ட் வாங்கும் பங்குகளும் பத்திரங்களும், custodian என்ற தனி நிறுவனத்திடம் பாதுகாப்பாக வைக்கப்படுகின்றன. AMC அவற்றைத் தன் சொந்தச் சொத்தாகப் பயன்படுத்த முடியாது."}
      after: "இந்த அமைப்பு, மோசடி அபாயத்தைக் குறைக்கிறது. ஆனால் கவனிக்கவும், இது சந்தை நஷ்டத்திலிருந்து பாதுகாப்பு அல்ல."
    - type: compare
      chapter: "நன்மைகள், அபாயங்கள்"
      heading: "நன்மைகள் vs **அபாயங்கள்**"
      left: {title: "நன்மைகள்", color: "#4ade80"}
      right: {title: "அபாயங்கள், வரம்புகள்", color: "#f87171"}
      rows:
        - {left: "சின்னத் தொகையில் **பல்வகைப்படுத்தல்**", right: "**சந்தை அபாயம்**: மதிப்பு இறங்கலாம்", say: "நன்மை, சின்னத் தொகையிலேயே பல முதலீடுகளில் பரவலாக இருக்கலாம். அபாயம், சந்தை இறங்கினால் ஃபண்டின் மதிப்பும் இறங்கலாம்."}
        - {left: "**நிபுணர்** நிர்வாகம்", right: "**கட்டணங்கள்** வருமானத்தைக் குறைக்கும்", say: "நன்மை, நிபுணர் நிர்வாகம். வரம்பு, கட்டணங்கள் உங்கள் வருமானத்தைக் குறைக்கும்."}
        - {left: "**எளிதாக** வாங்கலாம், விற்கலாம்", right: "**வருமானத்துக்கு உத்தரவாதம் இல்லை**", say: "நன்மை, பெரும்பாலான ஃபண்டுகளை எளிதாக வாங்கலாம், விற்கலாம். ஆனால் வருமானத்துக்கு எந்த உத்தரவாதமும் இல்லை."}
    - type: takeaway
      text: "மியூச்சுவல் ஃபண்ட் = **பகிர்ந்த முதலீடு, நிபுணர் நிர்வாகம்**. முதலீடுகள் **சந்தை அபாயங்களுக்கு உட்பட்டவை**."
      say: "சுருக்கமாக, மியூச்சுவல் ஃபண்ட் என்பது, பலரின் பணத்தை ஒன்றாகச் சேர்த்து, நிபுணர் நிர்வகிக்கும் முதலீட்டு அமைப்பு. மியூச்சுவல் ஃபண்ட் முதலீடுகள் சந்தை அபாயங்களுக்கு உட்பட்டவை. திட்டம் தொடர்பான எல்லா ஆவணங்களையும் கவனமாகப் படியுங்கள். அடுத்த வீடியோவில், SIP என்றால் என்ன என்று பார்க்கலாம்."
