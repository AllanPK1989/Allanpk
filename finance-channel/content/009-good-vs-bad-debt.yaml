id: "009"
category: basics
title_ta: "நல்ல கடன் vs கெட்ட கடன்"
title_en: "Good Debt vs Bad Debt"
thumb_ta: "எல்லாக் கடனும் **கெட்டதா?**"
icon: card
keywords: [good debt vs bad debt, கடன், loan tamil, credit card debt, home loan, education loan]
summary:
  - "நல்ல கடன், கெட்ட கடன் — வித்தியாசம் என்ன?"
  - "வட்டி விகிதங்களை ஒப்பிடுவது (உதாரண விகிதங்கள்)"
  - "நல்ல கடனும் அளவுக்கு மீறினால் ஆபத்து — EMI வரம்பு"
  - "கடன் வாங்கும் முன் 3 கேள்விகள்"

short:
  scenes:
    - type: hook
      icon: card
      heading: "எல்லாக் கடனும்\n**கெட்டதா?**"
      say: "கடன் என்றாலே கெட்டது என்று பலர் நினைக்கிறார்கள். உண்மையில், எல்லாக் கடனும் ஒன்றல்ல."
    - type: compare
      heading: "இரண்டு வகை கடன்"
      left: {title: "நல்ல கடன்", color: "#4ade80"}
      right: {title: "கெட்ட கடன்", color: "#f87171"}
      rows:
        - {left: "**மதிப்பு அல்லது வருமானத்தை** உருவாக்கும்", right: "**நுகர்வுக்காக**, மதிப்பு குறையும் பொருட்களுக்கு", say: "நல்ல கடன், காலப்போக்கில் மதிப்பையோ வருமானத்தையோ உருவாக்க உதவும். கெட்ட கடன், செலவுக்காக, மதிப்பு குறையும் பொருட்களுக்காக வாங்குவது."}
        - {left: "படிப்புக் கடன், வீட்டுக் கடன்", right: "கார்டு நிலுவை, gadget-க்கான கடன்", say: "படிப்புக் கடன், வீட்டுக் கடன் போன்றவை பொதுவாக நல்ல கடன் வகை. கிரெடிட் கார்டு நிலுவை, புது gadget-க்காக வாங்கும் கடன் போன்றவை கெட்ட கடன் வகை."}
        - {left: "பொதுவாகக் **குறைந்த** வட்டி", right: "பெரும்பாலும் **மிக அதிக** வட்டி", say: "நல்ல கடனுக்கு பொதுவாக வட்டி குறைவு. கெட்ட கடனுக்கு பெரும்பாலும் வட்டி மிக அதிகம்."}
    - type: takeaway
      text: "நல்ல கடனும் **அளவுக்கு மீறினால்** சுமைதான். EMI-களை உங்கள் வருமானத்துக்குள் வையுங்கள்."
      say: "ஆனால் நினைவில் வையுங்கள், நல்ல கடனும் அளவுக்கு மீறினால் சுமைதான். மொத்த EMI-களை உங்கள் வருமானத்துக்குள் கட்டுப்பாட்டில் வையுங்கள்."

long:
  intro_say: "வணக்கம்! கடன் வாங்குவது தவறா? எப்போது கடன் உதவும், எப்போது அது வலையாக மாறும் என்று இன்று பார்க்கலாம்."
  scenes:
    - type: hook
      chapter: "கடன் என்பது ஒரு கருவி"
      icon: card
      heading: "கடன் ஒரு **கருவி**.\nபயன்படுத்தும் விதம்தான் முக்கியம்"
      say:
        - "கத்தி ஒரு கருவி. சமையலுக்கும் பயன்படும், காயத்துக்கும் காரணமாகும். கடனும் அப்படித்தான்."
        - "சரியான நோக்கத்துக்கு, சரியான அளவில் வாங்கினால், கடன் வாழ்க்கையை முன்னேற்றும். தவறாகப் பயன்படுத்தினால், பல வருடச் சுமையாகும்."
    - type: define
      chapter: "நல்ல கடன்"
      term: "நல்ல கடன்"
      term_en: "Good Debt"
      text: "காலப்போக்கில் **மதிப்பையோ, வருமானத்தையோ** உருவாக்க உதவும், **நியாயமான வட்டியுள்ள** கடன்."
      say:
        - "நல்ல கடன் என்பது, காலப்போக்கில் மதிப்பையோ வருமானத்தையோ உருவாக்க உதவும், நியாயமான வட்டியுள்ள கடன்."
        - "உதாரணமாக, வேலை வாய்ப்பையும் வருமானத்தையும் உயர்த்தும் படிப்புக் கடன். வாழ நீண்டகாலம் பயன்படும் வீட்டுக்கான கடன். வருமானம் தரும் தொழிலுக்கான கடன்."
    - type: define
      chapter: "கெட்ட கடன்"
      term: "கெட்ட கடன்"
      term_en: "Bad Debt"
      text: "**நுகர்வுக்காக**, மதிப்பு குறையும் பொருட்களுக்காக, பெரும்பாலும் **அதிக வட்டியில்** வாங்கும் கடன்."
      say:
        - "கெட்ட கடன் என்பது, நுகர்வுக்காக, மதிப்பு குறைந்துகொண்டே போகும் பொருட்களுக்காக, பெரும்பாலும் அதிக வட்டியில் வாங்கும் கடன்."
        - "சுற்றுலாவுக்காக வாங்கும் தனிநபர் கடன், புது மொபைலுக்காக வாங்கும் கடன், கட்டப்படாத கிரெடிட் கார்டு நிலுவை. இவை உதாரணங்கள்."
    - type: bars
      chapter: "வட்டி விகித ஒப்பீடு"
      heading: "வட்டியில் **பெரிய வித்தியாசம்**"
      say: "இரண்டு வகைகளுக்கும் வட்டி விகிதத்தில் பெரிய வித்தியாசம் இருக்கும். சில உதாரண விகிதங்களைப் பார்ப்போம்."
      bars:
        - {label: "வீட்டுக் கடன்", value: 9, display: "~9%", say: "வீட்டுக் கடன், உதாரணமாக ஆண்டுக்கு சுமார் ஒன்பது சதவீதம்."}
        - {label: "தனிநபர் கடன்", value: 15, display: "~15%", say: "தனிநபர் கடன், சுமார் பதினைந்து சதவீதம் அல்லது அதற்கு மேல்."}
        - {label: "கார்டு நிலுவை", value: 40, display: "~40%", color: "#f87171", say: "கிரெடிட் கார்டு நிலுவைக்கு, ஆண்டுக்கு முப்பது முதல் நாற்பது சதவீதத்துக்கும் மேல் வட்டி வரலாம்."}
      note: "உதாரண விகிதங்கள் மட்டுமே; வங்கி, காலம், உங்கள் கிரெடிட் ஸ்கோரைப் பொறுத்து மாறும்"
    - type: steps
      chapter: "நல்ல கடனும் அளவுக்குள்"
      heading: "நல்ல கடனும் **அளவுக்குள்** இருக்க வேண்டும்"
      say: "நல்ல கடன் என்பதால், எவ்வளவு வேண்டுமானாலும் வாங்கலாம் என்று அர்த்தம் இல்லை."
      lines:
        - {text: "கையில் வரும் சம்பளம்: **₹60,000**", say: "உதாரணமாக, கையில் வரும் சம்பளம் அறுபதாயிரம்."}
        - {text: "மொத்த EMI வரம்பு (சுமார் 30-40%): **₹18,000 – ₹24,000**", say: "பொதுவான ஒரு வழிகாட்டி, எல்லா EMI-களும் சேர்த்து, கையில் வரும் சம்பளத்தில் முப்பது முதல் நாற்பது சதவீதத்துக்குள் இருப்பது நல்லது. அதாவது பதினெட்டாயிரம் முதல் இருபத்து நான்காயிரம்."}
      result: {text: "EMI அதிகமானால் **சேமிப்பும், நிம்மதியும்** குறையும்", say: "EMI இதைவிட அதிகமானால், சேமிப்பும், அவசர காலத்தைச் சமாளிக்கும் திறனும், மன நிம்மதியும் குறையும்."}
    - type: points
      chapter: "கடன் வாங்கும் முன் 3 கேள்விகள்"
      heading: "கடன் வாங்கும் முன் **3 கேள்விகள்**"
      items:
        - {text: "இது **மதிப்பை அல்லது வருமானத்தை** உருவாக்குமா?", say: "முதல் கேள்வி, இந்தக் கடன் மதிப்பையோ வருமானத்தையோ உருவாக்குமா, அல்லது வெறும் நுகர்வுக்கா?"}
        - {text: "**மொத்த வட்டி** எவ்வளவு?", say: "இரண்டாவது, EMI மட்டும் பார்க்காமல், கடன் காலம் முழுவதும் கட்டும் மொத்த வட்டி எவ்வளவு என்று பாருங்கள்."}
        - {text: "வருமானம் நின்றாலும் **EMI கட்ட முடியுமா?**", say: "மூன்றாவது, சில மாதம் வருமானம் நின்றாலும், EMI கட்ட முடியுமா? அதற்குத்தான் அவசர கால நிதி தேவை."}
    - type: takeaway
      text: "கடன் ஒரு கருவி. **அதிக வட்டிக் கெட்ட கடனை முதலில் அடையுங்கள்**; நல்ல கடனையும் அளவோடு வையுங்கள்."
      say: "சுருக்கமாக, கடன் ஒரு கருவி. அதிக வட்டியுள்ள கெட்ட கடன் இருந்தால், அதை முதலில் அடைப்பதற்கு முன்னுரிமை கொடுங்கள். நல்ல கடனையும், உங்கள் வருமானத்துக்கு ஏற்ற அளவில் மட்டுமே வையுங்கள்."
