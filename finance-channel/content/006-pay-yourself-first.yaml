id: "006"
category: savings
title_ta: "முதலில் உங்களுக்கே சம்பளம்"
title_en: "Pay Yourself First"
thumb_ta: "முதல் பில் **உங்களுக்கே!**"
icon: piggy
keywords: [pay yourself first, saving habit, automate savings, சேமிப்பு பழக்கம், savings tamil]
summary:
  - "Pay Yourself First என்றால் என்ன?"
  - "'மீதி இருந்தால் சேமிப்பு' ஏன் வேலை செய்வதில்லை"
  - "சேமிப்பைத் தானியங்கியாக (automatic) ஆக்குவது எப்படி"
  - "சிறியதாகத் தொடங்கி, ஆண்டுதோறும் உயர்த்துவது"

short:
  scenes:
    - type: hook
      icon: piggy
      heading: "சம்பளம் வந்ததும்,\n**முதல் பில் யாருக்கு?**"
      say: "சம்பளம் வந்தவுடன், முதலில் யாருக்குப் பணம் போகிறது? வீட்டு உரிமையாளருக்கா, கடைக்கா? முதல் பில், உங்களுக்கே இருக்க வேண்டும்."
    - type: compare
      heading: "இரண்டு வழிகள்"
      left: {title: "வழக்கமான வழி", color: "#f87171"}
      right: {title: "Pay Yourself First", color: "#4ade80"}
      rows:
        - {left: "வருமானம் − செலவு = **சேமிப்பு**", right: "வருமானம் − சேமிப்பு = **செலவு**", say: "பெரும்பாலானோர், செலவு செய்து மீதி இருந்தால் சேமிக்கிறார்கள். Pay Yourself First முறையில், முதலில் சேமிப்பை எடுத்துவிட்டு, மீதியில் செலவு செய்கிறோம்."}
        - {left: "மாத இறுதியில் பெரும்பாலும் **₹0**", right: "சேமிப்பு **உறுதி**", say: "முதல் வழியில், மாத இறுதியில் பெரும்பாலும் எதுவும் மிஞ்சாது. இரண்டாவது வழியில், சேமிப்பு உறுதி."}
    - type: flow
      heading: "தானியங்கியாக்குங்கள்"
      nodes:
        - {text: "சம்பளம் வருகிறது", sub: "1-ஆம் தேதி", say: "சம்பளம் வரும் தேதியைக் கவனியுங்கள்."}
        - {text: "சேமிப்பு தானாகப் பிரிகிறது", sub: "2-ஆம் தேதி", say: "அடுத்த நாளே, ஒரு தொகை தானாக சேமிப்புக்குச் செல்லுமாறு ஏற்பாடு செய்யுங்கள்."}
        - {text: "மீதியில் செலவு", say: "மீதியை மட்டும் செலவுக்குப் பயன்படுத்துங்கள்."}
    - type: takeaway
      text: "சேமிப்பை **மன உறுதியை** நம்பி விடாதீர்கள். அதைத் **தானியங்கியாக்குங்கள்**."
      say: "சேமிப்பை மன உறுதியை நம்பி விடாதீர்கள். அதைத் தானியங்கியாக்குங்கள். அப்போதுதான் அது தொடர்ந்து நடக்கும்."

long:
  intro_say: "வணக்கம்! பணக்காரர்களுக்கும் மற்றவர்களுக்கும் உள்ள ஒரு முக்கியப் பழக்க வித்தியாசத்தைப் பற்றி இன்று பார்க்கலாம். முதலில் உங்களுக்கே சம்பளம் கொடுங்கள், அதாவது Pay Yourself First."
  scenes:
    - type: hook
      chapter: "மீதி ஏன் மிஞ்சுவதில்லை?"
      icon: wallet
      heading: "'மீதி இருந்தால் சேமிப்போம்'\n**மீதி இருக்கிறதா?**"
      say:
        - "பெரும்பாலானோர் நினைப்பது: இந்த மாதச் செலவு முடிந்து, மீதி இருந்தால் சேமிக்கலாம்."
        - "ஆனால் அனுபவத்தில் பார்த்தால், மீதி என்று எதுவும் மிஞ்சுவதே இல்லை. ஏன் தெரியுமா?"
    - type: define
      chapter: "ஏன் இப்படி நடக்கிறது?"
      label: "ஒரு உண்மை"
      term: "செலவு, வருமானத்தை நிரப்பும்"
      term_en: "Parkinson's Law (applied to money)"
      text: "கையில் இருக்கும் பணம் முழுவதும் **ஏதாவது ஒரு செலவாக** மாறிவிடும் போக்கு நமக்கு உண்டு."
      say:
        - "ஒரு வேலைக்கு எவ்வளவு நேரம் கொடுத்தாலும், அந்த நேரம் முழுவதையும் அது எடுத்துக்கொள்ளும் என்று ஒரு கருத்து உண்டு."
        - "பணமும் அப்படித்தான். கையில் இருக்கும் பணம் முழுவதும், ஏதாவது ஒரு செலவாக மாறிவிடும் போக்கு நமக்கு உண்டு."
    - type: compare
      chapter: "Pay Yourself First"
      heading: "சூத்திரத்தை **மாற்றுங்கள்**"
      left: {title: "வழக்கமான வழி", color: "#f87171"}
      right: {title: "Pay Yourself First", color: "#4ade80"}
      rows:
        - {left: "வருமானம் − செலவு = **சேமிப்பு**", right: "வருமானம் − சேமிப்பு = **செலவு**", say: "தீர்வு எளிது. சூத்திரத்தையே மாற்றுங்கள். முதலில் சேமிப்பை எடுத்துவிட்டு, மீதியில் செலவு செய்யுங்கள்."}
        - {left: "சேமிப்பு = மீதி", right: "சேமிப்பு = **முதல் செலவு**", say: "சேமிப்பை மீதியாகப் பார்க்காமல், வாடகை போல ஒரு கட்டாயச் செலவாகப் பாருங்கள். அதுவும் உங்களுக்கே நீங்கள் கொடுக்கும் செலவு."}
        - {left: "மன உறுதியை நம்பியது", right: "**தானியங்கி**", say: "முக்கியமாக, இது மன உறுதியை நம்பி இருக்கக் கூடாது. தானியங்கியாக நடக்க வேண்டும்."}
    - type: flow
      chapter: "தானியங்கியாக்குவது எப்படி?"
      heading: "சேமிப்பைத் **தானியங்கியாக்குங்கள்**"
      nodes:
        - {text: "சம்பளம் வருகிறது", sub: "உதாரணம்: 1-ஆம் தேதி", say: "முதலில், உங்கள் சம்பளம் வரும் தேதியைக் குறித்துக்கொள்ளுங்கள்."}
        - {text: "தானியங்கிப் பரிமாற்றம்", sub: "2 அல்லது 3-ஆம் தேதி", say: "அதற்கு அடுத்த ஓரிரு நாட்களில், ஒரு குறிப்பிட்ட தொகை தானாகச் செல்லுமாறு வங்கியில் standing instruction அல்லது auto-debit வையுங்கள்."}
        - {text: "சேமிப்பு / முதலீட்டுக் கணக்கு", sub: "தனிக் கணக்கு", say: "அந்தப் பணம், செலவுக் கணக்கில் இல்லாமல், தனியான ஒரு சேமிப்பு அல்லது முதலீட்டுக் கணக்குக்குச் செல்லட்டும்."}
        - {text: "மீதி = செலவுப் பணம்", say: "மீதி இருப்பதுதான் இந்த மாதச் செலவுப் பணம். கண்ணில் படாத பணத்தைச் செலவு செய்வது கடினம்."}
    - type: bars
      chapter: "சிறியதாகத் தொடங்குங்கள்"
      heading: "சிறிதாகத் தொடங்கி, **ஆண்டுதோறும் உயர்த்துங்கள்**"
      say: "எவ்வளவு சேமிப்பது? பெரிய தொகையில் தொடங்க வேண்டியதில்லை. ஒரு உதாரணம் பார்ப்போம்."
      bars:
        - {label: "1-ஆம் ஆண்டு", value: 5, display: "5%", say: "முதல் வருடம், சம்பளத்தில் ஐந்து சதவீதம்."}
        - {label: "2-ஆம் ஆண்டு", value: 10, display: "10%", say: "சம்பள உயர்வு வந்ததும், அடுத்த வருடம் பத்து சதவீதம்."}
        - {label: "3-ஆம் ஆண்டு", value: 15, display: "15%", say: "அதற்கு அடுத்த வருடம் பதினைந்து சதவீதம்."}
        - {label: "4-ஆம் ஆண்டு", value: 20, display: "20%", say: "நான்காவது வருடம், இருபது சதவீதம். சம்பள உயர்வின் ஒரு பகுதியை மட்டும் சேமிப்புக்கு மாற்றுவதால், வாழ்க்கைத் தரம் குறைந்ததாகவே தெரியாது."}
      note: "உதாரணம் மட்டுமே. உங்கள் வருமானத்துக்கு ஏற்ப மாற்றிக்கொள்ளுங்கள்."
    - type: points
      chapter: "முதல் சம்பளம் எங்கே போக வேண்டும்?"
      heading: "சேமிப்புப் பணம் **எந்த வரிசையில்?**"
      say: "சேமிக்கும் பணத்தை எங்கே வைப்பது என்பதற்கும் ஒரு பொதுவான வரிசை உண்டு."
      items:
        - {text: "**அவசர கால நிதி** முதலில்", say: "முதலில், அவசர கால நிதி. அதை முந்தைய வீடியோவில் விரிவாகப் பார்த்தோம்."}
        - {text: "**காப்பீடு**: உங்களையும் குடும்பத்தையும் பாதுகாக்க", say: "அடுத்து, தேவையான காப்பீடுகள். அதைப் பற்றி வரும் வீடியோக்களில் பார்க்கலாம்."}
        - {text: "**நீண்டகால இலக்குகளுக்கான** முதலீடு", say: "பிறகு, நீண்டகால இலக்குகளுக்கான முதலீடு."}
    - type: takeaway
      text: "முதல் பில் **உங்களுக்கே**. சேமிப்பைத் **தானியங்கியாக்குங்கள்**, மீதியில் வாழுங்கள்."
      say: "சுருக்கமாக, ஒவ்வொரு மாதமும் முதல் பில் உங்களுக்கே. சேமிப்பைத் தானியங்கியாக்குங்கள், மீதியில் வாழப் பழகுங்கள். இந்த ஒரு பழக்கம், பல வருடங்களில் பெரிய வித்தியாசத்தை உருவாக்கும்."
