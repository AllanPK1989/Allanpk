id: "004"
category: savings
title_ta: "50-30-20 பட்ஜெட் விதி"
title_en: "The 50-30-20 Budget Rule"
thumb_ta: "சம்பளத்தை **50-30-20** என்று பிரியுங்கள்"
icon: pie
keywords: [50 30 20 rule, budget rule tamil, budgeting, salary planning tamil, பட்ஜெட்]
summary:
  - "50-30-20 விதி என்றால் என்ன?"
  - "₹50,000 சம்பளத்தில் ஒரு உதாரணக் கணக்கு"
  - "இந்திய நகரங்களில் இதை எப்படி மாற்றிக்கொள்வது"
  - "'சேமிப்பு' பகுதியில் என்ன வரும்?"

short:
  scenes:
    - type: hook
      icon: wallet
      heading: "சம்பளம் வந்தது.\n**எப்படிப் பிரிப்பது?**"
      say: "சம்பளம் வந்தவுடன், அதை எப்படிப் பிரித்துச் செலவு செய்வது? இதற்கு ஒரு எளிய விதி இருக்கிறது. ஐம்பது, முப்பது, இருபது."
    - type: donut
      heading: "₹50,000 சம்பளம் என்றால்"
      center: "₹50,000"
      slices:
        - {label: "தேவைகள்", value: 50, display: "₹25,000", say: "ஐம்பது சதவீதம், அதாவது இருபத்தைந்தாயிரம், தேவைகளுக்கு. வாடகை, உணவு, பில்கள், EMI."}
        - {label: "விருப்பங்கள்", value: 30, display: "₹15,000", say: "முப்பது சதவீதம், பதினைந்தாயிரம், விருப்பங்களுக்கு. வெளியே சாப்பிடுவது, ஷாப்பிங், பொழுதுபோக்கு."}
        - {label: "சேமிப்பு & முதலீடு", value: 20, display: "₹10,000", say: "இருபது சதவீதம், பத்தாயிரம், சேமிப்புக்கும் முதலீட்டுக்கும்."}
    - type: takeaway
      text: "இது ஒரு **தொடக்கப் புள்ளி**. வாடகை அதிகம் என்றால் விகிதத்தை மாற்றலாம். ஆனால் **சேமிப்பை விடாதீர்கள்**."
      say: "இது ஒரு தொடக்கப் புள்ளி மட்டுமே. உங்கள் நிலைக்கு ஏற்ப விகிதத்தை மாற்றலாம். ஆனால் சேமிப்புப் பகுதியை மட்டும் விட்டுவிடாதீர்கள்."

long:
  intro_say: "வணக்கம்! கடந்த வீடியோவில் தேவைகளையும் விருப்பங்களையும் பிரித்துப் பார்த்தோம். இன்று அதை வைத்து, சம்பளத்தைப் பிரிக்க ஒரு எளிய விதியைப் பார்க்கலாம்."
  scenes:
    - type: hook
      chapter: "ஏன் ஒரு விதி?"
      icon: pie
      heading: "பட்ஜெட் என்றாலே **கஷ்டமா?**"
      sub: "ஒரே ஒரு எளிய விதி போதும்"
      say:
        - "பட்ஜெட் என்றதும், ஒவ்வொரு ரூபாயையும் கணக்கு எழுத வேண்டும் என்று பலர் பயப்படுவார்கள்."
        - "ஆனால் ஆரம்பிக்க, மூன்று பெட்டிகள் மட்டும் போதும். அதுதான் ஐம்பது, முப்பது, இருபது விதி."
    - type: donut
      chapter: "50-30-20 என்றால் என்ன?"
      heading: "சம்பளத்தை **மூன்றாகப்** பிரியுங்கள்"
      center: "100%"
      say: "கையில் வரும் சம்பளத்தை, அதாவது வரி போன்றவை பிடித்தது போக வரும் தொகையை, மூன்று பகுதிகளாகப் பிரிக்கிறோம்."
      slices:
        - {label: "தேவைகள் (Needs)", value: 50, say: "ஐம்பது சதவீதம் தேவைகளுக்கு."}
        - {label: "விருப்பங்கள் (Wants)", value: 30, say: "முப்பது சதவீதம் விருப்பங்களுக்கு."}
        - {label: "சேமிப்பு & முதலீடு", value: 20, say: "இருபது சதவீதம் சேமிப்புக்கும் முதலீட்டுக்கும்."}
      after: "இந்த விதி, ஒரு அமெரிக்கப் புத்தகத்தின் மூலம் பிரபலமானது. ஆனால் இதன் அடிப்படைக் கருத்து எல்லா நாட்டுக்கும் பொருந்தும்."
    - type: steps
      chapter: "₹50,000 உதாரணம்"
      heading: "₹50,000 கையில் வரும் சம்பளம்"
      say: "ஒரு உதாரணம் பார்ப்போம். மாதம் ஐம்பதாயிரம் ரூபாய் கையில் வருகிறது என்று வைத்துக்கொள்வோம்."
      lines:
        - {text: "தேவைகள் 50%: **₹25,000**", say: "தேவைகளுக்கு இருபத்தைந்தாயிரம். வாடகை, மளிகை, மின்சாரம், போக்குவரத்து, ஏதாவது கடன் EMI இருந்தால் அதுவும் இதில் வரும்."}
        - {text: "விருப்பங்கள் 30%: **₹15,000**", say: "விருப்பங்களுக்கு பதினைந்தாயிரம். வெளியே சாப்பிடுவது, சினிமா, ஷாப்பிங், பயணம்."}
        - {text: "சேமிப்பு & முதலீடு 20%: **₹10,000**", say: "சேமிப்புக்கும் முதலீட்டுக்கும் பத்தாயிரம்."}
      result: {text: "ஆண்டுக்கு ₹1,20,000 சேமிப்பு!", say: "மாதம் பத்தாயிரம் என்றால், ஒரு வருடத்தில் ஒரு லட்சத்து இருபதாயிரம் ரூபாய் சேமிப்பு."}
    - type: points
      chapter: "சேமிப்பில் என்ன வரும்?"
      heading: "'20%' பகுதியில் **என்ன வரும்?**"
      marker: check
      items:
        - {text: "**அவசர கால நிதி** (Emergency Fund)", say: "இருபது சதவீதப் பகுதியில், முதலில் வர வேண்டியது அவசர கால நிதி. அதைப் பற்றி அடுத்த வீடியோவில் விரிவாகப் பார்க்கலாம்."}
        - {text: "நீண்டகால **இலக்குகளுக்கான முதலீடு**", say: "அடுத்து, ஓய்வுக்காலம், குழந்தைகளின் படிப்பு போன்ற நீண்டகால இலக்குகளுக்கான முதலீடு."}
        - {text: "அதிக வட்டிக் கடனை **சீக்கிரம் அடைப்பது**", say: "அதிக வட்டி உள்ள கடன் இருந்தால், EMI-க்கு மேல் கூடுதலாகக் கட்டி சீக்கிரம் அடைப்பதும் இந்தப் பகுதியில் வரும்."}
    - type: compare
      chapter: "இந்திய நிலைக்கு ஏற்ப மாற்றுவது"
      heading: "உங்கள் நிலைக்கு ஏற்ப **மாற்றலாம்**"
      left: {title: "நிலைமை"}
      right: {title: "ஒரு உதாரண மாற்றம்"}
      say: "இந்தியப் பெருநகரங்களில் வாடகை அதிகம். அதனால் ஐம்பது சதவீதத்தில் தேவைகளை முடிப்பது சிலருக்குக் கஷ்டம்."
      rows:
        - {left: "நகரத்தில் அதிக வாடகை", right: "60 - 20 - 20", say: "அப்படியென்றால், தேவைகளுக்கு அறுபது, விருப்பங்களுக்கு இருபது, சேமிப்புக்கு இருபது என்று மாற்றிக்கொள்ளலாம்."}
        - {left: "பெற்றோருடன் வசிப்பவர்", right: "40 - 30 - 30", say: "பெற்றோருடன் வசிக்கும் இளைஞர் என்றால், தேவைச் செலவு குறைவு. அப்போது சேமிப்பை முப்பது சதவீதமாக உயர்த்தலாம்."}
      after: "எண்கள் மாறலாம். ஆனால் விருப்பங்களைக் குறைத்து, சேமிப்பைக் காப்பதுதான் முக்கியம்."
    - type: points
      chapter: "நடைமுறையில் பின்பற்றுவது எப்படி?"
      heading: "நடைமுறையில் **எளிதாக்க**"
      items:
        - {text: "சம்பளம் வந்தவுடன் **20% தனிக் கணக்குக்கு**", say: "சம்பளம் வந்த அன்றே, இருபது சதவீதத்தைத் தனி ஒரு கணக்குக்கு மாற்றிவிடுங்கள். மீதியை மட்டும் செலவுக்கு வைத்துக்கொள்ளுங்கள்."}
        - {text: "விருப்பச் செலவுக்கு **தனி வரம்பு**", say: "விருப்பச் செலவுக்கு ஒரு மாத வரம்பு வையுங்கள். அந்த வரம்பு முடிந்தால், அடுத்த மாதம் வரை காத்திருங்கள்."}
        - {text: "மூன்று மாதத்துக்கு ஒருமுறை **சரிபாருங்கள்**", say: "மூன்று மாதத்துக்கு ஒருமுறை, உண்மையில் எப்படிச் செலவாகிறது என்று சரிபார்த்து, தேவைப்பட்டால் மாற்றுங்கள்."}
    - type: takeaway
      text: "50-30-20 என்பது **கடுமையான சட்டம் அல்ல**, ஒரு வழிகாட்டி. எந்த விகிதமானாலும், **சேமிப்பு முதலில்**."
      say: "சுருக்கமாக, ஐம்பது முப்பது இருபது என்பது கடுமையான சட்டம் அல்ல, ஒரு வழிகாட்டி. எந்த விகிதத்தைத் தேர்ந்தெடுத்தாலும், சேமிப்புப் பகுதியை முதலில் ஒதுக்குவதுதான் வெற்றியின் ரகசியம்."
