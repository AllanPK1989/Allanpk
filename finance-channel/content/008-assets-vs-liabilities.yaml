id: "008"
category: basics
title_ta: "சொத்து vs பொறுப்பு"
title_en: "Assets vs Liabilities"
thumb_ta: "உங்கள் கார்: **சொத்தா? கடனா?**"
icon: scale
keywords: [assets vs liabilities, சொத்து, பொறுப்பு, personal finance basics tamil, net worth]
summary:
  - "சொத்து (Asset) என்றால் என்ன, பொறுப்பு (Liability) என்றால் என்ன?"
  - "பணப்புழக்கப் பார்வை: உங்கள் பையில் பணம் போடுவது எது, எடுப்பது எது?"
  - "கார், வீடு, தங்கம் — எந்த வகை?"
  - "சொத்துகளை வளர்த்து, அதிக வட்டிப் பொறுப்புகளைக் குறைப்பது"

short:
  scenes:
    - type: hook
      icon: question
      heading: "புது கார்:\n**சொத்தா? கடனா?**"
      say: "கடனில் வாங்கிய புது கார். அது உங்கள் சொத்தா, இல்லை உங்கள் பொறுப்பா?"
    - type: compare
      heading: "எளிய வித்தியாசம்"
      left: {title: "சொத்து (Asset)", color: "#4ade80"}
      right: {title: "பொறுப்பு (Liability)", color: "#f87171"}
      rows:
        - {left: "உங்களுக்கு **சொந்தமானது**, மதிப்பு உள்ளது", right: "நீங்கள் **திருப்பித் தர வேண்டியது**", say: "சொத்து என்பது உங்களுக்குச் சொந்தமான, மதிப்புள்ள ஒன்று. பொறுப்பு என்பது நீங்கள் திருப்பித் தர வேண்டிய கடன்."}
        - {left: "சேமிப்பு, முதலீடுகள்", right: "கடன்கள், கார்டு நிலுவை", say: "சேமிப்பும் முதலீடுகளும் சொத்துகள். கடன்களும், கிரெடிட் கார்டு நிலுவையும் பொறுப்புகள்."}
    - type: points
      heading: "அப்படியென்றால் **கார்?**"
      marker: dot
      items:
        - {text: "கார் ஒரு சொத்துதான், ஆனால் **மதிப்பு ஆண்டுதோறும் குறையும்**", say: "கார் ஒரு சொத்துதான். ஆனால் அதன் மதிப்பு ஒவ்வொரு ஆண்டும் குறையும். பெட்ரோல், பராமரிப்பு என்று பணத்தையும் எடுக்கும்."}
        - {text: "கார் கடன் ஒரு **பொறுப்பு**", say: "அதை வாங்க எடுத்த கடன், ஒரு பொறுப்பு."}
    - type: takeaway
      text: "**மதிப்பு வளரும்** சொத்துகளைக் கூட்டுங்கள். **அதிக வட்டிப்** பொறுப்புகளைக் குறையுங்கள்."
      say: "அதனால், மதிப்பு வளரும் அல்லது வருமானம் தரும் சொத்துகளைக் கூட்டுங்கள். அதிக வட்டி உள்ள பொறுப்புகளைக் குறையுங்கள்."

long:
  intro_say: "வணக்கம்! நிதி உலகின் அடிப்படை மொழி இது. சொத்து, பொறுப்பு. இந்த இரண்டு வார்த்தைகள் புரிந்தால், உங்கள் நிதி நிலையை நீங்களே மதிப்பிடலாம்."
  scenes:
    - type: hook
      chapter: "ஒரு கேள்வி"
      icon: question
      heading: "₹10 லட்சம் கார், ₹8 லட்சம் கடன்.\n**உங்கள் சொத்து எவ்வளவு?**"
      say:
        - "பத்து லட்சம் ரூபாய் கார் வாங்குகிறீர்கள். அதில் எட்டு லட்சம் கடன்."
        - "அப்போது உங்கள் சொத்து பத்து லட்சமா? இதற்குப் பதில் சொல்ல, இரண்டு வார்த்தைகளைப் புரிந்துகொள்ள வேண்டும்."
    - type: define
      chapter: "சொத்து என்றால் என்ன?"
      term: "சொத்து"
      term_en: "Asset"
      text: "உங்களுக்குச் **சொந்தமான**, **பண மதிப்புள்ள** எதுவும். பணம், சேமிப்பு, முதலீடுகள், நிலம், வீடு, தங்கம், வாகனம்."
      say:
        - "சொத்து என்பது, உங்களுக்குச் சொந்தமான, பண மதிப்புள்ள எதுவும்."
        - "வங்கியில் உள்ள பணம், முதலீடுகள், நிலம், வீடு, தங்கம், வாகனம். இவை எல்லாம் சொத்துகள்."
    - type: define
      chapter: "பொறுப்பு என்றால் என்ன?"
      term: "பொறுப்பு"
      term_en: "Liability"
      text: "நீங்கள் மற்றவர்களுக்குத் **திருப்பித் தர வேண்டிய** தொகை. கடன்கள், கிரெடிட் கார்டு நிலுவை, கைமாற்று."
      say:
        - "பொறுப்பு என்பது, நீங்கள் மற்றவர்களுக்குத் திருப்பித் தர வேண்டிய தொகை."
        - "வீட்டுக் கடன், கார் கடன், தனிநபர் கடன், கிரெடிட் கார்டு நிலுவை, நண்பர்களிடம் வாங்கிய கைமாற்று. இவை பொறுப்புகள்."
    - type: steps
      chapter: "கார் உதாரணம்"
      heading: "கார் உதாரணம் (கற்பனை எண்கள்)"
      say: "இப்போது கார் கேள்விக்குத் திரும்புவோம்."
      lines:
        - {text: "சொத்து: கார் மதிப்பு **₹10,00,000**", say: "காரின் மதிப்பு பத்து லட்சம். அது உங்கள் சொத்து."}
        - {text: "பொறுப்பு: கார் கடன் **₹8,00,000**", say: "ஆனால் எட்டு லட்சம் கடன் இருக்கிறது. அது உங்கள் பொறுப்பு."}
        - {text: "நிகர மதிப்பு: ₹10L − ₹8L = **₹2,00,000**", say: "அதனால் இந்தக் காரில் உங்களுடைய உண்மையான பங்கு, இரண்டு லட்சம் மட்டுமே."}
      result: {text: "ஒரு வருடத்தில் கார் மதிப்பு குறையும், கடன் **மெதுவாகத்தான்** குறையும்", say: "கவனியுங்கள், ஒரு வருடத்திலேயே காரின் மறுவிற்பனை மதிப்பு கணிசமாகக் குறையும். ஆனால் கடன் மெதுவாகத்தான் குறையும்."}
    - type: compare
      chapter: "பணப்புழக்கப் பார்வை"
      heading: "இன்னொரு பார்வை: **பணம் எந்தப் பக்கம்?**"
      left: {title: "பையில் பணம் போடுபவை", color: "#4ade80"}
      right: {title: "பையிலிருந்து எடுப்பவை", color: "#f87171"}
      say: "சொத்துகளைப் பார்க்க இன்னொரு பயனுள்ள வழி உண்டு. அது உங்கள் பையில் பணம் போடுகிறதா, அல்லது எடுக்கிறதா?"
      rows:
        - {left: "வட்டி தரும் டெபாசிட்", right: "கிரெடிட் கார்டு வட்டி", say: "வட்டி தரும் டெபாசிட், உங்கள் பையில் பணம் போடுகிறது. கிரெடிட் கார்டு வட்டி, பணத்தை எடுக்கிறது."}
        - {left: "வாடகை தரும் வீடு", right: "வசிக்கும் வீட்டின் EMI", say: "வாடகை வருமானம் தரும் வீடு, பணம் கொண்டு வருகிறது. நீங்கள் வசிக்கும் வீடு மதிப்புள்ள சொத்துதான், ஆனால் அதன் EMI ஒவ்வொரு மாதமும் பணத்தை எடுக்கிறது."}
        - {left: "வளரக்கூடிய முதலீடுகள்", right: "கார் பராமரிப்பு, எரிபொருள்", say: "காலப்போக்கில் வளரக்கூடிய முதலீடுகள் ஒரு பக்கம். கார் பராமரிப்பு, எரிபொருள் போன்ற தொடர் செலவுகள் இன்னொரு பக்கம்."}
    - type: points
      chapter: "தங்கம், வீடு, கார்"
      heading: "பொதுவான பொருட்கள், **எந்த வகை?**"
      marker: dot
      items:
        - {text: "**தங்கம்**: சொத்து; ஆனால் நகையில் செய்கூலி, சேதாரம்", say: "தங்கம் ஒரு சொத்து. ஆனால் நகையாக வாங்கும்போது, செய்கூலி, சேதாரம் திரும்பக் கிடைக்காது."}
        - {text: "**சொந்த வீடு**: மதிப்புள்ள சொத்து + பெரிய கடன் பொறுப்பு", say: "சொந்த வீடு ஒரு மதிப்புள்ள சொத்து. ஆனால் அதற்கான வீட்டுக் கடன், பல வருடப் பொறுப்பு."}
        - {text: "**வாகனம்**: மதிப்பு குறையும் சொத்து (Depreciating asset)", say: "வாகனம், மதிப்பு குறைந்துகொண்டே போகும் சொத்து. இதை depreciating asset என்பார்கள்."}
    - type: takeaway
      text: "**சொத்து − பொறுப்பு = நிகர மதிப்பு.** வளரும் சொத்துகளைக் கூட்டுங்கள், அதிக வட்டிப் பொறுப்புகளைக் குறையுங்கள்."
      say: "சுருக்கமாக, சொத்துகளில் இருந்து பொறுப்புகளைக் கழித்தால் கிடைப்பது உங்கள் நிகர மதிப்பு. மதிப்பு வளரும், வருமானம் தரும் சொத்துகளைக் கூட்டுங்கள். அதிக வட்டி உள்ள பொறுப்புகளைக் குறையுங்கள். நிகர மதிப்பைக் கணக்கிடுவது எப்படி என்று, ஒரு தனி வீடியோவில் பார்க்கலாம்."
