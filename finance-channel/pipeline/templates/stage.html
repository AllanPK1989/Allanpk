<!doctype html>
<html lang="ta">
<head>
<meta charset="utf-8">
<title>stage</title>
<style>
@font-face { font-family: "Catamaran"; src: url("../../assets/fonts/Catamaran.ttf"); font-weight: 100 900; }
@font-face { font-family: "Noto Sans Tamil"; src: url("../../assets/fonts/NotoSansTamil.ttf"); font-weight: 100 900; }
@font-face { font-family: "Inter"; src: url("../../assets/fonts/Inter.ttf"); font-weight: 100 900; }

:root {
  --accent: #4FC3F7;
  --accent-soft: rgba(79,195,247,.16);
  --bg0: #070d1d;
  --bg1: #0d1730;
  --ink: #f4f7ff;
  --muted: #9fb0d4;
  --card: rgba(255,255,255,.055);
  --line: rgba(255,255,255,.13);
  --good: #4ade80;
  --bad: #f87171;
  --warn: #fbbf24;
  --head: "Catamaran", "Noto Sans Tamil", "Inter", sans-serif;
  --body: "Noto Sans Tamil", "Inter", sans-serif;
  --num: "Inter", "Noto Sans Tamil", sans-serif;
  /* sizes, overridden per format */
  --pad-x: 72px;
  --top: 300px;
  --bottom: 560px;
  --h1: 92px; --h2: 70px; --t: 50px; --small: 34px; --cap: 46px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg0); }
body {
  color: var(--ink); font-family: var(--body);
  -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision;
}
body.long { --pad-x: 120px; --top: 170px; --bottom: 220px; --h1: 88px; --h2: 68px; --t: 48px; --small: 30px; --cap: 40px; }

#frame { position: absolute; inset: 0; overflow: hidden;
  background:
    radial-gradient(1100px 900px at 85% -10%, var(--accent-soft), transparent 60%),
    radial-gradient(900px 900px at -10% 110%, rgba(255,255,255,.05), transparent 60%),
    linear-gradient(160deg, var(--bg1), var(--bg0) 70%);
}
#grid { position: absolute; inset: 0; opacity: .5;
  background-image:
    linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
  background-size: 72px 72px;
  mask-image: radial-gradient(ellipse at 50% 40%, black 30%, transparent 80%);
}

/* top bar */
#top { position: absolute; left: var(--pad-x); right: var(--pad-x); top: 92px; display: flex; gap: 18px; align-items: center; }
body.long #top { top: 52px; }
.chip { font-family: var(--head); font-weight: 700; font-size: 32px; line-height: 1; padding: 16px 26px 12px; border-radius: 999px; border: 2px solid var(--line); background: rgba(255,255,255,.04); color: var(--ink); white-space: nowrap; }
.chip.brand { background: var(--accent); color: #06101f; border-color: var(--accent); }
.chip.cat { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 55%, transparent); }
body.long .chip { font-size: 28px; }
#ep { margin-left: auto; font-family: var(--num); font-weight: 700; font-size: 28px; color: var(--muted); }
#note { position: absolute; left: var(--pad-x); right: var(--pad-x); top: 168px; font-size: 26px; color: var(--muted); letter-spacing: .2px; }
body.long #note { top: auto; bottom: 34px; left: auto; right: var(--pad-x); font-size: 22px; }

/* main content box */
#content { position: absolute; left: var(--pad-x); right: var(--pad-x); top: var(--top); bottom: var(--bottom); display: flex; flex-direction: column; justify-content: center; }
body.short #content { right: calc(var(--pad-x) + 30px); }

/* caption */
#cap { position: absolute; left: var(--pad-x); right: calc(var(--pad-x) + 90px); bottom: 360px; min-height: 0; display: flex; justify-content: center; }
body.long #cap { left: 260px; right: 260px; bottom: 74px; }
#cap .box { font-family: var(--body); font-weight: 600; font-size: var(--cap); line-height: 1.42; text-align: center; padding: 18px 30px 14px; border-radius: 22px; background: rgba(3,8,20,.72); border: 1px solid var(--line); color: #fff; box-shadow: 0 10px 40px rgba(0,0,0,.35); }
#cap .box:empty { display: none; }

/* text helpers */
b.hl { color: var(--accent); font-weight: inherit; }
.hl2 { color: var(--warn); }
.good { color: var(--good); } .bad { color: var(--bad); }
.muted { color: var(--muted); }
.num { font-family: var(--num); }

h1.h { font-family: var(--head); font-weight: 800; font-size: var(--h1); line-height: 1.18; letter-spacing: -.5px; }
h2.h { font-family: var(--head); font-weight: 800; font-size: var(--h2); line-height: 1.2; margin-bottom: 40px; }
h2.h .k { display: block; font-size: .5em; font-weight: 700; color: var(--accent); letter-spacing: 2px; margin-bottom: 10px; text-transform: uppercase; }
.sub { font-size: calc(var(--t) * 1.05); color: var(--muted); line-height: 1.45; margin-top: 30px; }
.card { background: var(--card); border: 1.5px solid var(--line); border-radius: 30px; padding: 40px 44px; }
.icon { width: 200px; height: 200px; color: var(--accent); }
.icon svg { width: 100%; height: 100%; }

/* ---------- scene: hook / title ---------- */
.s-hook { text-align: left; }
.s-hook .icon { margin-bottom: 44px; width: 180px; height: 180px; padding: 30px; border-radius: 44px; background: var(--accent-soft); }
.s-hook h1.h { font-size: var(--h1); }
body.short .s-hook h1.h { font-size: 86px; }
body.long .s-hook { display: grid; grid-template-columns: 1fr auto; gap: 80px; align-items: center; }
body.long .s-hook .icon { order: 2; width: 300px; height: 300px; padding: 60px; margin: 0; }

/* ---------- define ---------- */
.s-define .label { font-family: var(--head); font-weight: 700; font-size: 34px; color: var(--accent); letter-spacing: 1px; margin-bottom: 18px; }
.s-define .term { font-family: var(--head); font-weight: 800; font-size: calc(var(--h1) * 1.05); line-height: 1.15; }
.s-define .term-en { font-family: var(--num); font-weight: 700; font-size: calc(var(--t) * 1.0); color: var(--muted); margin: 12px 0 40px; }
.s-define .card { font-size: calc(var(--t) * 1.04); line-height: 1.55; border-left: 10px solid var(--accent); }

/* ---------- points ---------- */
.list { display: flex; flex-direction: column; gap: 26px; }
.item { display: flex; gap: 26px; align-items: flex-start; font-size: var(--t); line-height: 1.42; padding: 24px 30px; border-radius: 24px; background: var(--card); border: 1.5px solid var(--line); }
.item .m { flex: 0 0 auto; width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; font-family: var(--num); font-weight: 800; font-size: 34px; background: var(--accent); color: #06101f; margin-top: -2px; }
.item .m svg { width: 38px; height: 38px; }
.item.check .m { background: var(--good); } .item.cross .m { background: var(--bad); }
.item.dot .m { width: 22px; height: 22px; margin-top: 20px; }
.item .sm { display: block; font-size: .72em; color: var(--muted); margin-top: 6px; }
.item.hidden, .row.hidden, .line.hidden, .bar.hidden, .node.hidden, .leg.hidden, .res.hidden, .ov.hidden, .slice.hidden { visibility: hidden; }
.item.dim { opacity: .55; }
body.long .list.two { display: grid; grid-template-columns: 1fr 1fr; gap: 24px 30px; }

/* ---------- compare ---------- */
.cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 22px; }
.cmp .head { font-family: var(--head); font-weight: 800; font-size: calc(var(--t) * 1.1); text-align: center; padding: 22px 16px 16px; border-radius: 22px; color: #06101f; }
.cmp .cell { font-size: calc(var(--t) * .92); line-height: 1.4; padding: 22px 26px; border-radius: 20px; background: var(--card); border: 1.5px solid var(--line); text-align: center; display: flex; align-items: center; justify-content: center; }
.cmp .row { display: contents; }

/* ---------- steps (worked example) ---------- */
.steps { display: flex; flex-direction: column; gap: 18px; }
.steps .line { font-size: var(--t); line-height: 1.4; padding: 18px 28px; border-left: 6px solid var(--line); background: rgba(255,255,255,.03); border-radius: 0 18px 18px 0; }
.steps .line .num { font-weight: 700; }
.steps .res { margin-top: 18px; font-family: var(--head); font-weight: 800; font-size: calc(var(--t) * 1.2); padding: 28px 34px; border-radius: 24px; background: var(--accent); color: #06101f; }
.tag { display: inline-block; font-family: var(--head); font-weight: 700; font-size: 28px; padding: 8px 18px 4px; border-radius: 12px; background: rgba(251,191,36,.15); color: var(--warn); margin-bottom: 22px; }

/* ---------- stat ---------- */
.s-stat { text-align: center; }
.s-stat .lab { font-size: calc(var(--t) * 1.05); color: var(--muted); line-height: 1.4; margin-bottom: 26px; }
.s-stat .vals { display: flex; align-items: center; justify-content: center; gap: 36px; flex-wrap: wrap; }
.s-stat .v { font-family: var(--num); font-weight: 800; font-size: calc(var(--h1) * 1.55); line-height: 1.1; color: var(--accent); }
.s-stat .v.to { color: var(--warn); }
.s-stat .arrow { font-family: var(--num); font-size: calc(var(--h1) * 1.1); color: var(--muted); }
.s-stat .cap2 { font-size: var(--t); line-height: 1.45; margin-top: 30px; }

/* ---------- charts ---------- */
.chart { width: 100%; }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { font-family: "Noto Sans Tamil", "Inter", sans-serif; fill: var(--muted); }
.chart .axis { stroke: rgba(255,255,255,.25); stroke-width: 3; }
.chart .gridl { stroke: rgba(255,255,255,.07); stroke-width: 2; }
.series { fill: none; stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; }

.bars { display: flex; align-items: flex-end; justify-content: space-around; gap: 30px; height: 760px; padding: 0 10px; border-bottom: 3px solid rgba(255,255,255,.25); }
body.long .bars { height: 400px; }
.bar { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
.bar .val { font-family: var(--num); font-weight: 800; font-size: calc(var(--t) * .9); margin-bottom: 14px; white-space: nowrap; }
.bar .col { width: 100%; max-width: 190px; border-radius: 18px 18px 6px 6px; background: var(--accent); transform-origin: bottom; }
.bar-labels { display: flex; justify-content: space-around; gap: 30px; padding: 18px 10px 0; }
.bar-labels div { flex: 1; text-align: center; font-size: calc(var(--t) * .78); line-height: 1.3; color: var(--muted); }
.bar-labels div.hidden { visibility: hidden; }

.donut-wrap { display: flex; align-items: center; gap: 50px; }
body.short .donut-wrap { flex-direction: column; gap: 40px; }
.donut { width: 520px; height: 520px; flex: 0 0 auto; }
.legend { display: flex; flex-direction: column; gap: 20px; flex: 1; width: 100%; }
.leg { display: flex; align-items: center; gap: 22px; font-size: var(--t); line-height: 1.35; padding: 16px 24px; border-radius: 18px; background: var(--card); border: 1.5px solid var(--line); }
.leg .sw { width: 34px; height: 34px; border-radius: 10px; flex: 0 0 auto; }
.leg .pc { margin-left: auto; font-family: var(--num); font-weight: 800; }

/* ---------- flow ---------- */
.flow { display: flex; flex-direction: column; align-items: stretch; gap: 0; }
body.long .flow { flex-direction: row; align-items: center; }
.node { text-align: center; font-family: var(--head); font-weight: 700; font-size: calc(var(--t) * 1.0); line-height: 1.3; padding: 26px 26px 20px; border-radius: 24px; background: var(--card); border: 2px solid color-mix(in srgb, var(--accent) 60%, transparent); }
body.long .node { flex: 1; }
.node .sm { display: block; font-family: var(--body); font-weight: 500; font-size: .7em; color: var(--muted); margin-top: 6px; }
.arr { text-align: center; color: var(--accent); font-family: var(--num); font-size: 56px; line-height: 1; padding: 10px 0; }
body.long .arr { padding: 0 14px; }
.arr.hidden { visibility: hidden; }

/* ---------- formula ---------- */
.formula { font-family: var(--num); font-weight: 700; font-size: calc(var(--h2) * .8); text-align: center; line-height: 1.35; padding: 44px 30px; border-radius: 30px; background: var(--accent-soft); border: 2px solid color-mix(in srgb, var(--accent) 60%, transparent); margin-bottom: 36px; }
.formula .fta { font-family: var(--head); }
.legs { display: flex; flex-direction: column; gap: 16px; }
.legs .leg .sym { font-family: var(--num); font-weight: 800; color: var(--accent); min-width: 90px; }

/* ---------- takeaway ---------- */
.s-take .label { display: flex; align-items: center; gap: 18px; font-family: var(--head); font-weight: 800; font-size: 40px; color: var(--accent); margin-bottom: 30px; }
.s-take .label svg { width: 60px; height: 60px; }
.s-take .card { font-family: var(--head); font-weight: 700; font-size: calc(var(--h2) * .95); line-height: 1.38; border: 3px solid var(--accent); background: var(--accent-soft); padding: 54px 50px; }

/* ---------- auto scenes ---------- */
.s-intro .lab { font-family: var(--head); font-weight: 700; font-size: 40px; color: var(--accent); margin-bottom: 20px; }
.s-intro h1.h { font-size: calc(var(--h1) * 1.15); }
.s-intro .en { font-family: var(--num); font-weight: 600; font-size: calc(var(--t) * 1.1); color: var(--muted); margin-top: 24px; }
.s-disc .icon { width: 130px; height: 130px; margin-bottom: 26px; color: var(--warn); }
.s-disc .ttl { font-family: var(--head); font-weight: 800; font-size: var(--h2); margin-bottom: 24px; }
.s-disc .card { font-size: calc(var(--t) * .84); line-height: 1.55; border-left: 10px solid var(--warn); }
.s-disc .cta { margin-top: 40px; font-family: var(--head); font-weight: 800; font-size: calc(var(--t) * 1.05); color: var(--accent); }
.s-risk .card { font-family: var(--head); font-weight: 800; font-size: var(--h2); line-height: 1.35; border: 3px solid var(--bad); background: rgba(248,113,113,.10); }
.s-risk .icon { color: var(--bad); width: 150px; height: 150px; margin-bottom: 30px; }

/* ---------- thumbnail ---------- */
body.thumb #top, body.thumb #note, body.thumb #cap { display: none; }
.th { position: absolute; inset: 0; padding: 60px 70px; display: flex; flex-direction: column; justify-content: center; }
.th .cat { align-self: flex-start; font-family: var(--head); font-weight: 800; font-size: 40px; padding: 14px 28px 8px; border-radius: 16px; background: var(--accent); color: #06101f; margin-bottom: 28px; }
.th h1 { font-family: var(--head); font-weight: 800; font-size: 112px; line-height: 1.1; width: 790px; text-shadow: 0 6px 30px rgba(0,0,0,.5); }
.th h1 b { color: var(--accent); }
.th .en { font-family: var(--num); font-weight: 800; font-size: 46px; color: var(--warn); margin-top: 22px; }
.th .icon { position: absolute; right: 70px; top: 50%; transform: translateY(-50%); width: 300px; height: 300px; padding: 50px; border-radius: 70px; background: var(--accent-soft); }
.th .brand { position: absolute; left: 70px; bottom: 40px; font-family: var(--head); font-weight: 700; font-size: 32px; color: var(--muted); }

/* ---------- animations ---------- */
@keyframes up { from { opacity: 0; transform: translateY(46px); } to { opacity: 1; transform: none; } }
@keyframes pop { 0% { opacity: 0; transform: scale(.82); } 70% { opacity: 1; transform: scale(1.03); } 100% { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes grow { from { transform: scaleY(0); } to { transform: none; } }
@keyframes draw { from { stroke-dashoffset: var(--len); } to { stroke-dashoffset: 0; } }
@keyframes left { from { opacity: 0; transform: translateX(-60px); } to { opacity: 1; transform: none; } }
.a-up { animation: up .5s cubic-bezier(.2,.8,.2,1) both; }
.a-pop { animation: pop .5s cubic-bezier(.2,.8,.2,1) both; }
.a-fade { animation: fade .4s ease-out both; }
.a-left { animation: left .45s cubic-bezier(.2,.8,.2,1) both; }
.a-grow { animation: grow .6s cubic-bezier(.2,.8,.2,1) both; }
.a-draw { animation: draw 1.0s ease-in-out both; }
.d1 { animation-delay: .08s; } .d2 { animation-delay: .16s; } .d3 { animation-delay: .24s; }
</style>
</head>

  <div id="content"></div>

</div>

  doji: [[100,104,99,103],[103,108,102,107],[107,111,106,110],[110,114,106,110.3],[110,111,104,105],[105,106,100,101]],
  bullish_engulfing: [[112,113,107,108],[108,109,103,104],[104,105,99,100],[100,101,96,97],[96,104,95,103.5],[103.5,108,103,107]],
  bearish_engulfing: [[95,99,94,98],[98,103,97,102],[102,107,101,106],[106,110,105,109],[109.5,110.5,101,102],[102,103,97,98]],
  shooting_star: [[95,99,94,98],[98,103,97,102],[102,107,101,106],[106,116,105,106.8],[106,107,100,101],[101,102,96,97]],
  uptrend: [[100,103,99,102],[102,104,98,99],[99,106,98,105],[105,107,101,102],[102,110,101,109],[109,111,105,106],[106,114,105,113],[113,115,109,110],[110,118,109,117]],
  range: [[100,108,99,107],[107,110,103,104],[104,105,95,96],[96,100,94,99],[99,109,98,108],[108,110,104,105],[105,106,95,97],[97,101,95,100],[100,109,99,108],[108,110,103,104]],
};
function candleChart(sc, st) {
  const B = chartBox();
  const cs = sc.candles || PRESETS[sc.preset] || PRESETS.uptrend;
  const xs = cs.map((_, i) => i), ys = [];
  cs.forEach(c => { ys.push(c[1], c[2]); });
  (sc.hlines || []).forEach(h => ys.push(h.y));
  const S = scaler([-0.7, cs.length - 0.3], ys, B, .1);
  const w = Math.min(90, (B.W - B.l - B.r) / cs.length * 0.55);
  let body = axes(S, B, { yticks: sc.yticks, xlabel: sc.xlabel, ylabel: sc.ylabel });
  const hi = new Set(sc.highlight || []);
  cs.forEach((c, i) => {
    const [o, h, l, cl] = c, up = cl >= o, col = up ? '#26d07c' : '#ff5a6a';
    const x = S.X(i), yT = S.Y(Math.max(o, cl)), yB = S.Y(Math.min(o, cl));
    const anim = st.first ? `class="a-up" style="animation-delay:${(i * 0.06).toFixed(2)}s"` : '';
    const ring = hi.size && shown(sc.highlight_at ?? 1, st) && hi.has(i);
    body += `<g ${anim}>${ring ? `<rect x="${x - w}" y="${S.Y(h) - 24}" width="${w * 2}" height="${S.Y(l) - S.Y(h) + 48}" rx="22" fill="none" stroke="var(--warn)" stroke-width="5" class="${isNew(sc.highlight_at ?? 1, st) ? 'a-pop' : ''}"/>` : ''}
      <line x1="${x}" x2="${x}" y1="${S.Y(h)}" y2="${S.Y(l)}" stroke="${col}" stroke-width="5"/>
      <rect x="${x - w / 2}" y="${yT}" width="${w}" height="${Math.max(4, yB - yT)}" rx="5" fill="${col}"/></g>`;
  });
  if (sc.ma && shown(sc.ma_at ?? 1, st)) {
    const n = +sc.ma, pts = [];
    cs.forEach((c, i) => { if (i >= n - 1) { let s = 0; for (let k = i - n + 1; k <= i; k++) s += cs[k][3]; pts.push([i, s / n]); } });
    const L = plen(pts, S);
    body += `<path class="series ${isNew(sc.ma_at ?? 1, st) ? 'a-draw' : ''}" d="${pathOf(pts, S)}" stroke="var(--warn)" style="--len:${L}; stroke-dasharray:${L}; stroke-width:7"/>`;
  }
  body += overlays(sc, st, S, B);
  return `<svg viewBox="0 0 ${B.W} ${B.H}">${body}</svg>`;
}

// Shrink a scene that would overflow its box (long Tamil words, extra items).
function fit(content) {
  const inner = content.firstElementChild;
  if (!inner) return;
  inner.style.zoom = 1;
  const availH = content.clientHeight, availW = content.clientWidth;
  const needH = inner.scrollHeight, needW = inner.scrollWidth;
  const k = Math.min(1, availH / needH, availW / needW);
  if (k < 1) inner.style.zoom = Math.max(0.55, k * 0.98);
}

// ---------- public API used by render.py ----------
window.stage = {
  setup(o) {
    document.body.className = o.format === 'long' ? 'long' : 'short';
    if (o.thumb) document.body.classList.add('thumb');
    const r = document.documentElement.style;
    r.setProperty('--accent', o.accent);
    r.setProperty('--accent-soft', o.accentSoft);
    $('#brand').textContent = o.brand || '';
    $('#cat').textContent = o.category || '';
    $('#ep').textContent = o.episode || '';
    $('#note').textContent = o.note || '';
    if (!o.captions) $('#cap').style.display = 'none';
  },
  show(scene, st, caption, capNew) {
    const fn = SCENES[scene.type];
    if (!fn) throw new Error('unknown scene type ' + scene.type);
    const content = $('#content');
    content.innerHTML = fn(scene, st);
    fit(content);
    const box = $('#cap .box');
    box.textContent = caption || '';
    box.className = 'box' + (capNew ? ' a-fade' : '');
    document.getAnimations().forEach(a => a.pause());
    return true;
  },
  seek(ms) {
    document.getAnimations().forEach(a => { a.pause(); a.currentTime = ms; });
  },
  thumb(t) {
    $('#content').innerHTML = '';
    $('#frame').insertAdjacentHTML('beforeend', `<div class="th"><div class="cat">${fmt(t.category)}</div><h1>${fmt(t.title)}</h1>${t.sub ? `<div class="en">${fmt(t.sub)}</div>` : ''}<div class="brand">${fmt(t.brand)}</div></div>`);
    $('.th').insertAdjacentHTML('beforeend', icon(t.icon || 'rupee'));
    const h = $('.th h1'), th = $('.th');
    let size = 112;
    while (size > 56 && (h.scrollWidth > h.clientWidth + 1 || th.scrollHeight > th.clientHeight + 1)) {
      size -= 4; h.style.fontSize = size + 'px';
    }
  },
};
</script>
