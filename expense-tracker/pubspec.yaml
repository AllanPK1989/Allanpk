name: expense_budget_manager
description: "Expense & Budget Manager - a family-friendly expense and budget tracker with detailed analysis, shared households and PDF/Excel reports."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.0

  # State & navigation
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4

  # Firebase backend (auth, database, receipt storage)
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  firebase_storage: ^14.0.1
  # Charts & animation
  fl_chart: ^1.3.1
  flutter_animate: ^4.5.2
  flutter_slidable: ^5.2.0

  # Reports & files
  pdf: ^3.12.0
  printing: ^5.14.3
  excel: ^4.0.6
  csv: ^8.0.0
  share_plus: ^13.3.1
  path_provider: ^2.1.6
  file_picker: ^13.3.3
  image_picker: ^1.2.4

  # Device features
  shared_preferences: ^2.5.6

  # Utilities
  intl: ^0.20.3
  http: ^1.6.0
  uuid: ^4.6.0
  collection: ^1.19.1
  crypto: ^3.0.8
  web: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/OFL-Inter.txt
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
