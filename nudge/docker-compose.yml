# Nudge: one command to run everything.   docker compose up -d
# Settings come from .env (copy .env.example). Without .env it starts in demo mode:
# sample tasks, PIN 1234, built-in rules instead of Claude, on https://localhost.
name: nudge

services:
  api:
    build: ./backend
    image: nudge-api:local
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
      STT_PROVIDER: ${STT_PROVIDER:-openai_compat}
      STT_BASE_URL: ${STT_BASE_URL:-http://whisper:8000/v1}
      STT_MODEL: ${WHISPER_MODEL:-small.en}
      SEED_SAMPLE_DATA: ${SEED_SAMPLE_DATA:-true}
      TZ: ${TZ:-Asia/Kolkata}
    volumes:
      - data:/data
    restart: unless-stopped

  # Speech to text on your own server (recordings never leave it). The model downloads once on
  # first start (about 500 MB for small.en) and is kept in the "models" volume.
  whisper:
    build: ./stt
    image: nudge-whisper:local
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-small.en}
    volumes:
      - models:/models
    restart: unless-stopped

  web:
    build: ./frontend
    image: nudge-web:local
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      CADDY_TLS: ${CADDY_TLS:-internal}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./certs:/certs:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  data:
  models:
  caddy_data:
  caddy_config:
