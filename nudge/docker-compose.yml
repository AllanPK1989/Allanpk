# Nudge: one command to run everything.   docker compose up -d
# Settings come from .env (copy .env.example). Without .env it starts in demo mode:
# sample tasks and PIN 1234, on https://localhost.
# Free to run, no accounts or API keys, and nothing about your tasks leaves this machine.
name: nudge

services:
  api:
    build: ./backend
    image: nudge-api:local
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
      STT_PROVIDER: ${STT_PROVIDER:-openai_compat}
      STT_BASE_URL: ${STT_BASE_URL:-http://whisper:8000/v1}
      STT_MODEL: ${WHISPER_MODEL:-small.en}
      SEED_SAMPLE_DATA: ${SEED_SAMPLE_DATA:-true}
      TZ: ${TZ:-Asia/Kolkata}
    volumes:
      - data:/data
    restart: unless-stopped

  # Speech to text on your own server (recordings never leave it). The model downloads once on
  # first start (about 500 MB for small.en) and is kept in the "models" volume. After that,
  # set WHISPER_OFFLINE=1 and it never goes online again.
  whisper:
    build: ./stt
    image: nudge-whisper:local
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-small.en}
      HF_HUB_OFFLINE: ${WHISPER_OFFLINE:-0}
      HF_HUB_DISABLE_TELEMETRY: "1"
      DO_NOT_TRACK: "1"
    volumes:
      - models:/models
    restart: unless-stopped

  web:
    build: ./frontend
    image: nudge-web:local
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      TLS_MODE: ${TLS_MODE:-internal}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./certs:/certs:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  data:
  models:
  caddy_data:
  caddy_config:
