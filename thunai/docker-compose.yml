# Thunai: one command to run everything.   docker compose up -d
# Settings come from .env (copy .env.example). Without .env it starts in demo mode
# (rules engine, SAMPLE data) on https://localhost.
name: thunai

x-backend: &backend
  build: ./backend
  image: thunai-backend:local
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql+psycopg://thunai:${POSTGRES_PASSWORD:-thunai-change-me}@db:5432/thunai
    REDIS_URL: redis://redis:6379/0
    JOBS_MODE: rq
    MEDIA_DIR: /data/media
  volumes:
    - media:/data/media
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started
  restart: unless-stopped

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: thunai
      POSTGRES_USER: thunai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-thunai-change-me}
      TZ: Asia/Kolkata
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thunai -d thunai"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped

  api:
    <<: *backend

  worker:
    <<: *backend
    # Background jobs (translation, classification, offline transcription) plus a daily
    # clean-up of audio files older than the retention period.
    command: >
      sh -c "while true; do python -m app.cli purge-media; sleep 86400; done &
             exec rq worker --url redis://redis:6379/0 --path /app thunai"
    healthcheck:
      disable: true  # no HTTP server in this container
    depends_on:
      api:
        condition: service_healthy

  web:
    build: ./frontend
    image: thunai-web:local
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      CADDY_TLS: ${CADDY_TLS:-internal}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./certs:/certs:ro
    depends_on:
      - api
    restart: unless-stopped

  backup:
    image: pgvector/pgvector:pg16
    entrypoint: ["sh", "/backup.sh"]
    environment:
      PGHOST: db
      PGUSER: thunai
      PGDATABASE: thunai
      PGPASSWORD: ${POSTGRES_PASSWORD:-thunai-change-me}
      BACKUP_HOUR: ${BACKUP_HOUR:-2}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: Asia/Kolkata
    volumes:
      - ./backups:/backups
      - ./ops/backup.sh:/backup.sh:ro
    depends_on:
      api:
        condition: service_healthy  # migrations have run
    restart: unless-stopped

volumes:
  dbdata:
  media:
  caddy_data:
  caddy_config:
