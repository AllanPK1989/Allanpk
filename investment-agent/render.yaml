# Render Blueprint. In Render: New -> Blueprint -> pick this repo -> Blueprint path: investment-agent/render.yaml
# Values marked sync:false are asked for when you create it (see README "Deploy").
# Email: digests are sent from and to financeforpk@gmail.com (also the push contact); only its app password is secret.
services:
  - type: web
    name: investment-analyst
    runtime: docker
    plan: free
    region: singapore   # closest Render region to India; create the Neon database in AWS Singapore too
    rootDir: investment-agent
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATA_MODE
        value: live
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: OWNER_PASSWORD_HASH
        sync: false
      - key: BASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GMAIL_USER
        value: financeforpk@gmail.com
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
