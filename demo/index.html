<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kinetic Lattice — Three.js Demo</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #06070d; }
  canvas { display: block; }

  .hud {
    position: fixed; top: 24px; left: 24px; z-index: 10;
    font: 400 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #8b93b0; pointer-events: none; user-select: none;
  }
  .hud h1 {
    font-size: 15px; font-weight: 600; letter-spacing: .14em;
    text-transform: uppercase; color: #e8ecf8; margin-bottom: 6px;
  }
  .hud p { max-width: 30ch; }
  .hud .keys { margin-top: 14px; display: grid; gap: 3px; }
  .hud .keys span { color: #5d6480; }
  .hud kbd {
    color: #b9c2dd; background: #161a28; border: 1px solid #262c40;
    border-radius: 4px; padding: 1px 6px; font: inherit; font-size: 11px;
  }

  .stats {
    position: fixed; bottom: 24px; left: 24px; z-index: 10;
    font: 400 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #5d6480; user-select: none; pointer-events: none;
  }
  .stats b { color: #9aa3c0; font-weight: 500; }

  .loader {
    position: fixed; inset: 0; z-index: 20; display: grid; place-items: center;
    background: #06070d; color: #5d6480;
    font: 400 13px ui-monospace, Menlo, monospace; letter-spacing: .1em;
    transition: opacity .6s ease; text-transform: uppercase;
  }
  .loader.hidden { opacity: 0; pointer-events: none; }
  .err { color: #ff8f8f; max-width: 40ch; text-align: center; line-height: 1.6; }
</style>
</head>
<body>

<div class="loader" id="loader"><span id="loader-text">Initialising renderer</span></div>

<div class="hud">
  <h1>Kinetic Lattice</h1>
  <p>An instanced wave field around a refractive core.</p>
  <div class="keys">
    <span><kbd>drag</kbd> orbit &nbsp; <kbd>scroll</kbd> zoom</span>
    <span><kbd>click</kbd> shift palette</span>
    <span><kbd>space</kbd> pause &nbsp; <kbd>r</kbd> auto-rotate</span>
  </div>
</div>

<div class="stats" id="stats"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls }    from 'three/addons/controls/OrbitControls.js';
import { EffectComposer }   from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }       from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass }  from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass }       from 'three/addons/postprocessing/OutputPass.js';
import { RoomEnvironment }  from 'three/addons/environments/RoomEnvironment.js';

// ─────────────────────────────────────────────────────────────
// Config
// ─────────────────────────────────────────────────────────────
const GRID     = 26;            // GRID × GRID instances
const SPACING  = 0.46;
const COUNT    = GRID * GRID;

const PALETTES = [
  { a: 0x5b8cff, b: 0xc86bff, core: 0x9db4ff, key: 0xfff2e0 },
  { a: 0x00e0a4, b: 0x4d7cff, core: 0x8ff5dd, key: 0xe6fffa },
  { a: 0xff7a45, b: 0xffd166, core: 0xffb08a, key: 0xfff0dd },
  { a: 0xff5f9e, b: 0x7a5cff, core: 0xffa8d2, key: 0xffe8f2 },
];
let paletteIndex = 0;

// ─────────────────────────────────────────────────────────────
// Scene / camera / renderer
// ─────────────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x06070d);
scene.fog = new THREE.Fog(0x06070d, 14, 30);

const camera = new THREE.PerspectiveCamera(
  50, window.innerWidth / window.innerHeight, 0.1, 100
);
camera.position.set(8.8, 7.4, 11.5);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type    = THREE.PCFSoftShadowMap;
renderer.toneMapping       = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace  = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

// Image-based lighting: a procedural room, prefiltered into an env map.
// Without this, transmission and clearcoat have nothing to refract and read as flat grey.
const pmrem = new THREE.PMREMGenerator(renderer);
pmrem.compileEquirectangularShader();
const envRT = pmrem.fromScene(new RoomEnvironment(), 0.04);
scene.environment = envRT.texture;
pmrem.dispose();

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping  = true;
controls.dampingFactor  = 0.05;
controls.minDistance    = 5;
controls.maxDistance    = 28;
controls.maxPolarAngle  = Math.PI * 0.495;   // never go under the floor
controls.target.set(0, 1.5, 0);
controls.autoRotate      = true;
controls.autoRotateSpeed = 0.45;

// ─────────────────────────────────────────────────────────────
// Lighting — three-point rig + ambient base
// ─────────────────────────────────────────────────────────────
const ambient = new THREE.AmbientLight(0x404a6b, 1.1);
scene.add(ambient);

const hemi = new THREE.HemisphereLight(0x8fa8ff, 0x0a0a12, 0.55);
scene.add(hemi);

const keyLight = new THREE.DirectionalLight(0xfff2e0, 2.4);
keyLight.position.set(6, 11, 6);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.near = 1;
keyLight.shadow.camera.far  = 34;
keyLight.shadow.camera.left = -10;
keyLight.shadow.camera.right = 10;
keyLight.shadow.camera.top   = 10;
keyLight.shadow.camera.bottom = -10;
keyLight.shadow.bias = -0.0012;
keyLight.shadow.radius = 3;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0x5b8cff, 0.75);
fillLight.position.set(-8, 4, -3);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0xc86bff, 1.1);
rimLight.position.set(-2, 3.5, -9);
scene.add(rimLight);

const coreGlow = new THREE.PointLight(0x9db4ff, 6, 12, 2);
coreGlow.position.set(0, 3.05, 0);
scene.add(coreGlow);

// ─────────────────────────────────────────────────────────────
// Ground
// ─────────────────────────────────────────────────────────────
const groundGeo = new THREE.CircleGeometry(17, 64);
const groundMat = new THREE.MeshStandardMaterial({
  color: 0x0b0d18, roughness: 0.88, metalness: 0.15,
});
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.35;
ground.receiveShadow = true;
ground.name = 'ground';
scene.add(ground);

// ─────────────────────────────────────────────────────────────
// Instanced wave field — one geometry + one material, COUNT instances
// ─────────────────────────────────────────────────────────────
const barGeo = new THREE.BoxGeometry(0.26, 1, 0.26);
barGeo.translate(0, 0.5, 0);              // pivot at the base so scale.y grows upward

const barMat = new THREE.MeshStandardMaterial({
  roughness: 0.32, metalness: 0.65, envMapIntensity: 0.85,
});

const bars = new THREE.InstancedMesh(barGeo, barMat, COUNT);
bars.instanceMatrix.setUsage(THREE.DynamicDrawUsage);   // updated every frame
bars.castShadow = true;
bars.receiveShadow = true;
scene.add(bars);

// Precompute per-instance static data (never allocate inside the loop)
const offsets = new Float32Array(COUNT * 2);
const radii   = new Float32Array(COUNT);
const half    = (GRID - 1) / 2;

for (let i = 0, k = 0; i < GRID; i++) {
  for (let j = 0; j < GRID; j++, k++) {
    const x = (i - half) * SPACING;
    const z = (j - half) * SPACING;
    offsets[k * 2]     = x;
    offsets[k * 2 + 1] = z;
    radii[k] = Math.hypot(x, z);
  }
}

// Scratch objects reused every frame
const dummy = new THREE.Object3D();
const tint  = new THREE.Color();
const colA  = new THREE.Color();
const colB  = new THREE.Color();

function applyPalette(index) {
  const p = PALETTES[index % PALETTES.length];
  colA.setHex(p.a);
  colB.setHex(p.b);
  core.material.color.setHex(p.core);
  core.material.emissive.setHex(p.core).multiplyScalar(0.55);
  coreGlow.color.setHex(p.core);
  keyLight.color.setHex(p.key);
  rimLight.color.setHex(p.b);
  fillLight.color.setHex(p.a);
}

// ─────────────────────────────────────────────────────────────
// Refractive core
// ─────────────────────────────────────────────────────────────
const core = new THREE.Mesh(
  new THREE.IcosahedronGeometry(1.15, 1),
  new THREE.MeshPhysicalMaterial({
    color: 0x9db4ff,
    roughness: 0.06,
    metalness: 0.0,
    transmission: 0.85,
    envMapIntensity: 1.6,
    thickness: 1.4,
    ior: 1.45,
    clearcoat: 1.0,
    clearcoatRoughness: 0.06,
    emissive: 0x9db4ff,
    emissiveIntensity: 0.55,
    flatShading: true,
  })
);
core.position.y = 3.05;
core.castShadow = true;
core.name = 'core';
scene.add(core);

// A thin halo ring for silhouette
const ring = new THREE.Mesh(
  new THREE.TorusGeometry(2.05, 0.012, 12, 128),
  new THREE.MeshBasicMaterial({ color: 0x9db4ff, transparent: true, opacity: 0.5 })
);
ring.rotation.x = Math.PI / 2;
ring.position.y = 3.05;
scene.add(ring);

applyPalette(paletteIndex);

// ─────────────────────────────────────────────────────────────
// Post-processing
// ─────────────────────────────────────────────────────────────
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  0.50,   // strength
  0.72,   // radius
  0.80    // threshold
);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// ─────────────────────────────────────────────────────────────
// Interaction
// ─────────────────────────────────────────────────────────────
const raycaster = new THREE.Raycaster();
const pointer   = new THREE.Vector2();
let pulse = 0;               // click ripple energy
let paused = false;

function onPointerDown(event) {
  pointer.x =  (event.clientX / window.innerWidth)  * 2 - 1;
  pointer.y = -(event.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);

  const hit = raycaster.intersectObjects([bars, core, ground], false);
  if (hit.length > 0) {
    paletteIndex = (paletteIndex + 1) % PALETTES.length;
    applyPalette(paletteIndex);
    pulse = 1;
  }
}
renderer.domElement.addEventListener('pointerdown', onPointerDown);

window.addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); paused = !paused; }
  if (e.key === 'r' || e.key === 'R') controls.autoRotate = !controls.autoRotate;
});

// ─────────────────────────────────────────────────────────────
// Resize
// ─────────────────────────────────────────────────────────────
function onResize() {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  composer.setSize(w, h);
  bloom.setSize(w, h);
}
window.addEventListener('resize', onResize);

// ─────────────────────────────────────────────────────────────
// Animation loop — delta-timed, frame-rate independent
// ─────────────────────────────────────────────────────────────
const clock = new THREE.Clock();
let elapsed = 0;

const statsEl = document.getElementById('stats');
let fpsAccum = 0, fpsFrames = 0, fps = 0;

function updateBars(t) {
  for (let k = 0; k < COUNT; k++) {
    const x = offsets[k * 2];
    const z = offsets[k * 2 + 1];
    const r = radii[k];

    // Two travelling waves + a click-driven ripple
    let h =
      Math.sin(r * 1.15 - t * 1.9) * 0.5 +
      Math.sin(x * 0.75 + t * 0.9) * 0.22 +
      Math.cos(z * 0.75 - t * 0.75) * 0.22;

    if (pulse > 0.001) h += Math.sin(r * 2.4 - t * 7.0) * pulse * 0.55;

    const height = 0.16 + Math.max(0, h + 0.62) * 0.95;

    dummy.position.set(x, 0, z);
    dummy.scale.set(1, height, 1);
    dummy.updateMatrix();
    bars.setMatrixAt(k, dummy.matrix);

    // Colour by height, fading out toward the rim
    const mix = THREE.MathUtils.clamp((height - 0.16) / 1.5, 0, 1);
    tint.copy(colA).lerp(colB, mix);
    tint.multiplyScalar(0.45 + mix * 0.75);
    bars.setColorAt(k, tint);
  }
  bars.instanceMatrix.needsUpdate = true;
  if (bars.instanceColor) bars.instanceColor.needsUpdate = true;
}

function animate() {
  const dt = Math.min(clock.getDelta(), 0.05);   // clamp after tab-out
  if (!paused) elapsed += dt;
  const t = elapsed;

  pulse *= Math.pow(0.12, dt);        // exponential decay, frame independent

  updateBars(t);

  core.rotation.y += dt * 0.32;
  core.rotation.x += dt * 0.14;
  core.position.y = 3.05 + Math.sin(t * 0.85) * 0.18;
  coreGlow.position.copy(core.position);
  coreGlow.intensity = 6 + Math.sin(t * 2.1) * 1.4 + pulse * 10;

  ring.position.y = core.position.y;
  ring.rotation.z += dt * 0.22;
  ring.material.opacity = 0.35 + Math.sin(t * 1.4) * 0.12 + pulse * 0.4;

  controls.update();
  composer.render();

  // FPS readout, refreshed twice a second
  fpsAccum += dt; fpsFrames++;
  if (fpsAccum >= 0.5) {
    fps = Math.round(fpsFrames / fpsAccum);
    fpsAccum = 0; fpsFrames = 0;
    statsEl.innerHTML =
      `<b>${COUNT}</b> instances · <b>1</b> draw call for the field<br>` +
      `<b>${fps}</b> fps · ${renderer.info.render.triangles.toLocaleString()} triangles`;
  }
}
renderer.setAnimationLoop(animate);

// ─────────────────────────────────────────────────────────────
// Teardown
// ─────────────────────────────────────────────────────────────
function dispose() {
  renderer.setAnimationLoop(null);
  scene.traverse((o) => {
    if (o.geometry) o.geometry.dispose();
    if (o.material) [].concat(o.material).forEach((m) => m.dispose());
  });
  envRT.dispose();
  composer.dispose();
  renderer.dispose();
  controls.dispose();
}
window.addEventListener('beforeunload', dispose);

// Reveal once the first frame is on screen
requestAnimationFrame(() => requestAnimationFrame(() => {
  document.getElementById('loader').classList.add('hidden');
  window.__demoReady = true;
}));

// Surface a clear message if WebGL is unavailable
if (!renderer.getContext()) {
  document.getElementById('loader-text').outerHTML =
    '<p class="err">WebGL is unavailable in this browser.</p>';
}
</script>
</body>
</html>
