<text x="28" y="304" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#1A1F26" text-anchor="start" font-weight="normal" font-style="normal">Maintenance is who cuts a cure short with an early reset. If the maintenance passcode could also</text>
